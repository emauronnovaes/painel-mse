                const medidoComposto = totalFd + totalRetencao + totalFaturado;

                return (
                  <div style={{ marginTop:24, paddingTop:16, borderTop:'1px dashed #eef0f3' }}>
                    <div className="mono" style={{ fontSize:11, fontWeight:700, color:T.mut, textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:12 }}>Totais Financeiros da Obra</div>
                    
                    <div style={{ display:'flex', gap:12, marginBottom:16 }}>
                      <div style={{ flex:1, background:'#f7f8fa', padding:'12px 14px', borderRadius:8, border:'1px solid #eef0f3' }}>
                        <div style={{ fontSize:11, color:T.mut, marginBottom:6 }}>Previsto (Valor do Contrato)</div>
                        <div className="mono" style={{ fontSize:15, fontWeight:700, color:T.ink }}>{valorContrato != null ? fmtReais(valorContrato) : '—'}</div>
                      </div>
                      <div style={{ flex:1, background:'rgba(31,157,87,0.06)', padding:'12px 14px', borderRadius:8, border:'1px solid rgba(31,157,87,0.15)' }}>
                        <div style={{ fontSize:11, color:T.green, marginBottom:6, fontWeight:600 }}>Medido (FD + Ret. + Fat.)</div>
                        <div className="mono" style={{ fontSize:15, fontWeight:700, color:T.green }}>{fmtReais(medidoComposto)}</div>
                      </div>
                    </div>

                    <div style={{ display:'flex', justifyContent:'space-between', padding:'8px 4px', borderBottom:'1px solid #eef0f3', fontSize:13, color:T.body }}>
                      <span>Desconto FD</span>
                      <span className="mono" style={{ fontWeight:600, color:T.ink }}>{fmtReais(totalFd)}</span>
                    </div>
                    <div style={{ display:'flex', justifyContent:'space-between', padding:'8px 4px', borderBottom:'1px solid #eef0f3', fontSize:13, color:T.body }}>
                      <span>Retenção</span>
                      <span className="mono" style={{ fontWeight:600, color:T.ink }}>{fmtReais(totalRetencao)}</span>
                    </div>
                    <div style={{ display:'flex', justifyContent:'space-between', padding:'8px 4px', fontSize:13, color:T.body }}>
                      <span>Faturado</span>
                      <span className="mono" style={{ fontWeight:600, color:T.ink }}>{fmtReais(totalFaturado)}</span>
                    </div>
                  </div>
                );
              })()}
              
            </div>
          </div>
        </div>
      )}
      {linhaSelecionada && (() => {
        // Cálculos de Saldo (Previsto - Realizado)
        const saldoPrev = linhaSelecionada.saldo_previsto_acumulado;
        const saldoReal = linhaSelecionada.saldo_realizado_acumulado_medido;
        const diffSaldo = (saldoReal != null && saldoPrev != null) ? saldoPrev - saldoReal : null;
        const corSaldo = diffSaldo > 0 ? T.green : diffSaldo < 0 ? T.red : T.mut;

        // Cálculos de Avanço (Realizado - Previsto)
        const avancoPrev = linhaSelecionada.avanco_previsto_acumulado;
        const avancoReal = linhaSelecionada.avanco_realizado_acumulado;
        const diffAvanco = (avancoReal != null && avancoPrev != null) ? avancoReal - avancoPrev : null;
        const corAvanco = diffAvanco > 0 ? T.green : diffAvanco < 0 ? T.red : T.mut;

        return (
          <div onClick={() => setLinhaSelecionada(null)} className="modal-overlay-in" style={{ position:'fixed', inset:0, zIndex:10001, background:'rgba(16,24,40,0.45)', backdropFilter:'blur(3px)', display:'flex', alignItems:'center', justifyContent:'center', padding:24 }}>
            <div onClick={e => e.stopPropagation()} className="modal-card-in" style={{ background:'#fff', border:'1px solid #e4e7ec', borderRadius:16, width:'100%', maxWidth:460, maxHeight:'68vh', display:'flex', flexDirection:'column', overflow:'hidden', boxShadow:'0 24px 60px -12px rgba(16,24,40,0.25)' }}>
              <div style={{ padding:'14px 20px', borderBottom:'1px solid #eef0f3', display:'flex', alignItems:'center', gap:12, flexShrink:0 }}>
                <div style={{ flex:1, minWidth:0 }}>
                  <div className="mono" style={{ fontSize:10, letterSpacing:'0.16em', color:T.mut2, textTransform:'uppercase', fontWeight:600, marginBottom:4 }}>Detalhes do Boletim</div>
                  <div style={{ fontSize:15, fontWeight:700, color:T.ink }}>BM {bmCurto(linhaSelecionada.bm_label) || '—'}</div>
                </div>
                <button onClick={() => setLinhaSelecionada(null)} style={{ background:'#eef0f3', border:'none', color:T.mut, borderRadius:10, padding:'7px 12px', cursor:'pointer', fontSize:15, lineHeight:1, flexShrink:0 }}>✕</button>
              </div>
              
              <div style={{ overflowY:'auto', flex:1, minHeight:0, padding:'6px 20px 20px' }}>

                {/* BLOCO DE AVANÇOS - INDICADOR DE PERFORMANCE FINANCEIRA */}
                <div style={{ padding:'12px 0' }}>
                  <div style={{ fontSize:11, fontWeight:700, color:T.mut, textTransform:'uppercase', letterSpacing:'0.06em', marginBottom:12 }}>Indicador de Performance Financeira</div>
                  <div style={{ display:'flex', justifyContent:'space-between', paddingBottom:'8px', fontSize:13, color:T.body }}>
                    <span>Avanço Previsto</span>
                    <span className="mono" style={{ fontWeight:600, color:T.ink }}>{avancoPrev != null ? fmtReais(avancoPrev) : '—'}</span>
                  </div>
                  <div style={{ display:'flex', justifyContent:'space-between', paddingBottom:'8px', fontSize:13, color:T.body }}>
                    <span>Avanço Realizado</span>
                    <span className="mono" style={{ fontWeight:600, color:T.ink }}>{avancoReal != null ? fmtReais(avancoReal) : '—'}</span>
                  </div>
                  <div style={{ display:'flex', justifyContent:'space-between', paddingTop:'4px', fontSize:13.5, color:T.ink, fontWeight:700 }}>
                    <span>Diferença de Avanço</span>
                    <span className="mono" style={{ color:corAvanco }}>
                      {diffAvanco != null ? (diffAvanco > 0 ? '+' : '') + fmtReais(diffAvanco) : '—'}
                    </span>
                  </div>
                </div>

              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

// ── Setor 2 — Desvios (legado — cartões de curvas_s/curva_avanco_historico,
// mantidos prontos porém fora de uso desde que o Setor 6 passou a usar a EAP
// diretamente; ver comentário em `App` sobre reativação) ────────────────────
function CardDesvio({ titulo, dado, unidade, fonteTexto, carregando, erro, atraso }){
  const valor = dado ? dado.valor : null;
  const cor = valor != null ? corDesvio(valor) : T.mut;
  let textoInferior;
  if (carregando) textoInferior = 'carregando…';
  else if (erro) textoInferior = 'erro ao carregar dado do Supabase';
  else if (dado) textoInferior = fonteTexto(dado);
  else textoInferior = 'sem dado disponível para esta obra';

  return (
    <div className="card hoverable card-enter" style={{ padding:24, flex:1, display:'flex', flexDirection:'column', gap:10, animationDelay: `${atraso}s` }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
        <div style={{ fontSize:14, fontWeight:700, color:T.body }}>{titulo}</div>
        {dado && dado.desatualizado && (
          <span className="mono" style={{ fontSize:10, letterSpacing:'0.05em', color:T.amber, background:'rgba(217,145,26,0.12)', padding:'3px 8px', borderRadius:6 }}>
            DADO DESATUALIZADO
          </span>
        )}
      </div>
      <div style={{ fontSize:44, fontWeight:700, color:cor, lineHeight:1 }}>
        {carregando ? '···' : (valor != null ? `${valor > 0 ? '+' : ''}${valor.toFixed(1)}${unidade}` : '—')}
      </div>
      <div style={{ fontSize:12, color: erro ? T.red : T.mut }}>{textoInferior}</div>
    </div>
  );
}

function SetorDesvios({ desvioFisico, desvioFinanceiro, carregandoFisico, carregandoFinanceiro, erroFisico, erroFinanceiro }){
  return (
    <div className="painel-gutter" style={{ display:'flex', gap:16, flexWrap:'wrap' }}>
      <CardDesvio titulo="Desvio Físico" dado={desvioFisico} unidade=" p.p." carregando={carregandoFisico} erro={erroFisico} atraso={0}
        fonteTexto={d => `curvas_s.acum_desvio — corte ${fmtDataCurta(d.data) || '—'}`} />
      <CardDesvio titulo="Desvio Financeiro" dado={desvioFinanceiro} unidade="%" carregando={carregandoFinanceiro} erro={erroFinanceiro} atraso={0.08}
        fonteTexto={d => `curva_avanco_historico — corte ${fmtDataCurta(d.data) || '—'}`} />
    </div>
  );
}

// ── Setores 3–6 — placeholder padrão ─────────────────────────────────────────
function IconeEmElaboracao(){
  return (
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
      <rect x="3" y="3" width="18" height="18" rx="4" stroke={T.mut2} strokeWidth="1.6" strokeDasharray="3,3" />
      <path d="M8 12h8M12 8v8" stroke={T.mut2} strokeWidth="1.6" strokeLinecap="round" />
    </svg>
  );
}

function SetorPlaceholder({ setor, obraId }){
  return (
    <div className="card card-enter placeholder-card painel-gutter" style={{ padding:'56px 40px', display:'flex', flexDirection:'column', alignItems:'center', textAlign:'center', gap:14 }}>
      <IconeEmElaboracao />
      <span className="mono" style={{ fontSize:11, letterSpacing:'0.15em', color:T.mut, textTransform:'uppercase' }}>Em elaboração</span>
      <div style={{ fontSize:18, fontWeight:700 }}>{setor.label}</div>
      <div style={{ fontSize:13, color:T.body, maxWidth:480, lineHeight:1.5 }}>{setor.desc}</div>
      <div className="mono" style={{ fontSize:11, color:T.mut2, marginTop:8 }}>rota já definitiva: /obra/{obraId}/{setor.slug}</div>
    </div>
  );
}

// ── Setor 9, provisório — Tour 360° (Constructin, embutido via iframe) ──────
// Domínio do Constructin (CloudFront/S3) não envia X-Frame-Options nem CSP
// frame-ancestors, então o iframe carrega normal. Rota SPA do Constructin usa
// hash (#/tour/...), então a URL completa (com #) precisa ir inteira no src.
function ModuloTour360({ obraId, obraNome }){
  const url = OBRA_TOUR_360[obraId];
  if (!url) {
    return (
      <div className="card card-enter placeholder-card painel-gutter" style={{ padding:'56px 40px', display:'flex', flexDirection:'column', alignItems:'center', textAlign:'center', gap:14 }}>
        <span className="mono" style={{ fontSize:11, letterSpacing:'0.15em', color:T.mut, textTransform:'uppercase' }}>Tour 360° indisponível</span>
        <div style={{ fontSize:13, color:T.body, maxWidth:480, lineHeight:1.5 }}>Nenhum tour cadastrado para {obraNome}.</div>
      </div>
    );
  }
  return (
    <div className="card tour-360-frame painel-gutter">
      <iframe src={url} title={`Tour 360° — ${obraNome}`} allowFullScreen />
    </div>
  );
}

// ── App ──────────────────────────────────────────────────────────────────────
function parseHash(){
  const m = window.location.hash.match(/^#\/obra\/(\d+)\/([a-z0-9-]+)/);
  return m ? { id: Number(m[1]), slug: m[2] } : null;
}

function App(){
  const inicial = parseHash();
  const [obraId, setObraId] = useState(
    inicial && OBRAS.some(o => o.id === inicial.id) ? inicial.id : OBRAS[0].id
  );
  const [setor, setSetor] = useState(
    (inicial && SETORES.find(s => s.slug === inicial.slug)) || SETORES[0]
  );
  useEffect(() => {
    window.location.hash = `#/obra/${obraId}/${setor.slug}`;
  }, [obraId, setor]);

  // Título da aba do navegador sempre "MSE - <Setor>" (pedido explícito),
  // independente da obra selecionada — só o setor muda o texto.
  useEffect(() => {
    document.title = `MSE - ${setor.label}`;
  }, [setor]);

  useEffect(() => {
    const onHash = () => {
      const h = parseHash();
      if (!h) return;
      if (OBRAS.some(o => o.id === h.id)) setObraId(h.id);
      const s = SETORES.find(s => s.slug === h.slug);
      if (s) setSetor(s);
    };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const obraAtual = OBRAS.find(o => o.id === obraId) || OBRAS[0];

  // Obras com mais de uma Curva S (hoje só NN - AP: PPU + C.O. consolidado,
  // PPU e C.O. separados) — botão troca qual chave `obra` filtra curvas_s.
  // Reseta pra padrão sempre que a obra muda (senão uma obra sem essa
  // variante herdaria uma chave de curva que não existe pra ela).
  const [curvaEscolhida, setCurvaEscolhida] = useState(null);
  useEffect(() => { setCurvaEscolhida(null); }, [obraId]);
  const curvaChaveAtual = curvaEscolhida || obraAtual.curvas?.[0]?.chave || obraAtual.curva;

  // ── Curva S (curvas_s — busca única para todas as obras, mesmo padrão de
  //    loadData() do dashboard atual). Campos com os mesmos nomes/convenção
  //    do CurvaLegendChart/LineSVG originais (Previsto/Realizado/Tendencia/
  //    SemPrevisto/SemRealizado) para reaproveitar o módulo sem tradução. ──
  const [curvasRaw, setCurvasRaw] = useState(null);   // null = carregando
  const [curvasErro, setCurvasErro] = useState(false);

  useEffect(() => {
    const sbHeaders = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };
    fetchPaginado(`${SUPABASE_URL}/rest/v1/curvas_s?select=obra,semana,data,acum_previsto,acum_realizado,acum_desvio,acum_tendencia,semanal_previsto,semanal_realizado,semanal_desvio,semanal_tendencia&order=obra.asc,semana.asc`, sbHeaders)
      .then(rows => {
        if (rows === null) { setCurvasErro(true); setCurvasRaw([]); }
        else setCurvasRaw(rows);
      })
      .catch(() => { setCurvasErro(true); setCurvasRaw([]); });
  }, []);

  const linhasCurva = useMemo(() => {
    if (!curvasRaw) return null;
    const todas = curvasRaw
      .filter(r => r.obra === curvaChaveAtual && parseValNum(r.acum_previsto) != null)
      .sort((a, b) => (a.semana || 0) - (b.semana || 0))
      .map(r => ({
        semana: Number(r.semana),
        data: r.data,
        Previsto: parseValNum(r.acum_previsto),
        Realizado: parseValNum(r.acum_realizado),
        Tendencia: parseValNum(r.acum_tendencia),
        Desvio: parseValNum(r.acum_desvio),
        SemPrevisto: parseValNum(r.semanal_previsto),
        SemRealizado: parseValNum(r.semanal_realizado),
        SemDesvio: parseValNum(r.semanal_desvio),
        SemTendencia: parseValNum(r.semanal_tendencia),
      }));
    // Mesma poda do dashboard atual: corta a série assim que previsto ou
    // tendência batem 100% (sem "cauda" plana depois do fim planejado).
    let endIdx = -1;
    for (let i = 0; i < todas.length; i++) {
      if ((todas[i].Previsto != null && todas[i].Previsto >= 1) || (todas[i].Tendencia != null && todas[i].Tendencia >= 1)) endIdx = i;
    }
    return endIdx >= 0 ? todas.slice(0, endIdx + 1) : todas;
  }, [curvasRaw, curvaChaveAtual]);

  // Mesmo cálculo do CurvaLegendChart original: acha o último corte já
  // realizado (data <= hoje, com realizado > 0) e a posição fracionária de
  // "hoje" entre esse corte e o próximo, para a linha HOJE não pular direto
  // de um corte a outro.
  const infoCurva = useMemo(() => {
    if (!linhasCurva) return null;
    const hoje = new Date(); hoje.setHours(23, 59, 59, 0);
    // Início do dia de hoje (00:00) — usado só pro corte FUTURO (próximo corte).
    // Precisa ser um corte separado do `hoje` de fim de dia acima: um corte cuja
    // data é HOJE (ex.: NN fecha na quinta, então quando hoje é quinta o próprio
    // corte da semana vigente cai em cima de "hoje") ainda não foi realizado e
    // deve continuar contando como "próximo corte" — comparar com `dt > hoje`
    // (fim do dia) excluía esse caso, empurrando a pastilha "Diário" pra semana
    // seguinte (bug reportado: "o diário mais recente não cai no corte certo").
    const hojeInicio = new Date(); hojeInicio.setHours(0, 0, 0, 0);
    const cortesPassados = linhasCurva.filter(d => {
      const dt = parseDataCorte(d.data);
      return dt && dt <= hoje && d.Realizado && d.Realizado > 0;
    });
    const ultimoReal = cortesPassados.length > 0 ? cortesPassados[cortesPassados.length - 1] : null;
    const idxHoje = ultimoReal ? linhasCurva.findIndex(d => d.semana === ultimoReal.semana) : -1;
    const desvioAtual = ultimoReal ? (ultimoReal.Desvio ?? 0) : null;
    const desvioColor = desvioAtual == null ? T.mut : desvioAtual >= 0 ? T.green : desvioAtual > -0.05 ? T.amber : T.red;
    const dataCorteLabel = ultimoReal ? fmtDataCurta(parseDataCorte(ultimoReal.data)) : '';

    const proxCorte = linhasCurva.find((d, i) => {
      const dt = parseDataCorte(d.data);
      return i > idxHoje && dt && dt >= hojeInicio && d.Previsto > 0;
    });
    let idxHojeFloat = idxHoje;
    if (idxHoje >= 0 && proxCorte) {
      const dtUltimo = parseDataCorte(ultimoReal.data);
      const dtProx = parseDataCorte(proxCorte.data);
      const idxProx = linhasCurva.findIndex(d => d.semana === proxCorte.semana);
      if (dtUltimo && dtProx && dtProx > dtUltimo) {
        const frac = Math.min(1, Math.max(0, (hoje - dtUltimo) / (dtProx - dtUltimo)));
        idxHojeFloat = idxHoje + frac * (idxProx - idxHoje);
      }
    }
    return { ultimoReal, idxHoje, idxHojeFloat, desvioAtual, desvioColor, dataCorteLabel, proxCorte };
  }, [linhasCurva]);

  const desvioFisico = useMemo(() => {
    if (!infoCurva || !infoCurva.ultimoReal || infoCurva.desvioAtual == null) return null;
    return { valor: infoCurva.desvioAtual * 100, data: parseDataCorte(infoCurva.ultimoReal.data) };
  }, [infoCurva]);

  // ── Desvio Financeiro (curva_avanco_historico — id_obra bate direto com o id da obra) ──
  // Setor "Desvios" voltou a placeholder (alinhar padrão visual com os demais
  // antes do teste em maior escala) — busca pausada enquanto não há tela que
  // consuma o resultado, pra não gastar leitura do Supabase à toa a cada
  // carregamento. `SetorDesvios`/`CardDesvio` continuam prontos; reativar é só
  // descomentar o fetch abaixo e trocar a rota de volta em `App`.
  const [finRaw, setFinRaw] = useState(null);
  const [finErro, setFinErro] = useState(false);

  // useEffect(() => {
  //   const sbHeaders = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };
  //   fetchPaginado(`${SUPABASE_URL}/rest/v1/curva_avanco_historico?select=id_obra,data,reais_realizado_acumulado,reais_desvio_acumulado,reais_disponivel&order=id_obra.asc,data.asc`, sbHeaders)
  //     .then(rows => {
  //       if (rows === null) { setFinErro(true); setFinRaw([]); }
  //       else setFinRaw(rows);
  //     })
  //     .catch(() => { setFinErro(true); setFinRaw([]); });
  // }, []);

  const desvioFinanceiro = useMemo(() => {
    if (!finRaw) return null;
    const rows = finRaw
      .filter(r => String(r.id_obra) === String(obraAtual.id) && r.reais_disponivel !== false)
      .map(r => ({
        data: parseDataFlexivel(r.data),
        realizado: parseValNum(r.reais_realizado_acumulado),
        desvio: parseValNum(r.reais_desvio_acumulado),
      }))
      .sort((a, b) => (a.data || 0) - (b.data || 0));
    const ultimo = ultimaLinhaComMudanca(rows, 'realizado');
    if (!ultimo || ultimo.desvio == null) return null;
    const dias = ultimo.data ? Math.floor((new Date() - ultimo.data) / 86400000) : null;
    return { valor: ultimo.desvio, data: ultimo.data, desatualizado: dias != null && dias >= 7 };
  }, [finRaw, obraAtual]);

  // Histograma de Efetivo agora é o ModuloEfetivo, auto-suficiente (busca os
  // próprios dados a partir de obraId, mesmo padrão do EfetivoSection original)
  // — nada para carregar aqui.

  return (
    <div className="screen-enter app-shell">
      <Header obraAtual={obraAtual} obras={OBRAS} onSelecionarObra={setObraId} foto={OBRA_FOTOS[obraAtual.id]} />
      <TabsSetores atual={setor} onIr={setSetor} />
      <div key={setor.slug} className="screen-slide app-main">
        {setor.slug === 'curva-s'
          ? <ModuloCurvaS linhas={linhasCurva} info={infoCurva} carregando={linhasCurva === null} erro={curvasErro} obraId={obraAtual.id} obraNome={obraAtual.nome}
              curvas={obraAtual.curvas} curvaAtual={curvaChaveAtual} onTrocarCurva={setCurvaEscolhida} />
          : setor.slug === 'histograma'
            ? <ModuloEfetivo obraId={obraAtual.id} obraNome={obraAtual.nome} />
            : setor.slug === 'encarregados'
              ? <ModuloEncarregados obraId={obraAtual.id} obraNome={obraAtual.nome} />
              : setor.slug === 'desvios'
                ? <ModuloDesvios obraId={obraAtual.id} obraNome={obraAtual.nome} />
                : setor.slug === 'restricoes'
                  ? <ModuloRestricoes obraId={obraAtual.id} obraNome={obraAtual.nome} />
                  : setor.slug === 'medicoes'
                    ? <ModuloMedicoes obraId={obraAtual.id} obraNome={obraAtual.nome} />
                    : setor.slug === 'tour-360'
                      ? <ModuloTour360 obraId={obraAtual.id} obraNome={obraAtual.nome} />
                      : setor.slug === 'oc-co'
                        ? <ModuloOcCo obraId={obraAtual.id} obraNome={obraAtual.nome} />
                        : setor.slug === 'suprimentos-criticos'
                          ? <ModuloSuprimentos obraId={obraAtual.id} obraNome={obraAtual.nome} />
                          : <SetorPlaceholder setor={setor} obraId={obraAtual.id} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
