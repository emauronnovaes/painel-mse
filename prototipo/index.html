                      <td className="mono" style={{ padding:'9px 18px', textAlign:'right', fontSize:11.5, color:T.body, fontVariantNumeric:'tabular-nums' }}>{it.dataNecessidadeCompra ? fmtDataCompleta(it.dataNecessidadeCompra) : '—'}</td>
                      <td className="mono" style={{ padding:'9px 18px', textAlign:'right', fontSize:11.5, color:T.body, fontVariantNumeric:'tabular-nums', whiteSpace:'nowrap' }}>{it.prazoEntregaDias != null ? `${it.prazoEntregaDias} dias` : '—'}</td>
                      <td className="mono" style={{ padding:'9px 18px', textAlign:'right', fontSize:11.5, color:T.body, fontVariantNumeric:'tabular-nums' }}>{fmtDataObjRmi(calcularMaterialEmObra(it.dataNecessidadeCompra, it.prazoEntregaDias))}</td>
                      <td style={{ padding:'9px 18px', textAlign:'center' }}>
                        <StatusBadgeRmi qtdFinalizados={it.finalizado ? 1 : 0} qtdTotal={1} />
                      </td>
                    </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      )}

      {farolDetalhe && (
        <div onClick={() => setFarolDetalhe(null)} className="modal-overlay-in" style={{ position:'fixed', inset:0, zIndex:10002, background:'rgba(16,24,40,0.45)', backdropFilter:'blur(3px)', display:'flex', alignItems:'center', justifyContent:'center', padding:24 }}>
          <div onClick={e => e.stopPropagation()} className="modal-card-in" style={{ background:'#fff', border:'1px solid #e4e7ec', borderRadius:16, width:'100%', maxWidth:400, display:'flex', flexDirection:'column', overflow:'hidden', boxShadow:'0 24px 60px -12px rgba(16,24,40,0.25)' }}>
            <div style={{ padding:'14px 20px', borderBottom:'1px solid #eef0f3', display:'flex', alignItems:'center', gap:12, flexShrink:0 }}>
              <div style={{ flex:1, minWidth:0 }}>
                <div className="mono" style={{ fontSize:10, letterSpacing:'0.16em', color:T.mut2, textTransform:'uppercase', fontWeight:600, marginBottom:4 }}>Farol Financeiro</div>
                <div style={{ fontSize:15, fontWeight:700, color:T.ink }}>{farolDetalhe.titulo}</div>
              </div>
              <button onClick={() => setFarolDetalhe(null)} style={{ background:'#eef0f3', border:'none', color:T.mut, borderRadius:10, padding:'7px 12px', cursor:'pointer', fontSize:15, lineHeight:1, flexShrink:0 }}>✕</button>
            </div>
            <div style={{ padding:'6px 20px 20px' }}>
              {[
                ['Valor', farolDetalhe.valor, T.ink],
                ['Total Consumido', farolDetalhe.totalConsumido, T.ink],
                ['Saldo Orçamentário', farolDetalhe.saldo, farolDetalhe.desvio === 'negativo' ? T.red : farolDetalhe.desvio === 'positivo' ? T.green : T.ink],
              ].map(([label, valor, cor]) => (
                <div key={label} style={{ display:'flex', justifyContent:'space-between', gap:16, padding:'9px 0', borderBottom:'1px solid #eef0f3', fontSize:13, color:T.body }}>
                  <span>{label}</span>
                  <span className="mono" style={{ fontWeight:700, color:cor, fontVariantNumeric:'tabular-nums' }}>{fmtReais(valor)}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Setor 8 — Medições, direto de `contratos_medicao` + `boletins_medicao`
// (fonte trocada em 2026-08-19; antes vinha de `nfs`+`proximos_faturamentos`,
// que só tinham nf/bm/empresa/emissão e 1 linha de "próximo" por obra — ver
// [[08 - Blueprint do Painel de Obra]]). Agora o gráfico soma o VALOR
// faturado por data (não mais uma contagem de NFs) a partir do Histórico
// (boletins já faturados); a Previsão vira uma tabela própria (todo boletim
// ainda sem faturamento), não mais um balão único. As duas tabelas usam
// código de contrato ("CP029", "CP273"...) como chave de obra, uma 4ª
// convenção de nome além de curva/origemTV/origemPTS — ver `origemCP` em
// `OBRAS`. ─────────────────────────────────────────────────────────────────
function GraficoMedicoes({ pontos }){
  const wrapRef = useRef(null);
  const [tam, setTam] = useState({ width: 900, height: 280 });
  const [hover, setHover] = useState(null);

  // Mede largura E altura do card (agora lado a lado com a tabela, sem
  // altura fixa própria — herda o que sobrar da coluna via flex).
  useEffect(() => {
    if (!wrapRef.current) return;
    const el = wrapRef.current;
    const obs = new ResizeObserver(entries => {
      const { width: w, height: h } = entries[0].contentRect;
      if (w && h) setTam({ width: w, height: h });
    });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);

  if (!pontos || pontos.length < 2) return <div ref={wrapRef} style={{ width:'100%', height:'100%' }} />;

  const { width, height } = tam;
  // left generoso: rótulo de moeda compacta ("R$ 140,2 mi") é bem mais largo
  // que o número puro da versão anterior (contagem de NFs) — com pouco
  // padding o "R$" cortava contra a borda do SVG (overflow:hidden por padrão).
  const pad = { top: 28, right: 20, bottom: 32, left: 84 };
  const W = Math.max(width - pad.left - pad.right, 10);
  const H = Math.max(height - pad.top - pad.bottom, 10);
  // Barras (pedido explícito: "representando cada faturamento", "devem
  // aparecer junto da curva, sob o mesmo eixo") — MESMA escala/eixo Y da
  // curva acumulada (`maxV`/`yScale`), não uma faixa à parte com escala
  // própria (1ª tentativa, revertida). Cada NF fica pequena perto do
  // acumulado — é o esperado, sob o mesmo eixo a proporção real aparece.
  const maxV = Math.max(...pontos.map(p => p.valorAcumulado)) * 1.18 || 1;
  const xScale = i => pontos.length > 1 ? (i / (pontos.length - 1)) * W : 0;
  const yScale = v => H - (v / maxV) * H;
  const barW = Math.max(3, Math.min(16, (W / Math.max(pontos.length - 1, 1)) * 0.55));
  const yTicks = Array.from({ length: 5 }, (_, i) => maxV * (i / 4));
  const linha = pontos.map((p, i) => `${i === 0 ? 'M' : 'L'} ${xScale(i).toFixed(1)} ${yScale(p.valorAcumulado).toFixed(1)}`).join(' ');
  const area = `${linha} L ${xScale(pontos.length - 1).toFixed(1)} ${H} L 0 ${H} Z`;
  // Datas reais no eixo X (uma por NF, não mais bucket mensal) — com até ~30
  // pontos e o gráfico agora dividindo a tela com a tabela (mais estreito),
  // o rótulo "dd/mm/aa" de cada um se sobrepõe; calcula quantos cabem pelo
  // espaço real disponível (não um número fixo), sempre incluindo o último
  // ponto (data mais recente). O rótulo de BM (acima do ponto) segue a mesma
  // decimação — mostrar todos os ~30 BMs lado a lado também se sobreporia;
  // o valor exato de cada ponto continua disponível via hover.
  const maxLabelsVisiveis = Math.max(4, Math.floor(W / 55));
  const passoLabel = Math.max(1, Math.ceil(pontos.length / maxLabelsVisiveis));
  // O último ponto sempre aparece (data mais recente) — mas se o penúltimo
  // rótulo "da grade" cair perto demais dele, os dois textos colidem (ex.:
  // "16/07/26" colado em "27/07/26"). Suprime o rótulo da grade quando está
  // a menos de 55px do ponto final; o final continua sempre visível.
  const mostrarLabel = i => {
    if (i === pontos.length - 1) return true;
    if (i % passoLabel !== 0) return false;
    return (xScale(pontos.length - 1) - xScale(i)) > 70;
  };

  const handleMove = e => {
    const rect = e.currentTarget.getBoundingClientRect();
    const xLocal = ((e.clientX - rect.left) / rect.width) * width - pad.left;
    let idx = pontos.length > 1 ? Math.round((xLocal / W) * (pontos.length - 1)) : 0;
    idx = Math.max(0, Math.min(pontos.length - 1, idx));
    setHover(idx);
  };

  const p = hover != null ? pontos[hover] : null;
  const tipLeft = hover != null ? Math.min(Math.max(xScale(hover), 60), W - 60) : 0;
  const tipAcimaDoPonto = p ? yScale(p.valorAcumulado) < H * 0.35 : false;

  return (
    <div ref={wrapRef} style={{ position:'relative', width:'100%', height:'100%' }}>
      <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none"
        onMouseMove={handleMove} onMouseLeave={() => setHover(null)}>
        <g transform={`translate(${pad.left},${pad.top})`}>
          {yTicks.map((v, i) => (
            <g key={i}>
              <line x1={0} x2={W} y1={yScale(v)} y2={yScale(v)} stroke="#eef0f3" strokeWidth={1} />
              <text x={-10} y={yScale(v)} textAnchor="end" dominantBaseline="middle" fontSize={10} fontFamily="'IBM Plex Mono', monospace" fill={T.mut2}>{fmtReaisCompacto(v)}</text>
            </g>
          ))}
          <path d={area} fill="rgba(37,99,235,0.08)" stroke="none" />
          {/* Barra por faturamento (valor daquela NF/data), no MESMO eixo Y da
              curva acumulada acima — pedido explícito de não ter escala própria. */}
          {pontos.map((p, i) => (
            <rect key={`b${i}`} x={xScale(i) - barW / 2} y={yScale(p.valorDia)} width={barW} height={H - yScale(p.valorDia)}
              fill={T.blue} opacity={hover === i ? 0.55 : 0.28} rx={1.5} />
          ))}
          <path d={linha} fill="none" stroke={T.blue} strokeWidth={2} />
          {hover != null && (
            <line x1={xScale(hover)} x2={xScale(hover)} y1={0} y2={H} stroke={T.blue} strokeWidth={1} strokeDasharray="3,3" opacity={0.5} />
          )}
          {pontos.map((p, i) => (
            <g key={i}>
              <circle cx={xScale(i)} cy={yScale(p.valorAcumulado)} r={hover === i ? 5.5 : 3.5} fill={T.blue} stroke="#fff" strokeWidth={1.5} style={{ transition:'r 0.1s' }} />
              {i === pontos.length - 1 && hover !== i && (
                <text x={xScale(i)} y={yScale(p.valorAcumulado) - 22} textAnchor="end" fontSize={10} fontWeight={700} fontFamily="'IBM Plex Mono', monospace" fill={T.ink}>{fmtReaisCompacto(p.valorAcumulado)}</text>
              )}
              {mostrarLabel(i) && (
                <text x={xScale(i)} y={H + 20} textAnchor={i === pontos.length - 1 ? 'end' : 'middle'} fontSize={10} fontFamily="'IBM Plex Mono', monospace" fill={hover === i ? T.ink : T.mut} fontWeight={hover === i ? 700 : 400}>{p.label}</text>
              )}
            </g>
          ))}
          {hover != null && (
            <rect x={0} y={0} width={W} height={H} fill="transparent" style={{ pointerEvents:'none' }} />
          )}
        </g>
      </svg>
      {p && (
        <div className="mono" style={{
          position:'absolute',
          left: `${((tipLeft + pad.left) / width) * 100}%`,
          top: tipAcimaDoPonto ? (pad.top + yScale(p.valorAcumulado) + 14) : Math.max(pad.top + yScale(p.valorAcumulado) - 62, 4),
          transform:'translateX(-50%)',
          background: T.ink, color:'#fff', borderRadius:8, padding:'6px 10px',
          fontSize:11, lineHeight:1.5, pointerEvents:'none', boxShadow:'0 4px 14px rgba(0,0,0,0.18)', whiteSpace:'nowrap', zIndex:5,
        }}>
          <div style={{ fontWeight:700 }}>{p.label}</div>
          <div style={{ opacity:0.75 }}>BM {p.bmLabel}</div>
          <div>Acumulado: {fmtReais(p.valorAcumulado)}</div>
          <div style={{ opacity:0.75 }}>Nesta data: {fmtReais(p.valorDia)}</div>
        </div>
      )}
    </div>
  );
}

// Gráfico Previsto × Medido — pedido explícito (2026-08-19): "um gráfico
// que plotará as duas curvas, do previsto e do medido", depois "a curva
// do real deve ir somente ao corte com dados, é importante incluir as
// colunas também". Mesmo padrão hand-rolled em SVG do `GraficoMedicoes`
// acima (sem lib de gráfico), responsivo via ResizeObserver.
//
// Desenha 4 coisas sobre o MESMO eixo Y:
//  - colunas = valor do próprio período (`previstoDia`/`medidoDia`);
//  - linhas  = valor acumulado (`previstoAcum`/`medidoAcum`).
// Escala única de propósito: é a convenção que o `GraficoMedicoes` já
// fixou ("MESMA escala/eixo Y da curva acumulada, não uma faixa à parte
// com escala própria" — a versão com 2 escalas foi tentada e revertida).
// A coluna fica pequena perto do acumulado, e é isso mesmo: sob o mesmo
// eixo a proporção real aparece.
//
// `medidoAcum`/`medidoDia` vêm `null` depois do corte (último período com
// medição lançada) — aí a linha e a coluna do medido simplesmente param,
// em vez de esticar uma reta que pareceria medição travada.
//
// `pontos`: [{label, previstoAcum, previstoDia, medidoAcum, medidoDia,
// ehCorte}], já ordenado por período (ver `serieDuasCurvas`).
function GraficoPrevistoMedido({ pontos }){
  const wrapRef = useRef(null);
  const [tam, setTam] = useState({ width: 900, height: 280 });
  const [hover, setHover] = useState(null);

  useEffect(() => {
    if (!wrapRef.current) return;
    const el = wrapRef.current;
    const obs = new ResizeObserver(entries => {
      const { width: w, height: h } = entries[0].contentRect;
      if (w && h) setTam({ width: w, height: h });
    });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);

  // Tamanho REAL do tooltip (pedido explícito, 2026-08-19: "ao passar o
  // mouse em um ponto do gráfico perto da borda, o detalhamento fica
  // cortado") — a 1ª versão clampava a posição por uma margem fixa
  // (metade de uma largura "chutada"), que não bate com o tooltip real
  // (varia por conteúdo — "Medido: sem medição lançada" é bem mais curto
  // que as 4 linhas de acumulado/período). Mede via ref depois de cada
  // troca de ponto e usa o tamanho de verdade pra clamping, tanto
  // horizontal quanto vertical (importante agora que o bloco é
  // redimensionável — um bloco baixo cortava o tooltip por cima também).
  const tipRef = useRef(null);
  const [tipTam, setTipTam] = useState({ w: 0, h: 0 });
  useEffect(() => {
    if (!tipRef.current) { setTipTam({ w: 0, h: 0 }); return; }
    const r = tipRef.current.getBoundingClientRect();
    setTipTam({ w: r.width, h: r.height });
  }, [hover]);

  if (!pontos || pontos.length < 2) {
    return (
      <div ref={wrapRef} style={{ width:'100%', height:'100%', display:'flex', alignItems:'center', justifyContent:'center' }}>
        <span className="mono" style={{ fontSize:12, color:T.mut }}>Dado insuficiente pra plotar (precisa de ao menos 2 períodos)</span>
      </div>
    );
  }

  const { width, height } = tam;
  const pad = { top: 28, right: 20, bottom: 32, left: 84 };
  const W = Math.max(width - pad.left - pad.right, 10);
  const H = Math.max(height - pad.top - pad.bottom, 10);
  // `medidoAcum` pode ser null (depois do corte) — o `?? 0` evita que um
  // null envenene o Math.max e derrube a escala inteira pra NaN.
  const maxV = Math.max(...pontos.map(p => Math.max(p.previstoAcum ?? 0, p.medidoAcum ?? 0))) * 1.15 || 1;
  const xScale = i => pontos.length > 1 ? (i / (pontos.length - 1)) * W : 0;
  const yScale = v => H - (v / maxV) * H;
  const yTicks = Array.from({ length: 5 }, (_, i) => maxV * (i / 4));
  // Pula ponto sem valor em vez de traçar até ele — é o que faz a linha do
  // medido terminar no corte. (`M` no primeiro ponto desenhado, não no
  // índice 0, senão uma série que começasse vazia sairia sem `M`.)
  const linhaDe = campo => pontos.reduce((acc, p, i) => {
    if (p[campo] == null) return acc;
    acc.push(`${acc.length === 0 ? 'M' : 'L'} ${xScale(i).toFixed(1)} ${yScale(p[campo]).toFixed(1)}`);
    return acc;
  }, []).join(' ');
  const linhaPrevisto = linhaDe('previstoAcum');
  const linhaMedido = linhaDe('medidoAcum');
  // Cores seguem a MESMA referência da Curva S (pedido explícito,
  // 2026-08-19) — antes o previsto era âmbar e o medido azul fixo, ou
  // seja, azul queria dizer coisas diferentes nas 2 telas. Na Curva S:
  // Previsto é azul tracejado, e o Realizado tem cor DINÂMICA pelo desvio
  // no corte (verde >= 0, âmbar até -5 p.p., vermelho abaixo, cinza sem
  // dado — ver `desvioColor` em ModuloCurvaS). Aqui o medido é o
  // equivalente do realizado, então ganha a mesma regra, calculada no
  // corte com o mesmo limiar do farol da tabela (`corDesvio`).
  const pontoCorte = pontos.find(pt => pt.ehCorte) || null;
  const desvioNoCortePP = (pontoCorte && pontoCorte.previstoAcum && pontoCorte.medidoAcum != null)
    ? (pontoCorte.medidoAcum / pontoCorte.previstoAcum - 1) * 100
    : null;
  const corMedido = desvioNoCortePP == null ? T.mut : corDesvio(desvioNoCortePP);
  // Colunas do período: 2 por ponto (previsto e medido), lado a lado e
  // centradas no ponto do eixo X. Largura acompanha o espaço disponível
  // por período — com o gráfico estreito e muitos períodos elas viram
  // tracinhos finos, mas nunca somem nem se sobrepõem.
  const passoX = W / Math.max(pontos.length, 1);
  const barW = Math.max(2, Math.min(11, passoX * 0.34));

  // Decimação dos rótulos do eixo X. Com o grid de widgets o gráfico pode
  // ficar bem estreito (ex.: 5 de 12 colunas), então nada de número
  // mágico: o espaçamento sai da largura aproximada do rótulo
  // "dd/mm/aa" nesta fonte/tamanho. O último ponto SEMPRE aparece e é
  // ancorado à direita — ou seja, ocupa ~`LARGURA_ROTULO_X` à ESQUERDA do
  // ponto final; um rótulo centrado antes dele precisa caber com a
  // própria metade mais uma folga, daí o 1.5×.
  const LARGURA_ROTULO_X = 50;
  const maxLabelsVisiveis = Math.max(2, Math.floor(W / (LARGURA_ROTULO_X + 14)));
  const passoLabel = Math.max(1, Math.ceil(pontos.length / maxLabelsVisiveis));
  const mostrarLabel = i => {
    if (i === pontos.length - 1) return true;
    if (i % passoLabel !== 0) return false;
    return (xScale(pontos.length - 1) - xScale(i)) > (LARGURA_ROTULO_X * 1.5 + 10);
  };

  const handleMove = e => {
    const rect = e.currentTarget.getBoundingClientRect();
    const xLocal = ((e.clientX - rect.left) / rect.width) * width - pad.left;
    let idx = pontos.length > 1 ? Math.round((xLocal / W) * (pontos.length - 1)) : 0;
    idx = Math.max(0, Math.min(pontos.length - 1, idx));
    setHover(idx);
  };

  const p = hover != null ? pontos[hover] : null;
  const topoPonto = p ? yScale(Math.max(p.previstoAcum ?? 0, p.medidoAcum ?? 0)) : 0;
  const tipAcimaDoPonto = p ? topoPonto < H * 0.35 : false;
  // Clamping horizontal/vertical pelo tamanho REAL do tooltip (ver
  // `tipTam` acima), não mais por uma metade-de-largura chutada. Enquanto
  // o tooltip ainda não foi medido (1º hover), usa um palpite conservador
  // só pra esse único frame — o efeito já corrige no próximo.
  const MARGEM_BORDA = 8;
  const metadeTip = (tipTam.w || 160) / 2 + MARGEM_BORDA;
  const pontoAbsX = xScale(hover || 0) + pad.left;
  const centroTipX = Math.min(Math.max(pontoAbsX, metadeTip), Math.max(width - metadeTip, metadeTip));
  const alturaTip = tipTam.h || 90;
  const topoTip = tipAcimaDoPonto
    ? Math.min(pad.top + topoPonto + 14, height - alturaTip - MARGEM_BORDA)
    : Math.max(pad.top + topoPonto - alturaTip - 10, MARGEM_BORDA);

  return (
    <div ref={wrapRef} style={{ position:'relative', width:'100%', height:'100%' }}>
      {/* Legenda com as 2 séries; o par linha+coluna de cada cor aparece
          junto no marcador, e a nota explica quem é quem sem precisar de
          4 entradas. */}
      {/* Legenda espelha a da Curva S: previsto azul tracejado, medido na
          cor do desvio. O texto do "Medido" também vai colorido, igual lá. */}
      <div style={{ position:'absolute', top:2, right:6, display:'flex', gap:14, alignItems:'center', zIndex:1, flexWrap:'wrap', justifyContent:'flex-end' }}>
        <span style={{ display:'flex', alignItems:'center', gap:5, fontSize:11, color:T.body }}>
          <span style={{ display:'inline-flex', alignItems:'center', gap:3 }}>
            <span style={{ width:12, height:0, borderTop:`2px dashed ${T.blue}`, opacity:0.7, display:'inline-block' }} />
            <span style={{ width:5, height:9, background:T.blue, opacity:0.35, display:'inline-block', borderRadius:1 }} />
          </span>Previsto
        </span>
        <span style={{ display:'flex', alignItems:'center', gap:5, fontSize:11, color:corMedido, fontWeight:600 }}>
          <span style={{ display:'inline-flex', alignItems:'center', gap:3 }}>
            <span style={{ width:12, height:3, background:corMedido, display:'inline-block', borderRadius:1 }} />
            <span style={{ width:5, height:9, background:corMedido, opacity:0.6, display:'inline-block', borderRadius:1 }} />
          </span>Medido
        </span>
        <span style={{ fontSize:10, color:T.mut2 }}>linha = acumulado · coluna = do período</span>
      </div>
      <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none"
        onMouseMove={handleMove} onMouseLeave={() => setHover(null)}>
        <g transform={`translate(${pad.left},${pad.top})`}>
          {yTicks.map((v, i) => (
            <g key={i}>
              <line x1={0} x2={W} y1={yScale(v)} y2={yScale(v)} stroke="#eef0f3" strokeWidth={1} />
              <text x={-10} y={yScale(v)} textAnchor="end" dominantBaseline="middle" fontSize={10} fontFamily="'IBM Plex Mono', monospace" fill={T.mut2}>{fmtReaisCompacto(v)}</text>
            </g>
          ))}
          {/* Colunas antes das linhas: as linhas ficam por cima. Medido só
              existe até o corte, então a coluna dele também para lá. */}
          {/* Opacidade das colunas também vem da Curva S: previsto 0.35,
              realizado/medido 0.6. */}
          {pontos.map((pt, i) => (
            <g key={`col${i}`}>
              {pt.previstoDia > 0 && (
                <rect x={xScale(i) - barW - 1} y={yScale(pt.previstoDia)} width={barW} height={Math.max(H - yScale(pt.previstoDia), 0)}
                  fill={T.blue} opacity={hover === i ? 0.55 : 0.35} rx={1.5} />
              )}
              {pt.medidoDia != null && pt.medidoDia > 0 && (
                <rect x={xScale(i) + 1} y={yScale(pt.medidoDia)} width={barW} height={Math.max(H - yScale(pt.medidoDia), 0)}
                  fill={corMedido} opacity={hover === i ? 0.8 : 0.6} rx={1.5} />
              )}
            </g>
          ))}
          {/* Traço copiado do GRÁFICO da Curva S (`LineSVG`): previsto
              `8 4` em 2px/0.7, realizado cheio em 3px. A legenda da
              Curva S usa `6 3`/2.5 — ela já divergia do próprio gráfico
              lá, e o que vale como referência visual é a curva desenhada. */}
          <path d={linhaPrevisto} fill="none" stroke={T.blue} strokeWidth={2} strokeDasharray="8 4" opacity={0.7} />
          <path d={linhaMedido} fill="none" stroke={corMedido} strokeWidth={3} />
          {hover != null && (
            <line x1={xScale(hover)} x2={xScale(hover)} y1={0} y2={H} stroke={T.mut2} strokeWidth={1} strokeDasharray="3,3" opacity={0.6} />
          )}
          {pontos.map((pt, i) => (
            <g key={i}>
              {pt.previstoAcum != null && (
                <circle cx={xScale(i)} cy={yScale(pt.previstoAcum)} r={hover === i ? 5 : 3} fill={T.blue} stroke="#fff" strokeWidth={1.5} opacity={0.7} />
              )}
              {/* Ponto do medido só até o corte; o último ganha anel pra
                  deixar claro que a série acaba ali, não que sumiu. */}
              {pt.medidoAcum != null && (
                <circle cx={xScale(i)} cy={yScale(pt.medidoAcum)} r={hover === i ? 5 : (pt.ehCorte ? 4.5 : 3)} fill={corMedido} stroke="#fff" strokeWidth={1.5} />
              )}
              {pt.ehCorte && pt.medidoAcum != null && (
                <circle cx={xScale(i)} cy={yScale(pt.medidoAcum)} r={7.5} fill="none" stroke={corMedido} strokeWidth={1} opacity={0.45} />
              )}
              {mostrarLabel(i) && (
                <text x={xScale(i)} y={H + 20} textAnchor={i === pontos.length - 1 ? 'end' : 'middle'} fontSize={10} fontFamily="'IBM Plex Mono', monospace" fill={hover === i ? T.ink : T.mut} fontWeight={hover === i ? 700 : 400}>{pt.label}</text>
              )}
            </g>
          ))}
        </g>
      </svg>
      {p && (
        <div ref={tipRef} className="mono" style={{
          position:'absolute',
          left: centroTipX,
          top: topoTip,
          transform:'translateX(-50%)',
          background: T.ink, color:'#fff', borderRadius:8, padding:'6px 10px',
          fontSize:11, lineHeight:1.5, pointerEvents:'none', boxShadow:'0 4px 14px rgba(0,0,0,0.18)', whiteSpace:'nowrap', zIndex:5,
        }}>
          <div style={{ fontWeight:700, marginBottom:2 }}>{p.label}</div>
          <div>Previsto acumulado: {fmtReais(p.previstoAcum)}</div>
          <div style={{ opacity:0.75 }}>Previsto no período: {fmtReais(p.previstoDia || 0)}</div>
          {p.medidoAcum != null ? (
            <React.Fragment>
              <div>Medido acumulado: {fmtReais(p.medidoAcum)}</div>
              <div style={{ opacity:0.75 }}>Medido no período: {fmtReais(p.medidoDia || 0)}</div>
            </React.Fragment>
          ) : (
            <div style={{ opacity:0.75 }}>Medido: sem medição lançada</div>
          )}
        </div>
      )}
    </div>
  );
}

// Grid de widgets do setor Medições — pedido explícito (2026-08-19):
// "preciso de algo realmente interativo, que seja capaz de
// re-dimensionar, colocar lado a lado". As 2 versões anteriores eram
// feitas à mão (HTML5 drag-and-drop, depois Pointer Events com
// `translateY`) e só reordenavam numa coluna — daí a sensação de
// "engessado". Grid de verdade (colisão, compactação, resize em 2 eixos,
// posição livre em X e Y) não vale reescrever à mão: entrou
// `react-grid-layout` via CDN UMD (ver <script> no <head>).
// `WidthProvider` mede o container e passa a largura pro grid.
// Se o CDN falhar, isto fica `null` e `ModuloMedicoes` cai num
// empilhamento simples — a tela nunca fica em branco por causa disso.
const GridLayoutMedicoes = (typeof ReactGridLayout !== 'undefined' && ReactGridLayout)
  ? ReactGridLayout.WidthProvider(ReactGridLayout)
  : null;

// 12 colunas × linhas de 40px (+14 de gap): h=11 dá ~580px, h=7 ~364px.
// Duas tabelas viraram UMA (pedido explícito, 2026-08-19: "ajuste tudo
// em uma única tabela, compile todas as informações de uma só vez"), daí
// só 2 blocos. Ambos nascem em w=12 e empilhados: a tabela consolidada
// tem 12 colunas (~1500px), lado a lado com o gráfico ela viraria uma
// tira que só rola. Pôr lado a lado continua possível a qualquer
// momento — é escolha de quem usa, e fica salva.
// Os ids mudaram ('historico'+'previsao' → 'tabela'): um layout salvo da
// versão anterior não passa na validação de `layoutTiles` e cai no padrão
// sozinho, sem precisar de chave nova no localStorage.
const TILES_MEDICOES_IDS = ['tabela', 'grafico'];
const LAYOUT_MEDICOES_PADRAO = [
  { i:'tabela',  x:0, y:0,  w:12, h:11 },
  { i:'grafico', x:0, y:11, w:12, h:7  },
];
const MIN_TILE_MEDICOES = {
  tabela:  { minW:4, minH:5 },
  grafico: { minW:3, minH:4 },
};
// Só usado no fallback sem grid (CDN fora).
const ALTURA_FALLBACK_TILE = { tabela:580, grafico:364 };

// Moldura do bloco. O cabeçalho (`tile-handle`) é a única área que
// arrasta — assim tabela rola e coluna ordena normalmente por dentro do
// bloco. O "✕" leva `tile-nao-arrasta` (é o `draggableCancel` do grid),
// senão clicar nele iniciaria um arrasto. Remover só OCULTA — nada é
// apagado, o bloco volta pelos botões "+ Nome" e reaparece na MESMA
// posição/tamanho (a entrada dele continua guardada no layout).
function TileFrame({ titulo, contagem, onRemover, travado, children }){
  return (
    <div className="card" style={{ height:'100%', borderRadius:14, overflow:'hidden', display:'flex', flexDirection:'column', padding:0 }}>
      {/* padding-right 18: deixa o "✕" fora da alça de resize do canto
          nordeste (12px + 3px de recuo), senão o clique de ocultar cai na
          alça. padding-left 16 já passa da alça do canto noroeste.
          Travado (modo padrão, ver comentário no grid): cursor volta ao
          normal e a alça (⠿⠿) fica apagada — não tem o que arrastar. */}
      <div className="mono tile-handle" style={{ display:'flex', alignItems:'center', gap:8, padding:'11px 18px 8px 16px', flexShrink:0, cursor:travado ? 'default' : 'grab', touchAction:'none' }}>
        <span style={{ fontSize:10.5, letterSpacing:'0.1em', color:T.mut, textTransform:'uppercase', fontWeight:600, flex:1, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
          {titulo}{contagem != null && <span style={{ color:T.mut2, fontWeight:500 }}> ({contagem})</span>}
        </span>
        <span title={travado ? 'Layout travado' : 'Arraste para mover'} style={{ color:T.mut2, fontSize:13, letterSpacing:'-1px', userSelect:'none', flexShrink:0, opacity:travado ? 0.35 : 1 }}>⠿⠿</span>
        <button onClick={onRemover} title="Remover bloco (pode trazer de volta depois)" className="mono tile-nao-arrasta"
          style={{ background:'#eef0f3', border:'none', color:T.mut, borderRadius:7, width:22, height:22, display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', fontSize:12, lineHeight:1, flexShrink:0 }}>✕</button>
      </div>
      {children}
    </div>
  );
}

// Donut simples via stroke-dasharray (sem lib de gráfico) — situação do
// contrato. `fatias`: [{label, valor, cor}]; valores negativos são tratados
// como 0 no arco (não dá pra desenhar fatia negativa). Legenda não mostra
// valor (pedido explícito) — o valor exato só aparece no CENTRO do donut ao
// passar o mouse sobre a fatia (`pointerEvents:'stroke'`, cada fatia só
// reage no próprio arco desenhado, não no círculo inteiro).
// Responsivo (pedido explícito: "ocupar todo o balão disponível, em
// diferentes telas") — mede o container via ResizeObserver, mesmo padrão
// do `GraficoMedicoes`, e usa o menor lado (donut é quadrado) como
// diâmetro; espessura do anel escala junto (proporção fixa ~16%).
function GraficoPizza({ fatias }){
  const wrapRef = useRef(null);
  const [tam, setTam] = useState({ width: 220, height: 220 });
  const [hoverIdx, setHoverIdx] = useState(null);

  useEffect(() => {
    if (!wrapRef.current) return;
    const el = wrapRef.current;
    const obs = new ResizeObserver(entries => {
      const { width: w, height: h } = entries[0].contentRect;
      if (w && h) setTam({ width: w, height: h });
    });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);

  const tamanho = Math.max(Math.min(tam.width, tam.height) - 4, 60);
  const espessura = Math.max(Math.round(tamanho * 0.16), 8);
  const total = fatias.reduce((s, f) => s + Math.max(f.valor, 0), 0);
  // Margem fixa reservada pro anel "engrossar" no hover (+5) sem que a
  // borda externa passe do viewBox — sem isso o hover cortava a fatia
  // contra a caixa do SVG (overflow:hidden padrão), pior quanto maior o
  // gráfico ficou depois de virar responsivo.
  const HOVER_CRESCE = 5;
  const r = (tamanho - espessura) / 2 - HOVER_CRESCE;
  const c = 2 * Math.PI * r;

  const centro = (
    <div style={{ width:'100%', height:'100%', display:'flex', alignItems:'center', justifyContent:'center' }}>
      {!total ? (
        <div style={{ width:tamanho, height:tamanho, borderRadius:'50%', border:`${espessura}px solid #eef0f3`, boxSizing:'border-box' }} />
      ) : null}
    </div>
  );
  if (!total) return <div ref={wrapRef} style={{ width:'100%', height:'100%' }}>{centro}</div>;

  let acumulado = 0;
  const arcos = fatias.map((f, i) => {
    const frac = Math.max(f.valor, 0) / total;
    const len = frac * c;
    // fração acumulada ANTES desta fatia + metade da própria — ponto médio
    // do arco, em fração de volta (0 a 1), pra achar o ângulo do rótulo de
    // %. Cálculo separado do `offset` (que é em unidade de comprimento de
    // traço, usado só pro dasharray) pra não misturar as duas contas.
    const midFrac = acumulado / c + frac / 2;
    const arco = { ...f, i, len, frac, midFrac, offset: -acumulado };
    acumulado += len;
    return arco;
  });
  const hov = hoverIdx != null ? fatias[hoverIdx] : null;
  // Rótulo de % direto no aro (pedido explícito) — ângulo calculado à mão
  // (não dentro do <g rotate>) pra não ter que desfazer a rotação na hora
  // de posicionar o texto; -90° = topo, sentido horário, mesma convenção
  // visual que o `rotate(-90)` já produz nos arcos. Fatia mínima de 6% pra
  // não empilhar texto ilegível numa fatia quase invisível.
  const fontRotulo = Math.max(Math.round(tamanho * 0.055), 10);

  return (
    <div ref={wrapRef} style={{ width:'100%', height:'100%', display:'flex', alignItems:'center', justifyContent:'center' }}>
      <div style={{ position:'relative', width:tamanho, height:tamanho }}>
        <svg width={tamanho} height={tamanho} viewBox={`0 0 ${tamanho} ${tamanho}`}>
          <circle cx={tamanho / 2} cy={tamanho / 2} r={r} fill="none" stroke="#eef0f3" strokeWidth={espessura} />
          <g transform={`rotate(-90 ${tamanho / 2} ${tamanho / 2})`}>
            {arcos.map(a => (
              <circle key={a.i} cx={tamanho / 2} cy={tamanho / 2} r={r} fill="none" stroke={a.cor}
                strokeWidth={hoverIdx === a.i ? espessura + HOVER_CRESCE : espessura}
                strokeDasharray={`${a.len} ${Math.max(c - a.len, 0)}`} strokeDashoffset={a.offset}
                onMouseEnter={() => setHoverIdx(a.i)} onMouseLeave={() => setHoverIdx(null)}
                style={{ cursor:'pointer', transition:'stroke-width .12s ease', pointerEvents:'stroke' }} />
            ))}
          </g>
          {arcos.filter(a => a.frac >= 0.06).map(a => {
            const ang = (-90 + a.midFrac * 360) * (Math.PI / 180);
            const lx = tamanho / 2 + r * Math.cos(ang);
            const ly = tamanho / 2 + r * Math.sin(ang);
            return (
              <text key={`pct${a.i}`} x={lx} y={ly} textAnchor="middle" dominantBaseline="middle"
                fontSize={fontRotulo} fontWeight={700} fontFamily="'IBM Plex Mono', monospace"
                fill="#fff" style={{ pointerEvents:'none' }}>
                {Math.round(a.frac * 100)}%
              </text>
            );
          })}
        </svg>
        {hov && (
          <div className="mono" style={{
            position:'absolute', inset:0, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
            textAlign:'center', pointerEvents:'none', padding:8,
          }}>
            <div style={{ fontSize:10.5, color:T.mut, marginBottom:4, lineHeight:1.3 }}>{hov.label}</div>
            <div style={{ fontSize:14, fontWeight:700, color: hov.valor < 0 ? T.red : T.ink, lineHeight:1.2 }}>{fmtReaisCompacto(hov.valor)}</div>
          </div>
        )}
      </div>
    </div>
  );
}

// Badge genérico de status (Faturado/Recebido/Dentro do prazo/Atrasado) —
// mesma paleta semântica usada nos outros badges do painel (verde/azul/
// vermelho/neutro), reaproveitado nas 2 tabelas novas de Medições.
function BadgeStatusMedicao({ texto }){
  if (!texto) return <span style={{ fontSize:12, color:T.mut2 }}>—</span>;
  const n = texto.trim().toLowerCase();
  const cor = (n === 'recebido' || n === 'faturado') ? T.green : n === 'atrasado' ? T.red : n === 'dentro do prazo' ? T.blue : T.mut;
  const bg  = (n === 'recebido' || n === 'faturado') ? 'rgba(31,157,87,0.13)' : n === 'atrasado' ? 'rgba(210,59,59,0.13)' : n === 'dentro do prazo' ? 'rgba(37,99,235,0.13)' : '#eef0f3';
  return <span style={{ display:'inline-block', padding:'3px 10px', borderRadius:8, fontSize:11, fontWeight:700, letterSpacing:'0.03em', textTransform:'uppercase', background:bg, color:cor, whiteSpace:'nowrap' }}>{texto}</span>;
}

// Farol Medido × Previsto — pedido explícito (2026-08-19): "um farol ao
// lado do valor medido, que ficará verde quando o medido for maior que o
// previsto, amarelo quando for pouca coisa menor, vermelho quando bem
// abaixo". "Pouca coisa" e "bem abaixo" saem do limiar que o painel já
// usa pra severidade de desvio (`corDesvio`: >= 0 verde, até -5 p.p.
// amarelo, abaixo vermelho) — mesmo critério de Desvios e do farol
// Medido×Físico, em vez de inventar um número só pra cá.
//
// Sem previsto (nulo ou zero) o farol fica CINZA (pedido explícito,
// 2026-08-19: "quando não tiver previsto, deixe em cinza") — na 1ª versão
// era um slot invisível, e um vazio se confundia com "não carregou".
// Cinza é estado próprio: "não há previsto pra comparar", nunca uma cor
// de severidade chutada (ADR-005).
const FAROL_LARGURA = 10;
function FarolMedidoPrevisto({ previsto, medido }){
  const p = previsto != null ? Number(previsto) : null;
  const m = medido != null ? Number(medido) : null;
  const base = { display:'inline-block', width:FAROL_LARGURA, height:FAROL_LARGURA, borderRadius:'50%', flexShrink:0, cursor:'help' };
  if (p == null || m == null || !p) {
    return <span title={p == null || !p ? 'Sem valor previsto para comparar' : 'Sem valor medido para comparar'}
      style={{ ...base, background:'#dfe3ea', border:'1px solid #c7cdd8' }} />;
  }
  const desvioPP = (m / p - 1) * 100;
  const tom = corDesvioTom(desvioPP);
  const sinal = desvioPP > 0 ? '+' : '';
  return (
    <span title={`Medido ${fmtReais(m)} × Previsto ${fmtReais(p)} (${sinal}${desvioPP.toFixed(1)}%)`}
      style={{ ...base, background:tom.cor, border:`1px solid ${tom.borda}` }} />
  );
}

// TABELA ÚNICA de Medições — pedido explícito (2026-08-19): "ajuste tudo
// em uma única tabela, compile todas as informações de uma só vez". Antes
// eram duas (Histórico = boletim faturado; Previsão = boletim pendente),
// cada uma com seu recorte de colunas; agora é UMA linha por boletim,
// faturado ou não, com a união das colunas das duas. Quem separa faturado
// de pendente é a coluna "Status Fat." (badge), não a tabela.
//
// Ordem das colunas segue o ciclo de vida do boletim: identificação →
// medição → faturamento → recebimento → saldo acumulado.
//
// Continua de fora o que saiu da tela em 2026-08-19 e nunca voltou
// (retenção, ISS, desconto de adiantamento, recebimento previsto/real,
// vencimento) — tudo isso segue gravado em `boletins_medicao`.
//
// Largura das colunas é AUTO (conteúdo decide, sem
// `colgroup`/`tableLayout:fixed`) — pedido explícito de 2026-08-19,
// quando px fixo deixou a tabela espremida. Com 12 colunas ela fica
// larga e rola na horizontal por dentro do bloco; a alternativa
// (apertar tudo) já foi rejeitada.
const COLUNAS_MEDICOES = [
  { label:'BM',                    campo:'bm_label' },
  { label:'Período',               campo:'periodo_fim' },
  { label:'Valor Previsto',        campo:'valor_previsto',                   align:'right' },
  { label:'Valor Medido',          campo:'valor_medido',                     align:'right' },
  { label:'Farol',                 campo:'farol',                            align:'center' },
  { label:'Desconto FD',           campo:'desconto_fd',                      align:'right' },
  { label:'Valor Faturado',        campo:'valor_faturado',                   align:'right' },
  { label:'Data de Faturamento',   campo:'data_faturamento' },
  { label:'Status Fat.',           campo:'status_faturamento' },
  { label:'Data do Recebimento',   campo:'data_recebimento' },
  { label:'Status Rec.',           campo:'status_recebimento' }
];

function ModuloMedicoes({ obraId, obraNome }){
  const obraCfg = OBRAS.find(o => o.id === obraId);
  // Fonte trocada em 2026-08-19: `contratos_medicao` + `boletins_medicao`
  // (importadas da planilha "Saldo a Faturar", ver [[08 - Blueprint]]) no
  // lugar de `nfs` + `proximos_faturamentos` + `CONTRATOS_CP` hardcoded —
  // pedido explícito: "não vamos utilizar os dados que já existem, vamos
  // fazer uma nova importação a partir destes".
  const [contratoRaw, setContratoRaw] = useState(null); // {} = sem cadastro pra este CP
  const [contratoErro, setContratoErro] = useState(false);
  const [boletinsRaw, setBoletinsRaw] = useState(null);
  const [boletinsErro, setBoletinsErro] = useState(false);
  const [curvaFisica, setCurvaFisica] = useState(null);
  const [contratoAberto, setContratoAberto] = useState(false);
  const [medidoAberto, setMedidoAberto] = useState(false);
  const [farolAberto, setFarolAberto] = useState(false);
  const [linhaSelecionada, setLinhaSelecionada] = useState(null);

  useEffect(() => { 
    setContratoAberto(false); 
    setMedidoAberto(false); 
    setFarolAberto(false); 
    setLinhaSelecionada(null); 
  }, [obraId]);

  // 2 divisores arrastáveis (pedido explícito original: "preciso ter os
  // comandos de ajuste entre ele [pizza] e a curva também") — pizza fica à
  // esquerda, depois o gráfico, depois a tabela de Histórico (a tabela de
  // Previsão fica FORA dessa fileira, embaixo — normalmente é uma lista
  // curta, não precisa disputar espaço com o gráfico).
  const [pizzaPct, setPizzaPct] = useState(24);
  const [graficoPct, setGraficoPct] = useState(40);
  // Pizza "Situação do Contrato" suprimida por ora (pedido explícito,
  // 2026-08-11) — código/resizer continuam intactos, só a condição de
  // exibição ganhou esse gate. Reativar é trocar pra `true`.
  const MOSTRAR_PIZZA_MEDICOES = false;
  // KPIs (Farol/Valor Contrato/Valor Medido/Próximo Faturamento) e o
  // gráfico "Valor Faturado — Acumulado" suprimidos por ora (pedido
  // explícito, 2026-08-19: "suprimir o gráfico e os botões superiores,
  // vamos manter apenas as tabelas, por hora") — mesmo padrão de gate da
  // pizza acima, nada foi apagado. Reativar é trocar pra `true`.
  const MOSTRAR_TOPO_MEDICOES = false;
  const areaRef = useRef(null);
  const arrastandoRef = useRef(null); // 'pizza' | 'grafico' | null

  useEffect(() => {
    const mover = (e) => {
      if (!arrastandoRef.current || !areaRef.current) return;
      const rect = areaRef.current.getBoundingClientRect();
      const fracPct = ((e.clientX - rect.left) / rect.width) * 100;
      if (arrastandoRef.current === 'pizza') {
        setPizzaPct(Math.max(15, Math.min(fracPct, 100 - graficoPct - 15)));
      } else if (arrastandoRef.current === 'grafico') {
        setGraficoPct(Math.max(20, Math.min(fracPct - pizzaPct, 100 - pizzaPct - 15)));
      }
    };
    const soltar = () => { arrastandoRef.current = null; document.body.style.userSelect = ''; };
    window.addEventListener('mousemove', mover);
    window.addEventListener('mouseup', soltar);
    return () => { window.removeEventListener('mousemove', mover); window.removeEventListener('mouseup', soltar); };
  }, [pizzaPct, graficoPct]);

  useEffect(() => {
    setContratoRaw(null); setContratoErro(false); setBoletinsRaw(null); setBoletinsErro(false); setCurvaFisica(null);
    if (!obraCfg?.origemCP) return;
    const headers = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };
    fetch(`${SUPABASE_URL}/rest/v1/contratos_medicao?cp_codigo=eq.${obraCfg.origemCP}&select=*`, { headers })
      .then(r => r.ok ? r.json() : null)
      .then(rows => setContratoRaw(Array.isArray(rows) && rows[0] ? rows[0] : {}))
      .catch(() => { setContratoErro(true); setContratoRaw({}); });
    fetchPaginado(`${SUPABASE_URL}/rest/v1/boletins_medicao?cp_codigo=eq.${obraCfg.origemCP}&select=*&order=linha_planilha.asc`, headers)
      .then(rows => { if (rows === null) { setBoletinsErro(true); setBoletinsRaw([]); } else setBoletinsRaw(rows); })
      .catch(() => { setBoletinsErro(true); setBoletinsRaw([]); });
    // Curva física (Curva S) — só pro farol Medido×Físico. Mesma tabela e
    // convenção de nome (`obraCfg.curva`) já usada no setor Curva S.
    fetch(`${SUPABASE_URL}/rest/v1/curvas_s?obra=eq.${encodeURIComponent(obraCfg.curva)}&select=data,acum_realizado&order=data.asc`, { headers })
      .then(r => r.ok ? r.json() : null)
      .then(rows => setCurvaFisica(Array.isArray(rows) ? rows : []))
      .catch(() => setCurvaFisica([]));
  }, [obraId]);

  // Histórico = boletim já faturado; Previsão = tudo mais (pendente, "BM
  // vigente", ou já com valor previsto lançado mas ainda sem faturamento).
  const { historico, previsao } = useMemo(() => {
    if (!boletinsRaw) return { historico: null, previsao: null };
    const hist = [], prev = [];
    boletinsRaw.forEach(b => {
      if ((b.status_faturamento || '').trim().toLowerCase() === 'faturado') hist.push(b);
      else prev.push(b);
    });
    return { historico: hist, previsao: prev };
  }, [boletinsRaw]);

  // Qual boletim é o "último BM faturado" — ele ganha destaque na tabela
  // e os faturados anteriores ficam apagados (pedido explícito,
  // 2026-08-19). Chave cronológica é `periodo_fim`: sempre presente nas
  // linhas faturadas e ordenável como texto (ISO). Empate cai no número
  // do BM. Não uso `data_faturamento` porque ela falta em parte das
  // linhas, e não uso só o número do BM porque há rótulo sem número
  // ("BM 01 - Limpeza", "MSE x ROCKTEC").
  const idUltimoFaturado = useMemo(() => {
    if (!boletinsRaw) return null;
    const faturados = boletinsRaw.filter(b => (b.status_faturamento || '').trim().toLowerCase() === 'faturado');
    if (!faturados.length) return null;
    const numBm = (b) => { const n = Number(bmCurto(b.bm_label)); return isNaN(n) ? -Infinity : n; };
    return faturados.reduce((a, b) => {
      const pa = a.periodo_fim || '', pb = b.periodo_fim || '';
      if (pb !== pa) return pb > pa ? b : a;
      return numBm(b) > numBm(a) ? b : a;
    }).id;
  }, [boletinsRaw]);

  // (Aqui existia um ResizeObserver que media as colunas do Histórico pra
  // a tabela de Previsão copiar as larguras e as duas alinharem. Saiu em
  // 2026-08-19 junto com a fusão das duas tabelas numa só — não há mais
  // duas tabelas pra alinhar.)

  // Curva por VALOR faturado — mesmo padrão de antes (uma NF por ponto no
  // eixo X = data de emissão), agora a partir do HISTÓRICO
  // (data_faturamento + valor_faturado, já líquido de FD/retenção — é o
  // que de fato vira nota) em vez de `nfs`. BMs na mesma data (ex. Porto
  // Itapoá) continuam somados num só ponto.
  const seriePorData = useMemo(() => {
    if (!historico) return null;
    const porData = {};
    historico.forEach(r => {
      if (!r.data_faturamento) return;
      const g = (porData[r.data_faturamento] = porData[r.data_faturamento] || { valor: 0, bms: [] });
      g.valor += Number(r.valor_faturado) || 0;
      const bm = bmCurto(r.bm_label);
      if (bm && !g.bms.includes(bm)) g.bms.push(bm);
    });
    let acumulado = 0;
    return Object.keys(porData).sort().map(data => {
      const g = porData[data];
      acumulado += g.valor;
      return { label: fmtDataLonga(data), valorDia: g.valor, valorAcumulado: acumulado, bmLabel: g.bms.length ? g.bms.join(', ') : '—' };
    });
  }, [historico]);

  // Curva Previsto × Medido — pedido explícito (2026-08-19): "um gráfico
  // que plotará as duas curvas, do previsto e do medido". Agrupa TODO
  // boletim por `periodo_fim`. Previsto acumula `valor_previsto` de todos
  // (é a trajetória contratual completa, passado + futuro já lançado).
  //
  // Medido para no CORTE (pedido explícito, 2026-08-19: "a curva do real
  // deve ir somente ao corte com dados") — mesma ideia do realizado da
  // Curva S. Corte = último período com `valor_medido` lançado; depois
  // dele `medidoAcum`/`medidoDia` vêm `null` e o gráfico simplesmente não
  // desenha, em vez de esticar uma reta horizontal que pareceria "medição
  // parada" quando o certo é "ainda não medido".
  //
  // O que conta como medido é `valor_medido != null` em QUALQUER boletim,
  // não só nos já faturados: um boletim medido e ainda não faturado é
  // dado real e tem que entrar no corte.
  //
  // `previstoDia`/`medidoDia` (valor do próprio período, não acumulado)
  // alimentam as colunas do gráfico — também pedido explícito.
  const serieDuasCurvas = useMemo(() => {
    if (!boletinsRaw) return null;
    const porPeriodo = {};
    boletinsRaw.forEach(r => {
      if (!r.periodo_fim) return;
      const g = (porPeriodo[r.periodo_fim] = porPeriodo[r.periodo_fim] || { previstoDia:0, medidoDia:0, temMedido:false });
      if (r.valor_previsto != null) g.previstoDia += Number(r.valor_previsto) || 0;
      if (r.valor_medido != null) { g.medidoDia += Number(r.valor_medido) || 0; g.temMedido = true; }
    });
    const datas = Object.keys(porPeriodo).sort();
    let idxCorte = -1;
    datas.forEach((d, i) => { if (porPeriodo[d].temMedido) idxCorte = i; });
    let accPrevisto = 0, accMedido = 0;
    return datas.map((data, i) => {
      const g = porPeriodo[data];
      accPrevisto += g.previstoDia;
      const dentroDoCorte = i <= idxCorte;
      if (dentroDoCorte) accMedido += g.medidoDia;
      return {
        label: fmtDataLonga(data),
        previstoAcum: accPrevisto,
        previstoDia: g.previstoDia,
        medidoAcum: dentroDoCorte ? accMedido : null,
        medidoDia: dentroDoCorte ? g.medidoDia : null,
        ehCorte: i === idxCorte,
      };
    });
  }, [boletinsRaw]);

  // Grid de widgets (pedido explícito, 2026-08-19): posição livre (X e
  // Y), tamanho e visibilidade de Histórico/Previsão/Gráfico ficam salvos
  // no navegador — é preferência de interface, não dado da obra, por isso
  // a chave é global (não por obraId). Guardamos a entrada de TODOS os
  // blocos, inclusive os ocultos: assim um bloco escondido volta na mesma
  // posição/tamanho em que estava. "Sem KPIs" (pedido explícito) — o
  // bloco de KPIs/pizza/gráfico antigo (`MOSTRAR_TOPO_MEDICOES`/
  // `MOSTRAR_PIZZA_MEDICOES`, ambos `false`) fica fora deste sistema.
  // Chave `_grid` nova de propósito: o formato mudou de lista de ids
  // (versão anterior, só ordem) pra lista de {i,x,y,w,h} — reaproveitar a
  // chave antiga carregaria lixo incompatível.
  const [layoutTiles, setLayoutTiles] = useState(() => {
    try {
      const salvo = JSON.parse(localStorage.getItem('mse_medicoes_grid'));
      if (Array.isArray(salvo) && salvo.length && salvo.every(l => l && TILES_MEDICOES_IDS.includes(l.i) && Number.isFinite(l.x) && Number.isFinite(l.y) && Number.isFinite(l.w) && Number.isFinite(l.h))) {
        // completa com o padrão qualquer bloco que ainda não esteja salvo
        const faltando = LAYOUT_MEDICOES_PADRAO.filter(p => !salvo.some(l => l.i === p.i));
        return [...salvo, ...faltando];
      }
    } catch {}
    return LAYOUT_MEDICOES_PADRAO;
  });
  const [tileOcultos, setTileOcultos] = useState(() => {
    try {
      const salvo = JSON.parse(localStorage.getItem('mse_medicoes_tile_ocultos'));
      return Array.isArray(salvo) ? salvo.filter(id => TILES_MEDICOES_IDS.includes(id)) : [];
    } catch { return []; }
  });
  useEffect(() => { localStorage.setItem('mse_medicoes_grid', JSON.stringify(layoutTiles)); }, [layoutTiles]);
  useEffect(() => { localStorage.setItem('mse_medicoes_tile_ocultos', JSON.stringify(tileOcultos)); }, [tileOcultos]);
  // Grid nasce TRAVADO toda vez (não persiste) — pedido explícito
  // (2026-08-21): "vamos deixar o modo de ajuste travado, para evitar
  // movimentações não intencionais". Só arrasta/redimensiona depois de
  // clicar em "Ajustar layout"; persistir como destravado entre sessões
  // reabriria a mesma brecha de arrasto acidental que o pedido queria
  // fechar.
  const [modoAjuste, setModoAjuste] = useState(false);

  const idsVisiveis = TILES_MEDICOES_IDS.filter(id => !tileOcultos.includes(id));
  const entradaLayout = (id) => layoutTiles.find(l => l.i === id) || LAYOUT_MEDICOES_PADRAO.find(l => l.i === id);
  // `minW/minH` são reaplicados da constante a cada render (em vez de
  // saírem do localStorage) — se um dia mudarem no código, valem na hora,
  // sem depender de limpar o que já está salvo no navegador.
  const layoutVisivel = idsVisiveis.map(id => ({ ...entradaLayout(id), ...MIN_TILE_MEDICOES[id] }));
  const aoMudarLayoutTiles = (novo) => {
    setLayoutTiles(prev => {
      const ocultos = prev.filter(l => tileOcultos.includes(l.i));
      const visiveis = novo.map(l => ({ i:l.i, x:l.x, y:l.y, w:l.w, h:l.h }));
      // só grava se algo mudou de fato — `onLayoutChange` também dispara
      // na montagem, e gravar igual re-renderizaria de graça.
      const igual = visiveis.length === prev.length - ocultos.length
        && visiveis.every(v => { const a = prev.find(p => p.i === v.i); return a && a.x === v.x && a.y === v.y && a.w === v.w && a.h === v.h; });
      return igual ? prev : [...visiveis, ...ocultos];
    });
  };
  // Clona o padrão em vez de guardar a referência da constante — nada
  // hoje muta essas entradas, mas o estado passa a ser dono do array.
  const restaurarLayoutPadrao = () => { setLayoutTiles(LAYOUT_MEDICOES_PADRAO.map(l => ({ ...l }))); setTileOcultos([]); };

  // "Organizar": sobe cada bloco até encostar, sem mudar largura, altura
  // nem coluna. Existe porque o grid roda SEM compactação automática (é o
  // que faz o resize pelo topo funcionar, ver comentário no
  // <GridLayoutMedicoes>): em troca, empurrar um vizinho pra baixo deixa
  // faixa vazia que não se fecha sozinha. Isto fecha o vão sem tirar
  // liberdade de posicionamento — e sem desfazer o arranjo, ao contrário
  // do "Restaurar layout". Rodava só por botão manual até 2026-08-21;
  // agora é chamada automaticamente por `onDragStop`/`onResizeStop` do
  // grid a cada ajuste (pedido explícito), o botão saiu.
  const organizarLayout = () => {
    setLayoutTiles(prev => {
      const ocultos = prev.filter(l => tileOcultos.includes(l.i));
      const emOrdem = idsVisiveis.map(id => ({ ...entradaLayout(id) })).sort((a, b) => a.y - b.y || a.x - b.x);
      const postos = [];
      emOrdem.forEach(item => {
        let y = 0;
        const colide = (yTeste) => postos.some(p =>
          p.x < item.x + item.w && item.x < p.x + p.w &&
          yTeste < p.y + p.h && p.y < yTeste + item.h);
        while (colide(y)) y++;
        postos.push({ ...item, y });
      });
      return [...postos, ...ocultos];
    });
  };

  const TILES_MEDICOES_META = {
    tabela: { titulo: 'Boletins de Medição' },
    grafico: { titulo: 'Previsto × Medido — Acumulado' },
  };

  // Ordenação da tabela — BM decrescente (mais recente primeiro) por
  // padrão, pedido explícito (2026-08-19: "tem que vir ordenado do maior
  // para o menor"). Clicar num cabeçalho reordena por qualquer coluna;
  // toda coluna nasce em decrescente no primeiro clique — maior valor /
  // BM mais alto / data mais recente primeiro, mesmo critério em todas.
  // Por isso a direção inicial sai de `COLUNAS_MEDICOES` em vez de um
  // mapa escrito à mão: coluna nova entra já com o comportamento certo,
  // sem precisar lembrar de cadastrar aqui.
  const [ordenarPorTabela, setOrdenarPorTabela] = useState('bm_label');
  const [ordenarDirTabela, setOrdenarDirTabela] = useState('desc');
  const alternarOrdenacaoTabela = (campo) => {
    if (ordenarPorTabela === campo) setOrdenarDirTabela(d => d === 'asc' ? 'desc' : 'asc');
    else { setOrdenarPorTabela(campo); setOrdenarDirTabela('desc'); }
  };
  // Ordena a lista COMPLETA (faturado + pendente) — é uma tabela só
  // agora. `bm_label` ordena pelo número extraído do rótulo (o texto
  // cru colocaria "10" antes de "9"); rótulo sem número nenhum
  // (ex.: "MSE x ROCKTEC") vai pro fim.
  const boletinsOrdenados = useMemo(() => {
    if (!boletinsRaw) return null;
    const dir = ordenarDirTabela === 'asc' ? 1 : -1;
    const valorDe = (r) => {
      if (ordenarPorTabela === 'bm_label') { const n = Number(bmCurto(r.bm_label)); return isNaN(n) ? -Infinity : n; }
      // "Farol" não é campo do banco: ordena pelo desvio que ele
      // representa, então clicar na coluna traz o pior (ou o melhor)
      // desempenho primeiro. Linha sem previsto (farol cinza) não tem
      // desvio e vai pro fim.
      if (ordenarPorTabela === 'farol') {
        const p = r.valor_previsto != null ? Number(r.valor_previsto) : null;
        const m = r.valor_medido != null ? Number(r.valor_medido) : null;
        return (p && m != null) ? (m / p - 1) * 100 : -Infinity;
      }
      const v = r[ordenarPorTabela];
      if (v == null) return -Infinity;
      return v;
    };
    return boletinsRaw.slice().sort((a, b) => {
      const va = valorDe(a), vb = valorDe(b);
      return va < vb ? -1 * dir : va > vb ? 1 * dir : 0;
    });
  }, [boletinsRaw, ordenarPorTabela, ordenarDirTabela]);

  if (!obraCfg?.origemCP) return <CartaoEstado texto="Sem código de contrato (CP) mapeado ainda para esta obra" maxHeight={620} />;
  if (contratoRaw === null || boletinsRaw === null) return <CartaoEstado texto="Carregando medições…" maxHeight={620} />;
  if (contratoErro || boletinsErro) return <CartaoEstado texto="Erro ao carregar contratos_medicao / boletins_medicao" maxHeight={620} tom={T.red} />;
  if (boletinsRaw.length === 0) return <CartaoEstado texto="Nenhum boletim de medição lançado para esta obra" maxHeight={620} />;

  // Valor Contrato = VALOR TOTAL da planilha (contrato base + OCs) — mesmo
  // conceito do KPI antigo, agora vindo de `contratos_medicao.valor_total`
  // em vez do `CONTRATOS_CP.original + extras` hardcoded.
  const temContrato = contratoRaw && contratoRaw.valor_total != null;
  const valorContrato = temContrato ? Number(contratoRaw.valor_total) : null;
  // Valor Medido = soma do `valor_medido` de todo boletim já faturado —
  // substitui `FD + soma(nfs)`; agora é tudo uma coisa só no ledger.
  const valorMedido = soma(historico, 'valor_medido');
  const percMedido = (valorContrato != null && valorMedido != null) ? (valorMedido / valorContrato) * 100 : null;
  const saldoAFaturar = (valorContrato != null && valorMedido != null) ? valorContrato - valorMedido : null;
  const fatiasContrato = temContrato ? [
    { label: 'Saldo a Faturar', valor: saldoAFaturar, cor: T.mut2 },
    { label: 'Valor Medido', valor: valorMedido || 0, cor: T.green },
  ] : [];

  // Próximo Faturamento — 1ª linha da Previsão que já tem VALOR PREVISTO
  // lançado; se nenhuma tiver, cai pra 1ª linha da fila mesmo sem valor
  // (normalmente o "BM vigente"), só pra mostrar BM/período sem valor.
  const proximo = previsao.length ? (previsao.find(p => p.valor_previsto != null) || previsao[0]) : null;
  const temProximo = !!proximo;
  const percProximo = (temProximo && proximo.valor_previsto != null && valorContrato) ? (Number(proximo.valor_previsto) / valorContrato) * 100 : null;

  // Farol Medido × Físico — mesma lógica de sempre (corte da Curva S mais
  // próximo da data do ÚLTIMO FATURAMENTO), agora usando
  // `historico[].data_faturamento` no lugar de `nfs.emissao`.
  const dataUltimoFaturamento = historico.length ? historico.reduce((max, r) => (r.data_faturamento && r.data_faturamento > max ? r.data_faturamento : max), historico[0].data_faturamento) : null;
  const dtUltimoFaturamento = parseDataCorte(dataUltimoFaturamento);
  const corteFisico = (curvaFisica && curvaFisica.length && dtUltimoFaturamento)
    ? curvaFisica
        .filter(r => r.acum_realizado != null && r.data)
        .reduce((melhor, r) => {
          const dtLinha = parseDataCorte(r.data);
          if (!dtLinha || isNaN(dtLinha.getTime())) return melhor;
          const dist = Math.abs(dtLinha - dtUltimoFaturamento);
          return (!melhor || dist < melhor.dist) ? { linha: r, dist } : melhor;
        }, null)
    : null;
  const percFisico = corteFisico ? corteFisico.linha.acum_realizado * 100 : null;
  const farolDiff = (percMedido != null && percFisico != null) ? percMedido - percFisico : null;
  const farolTom = farolDiff != null ? corDesvioTom(farolDiff) : null;

  const fmtPeriodo = (r) => r.periodo_inicio ? `${fmtDataLonga(r.periodo_inicio)} – ${fmtDataLonga(r.periodo_fim)}` : '—';

  return (
    <div className="painel-gutter" style={{ flex:1, minHeight:0, display:'flex', flexDirection:'column', gap:14 }}>
      
      {/* NOVO WIDGET: FAROL HORIZONTAL COM FUNDO COLORIDO (Acima de tudo) */}
      <div 
        className={farolDiff != null ? "card hoverable balao-clicavel" : "card"} 
        onClick={farolDiff != null ? () => setFarolAberto(true) : undefined} 
        style={{ 
          display:'flex', alignItems:'center', gap:16, padding:'10px 16px', borderRadius:10, 
          cursor: farolDiff != null ? 'pointer' : 'default', flexShrink:0,
          background: farolTom ? farolTom.bg : '#eef0f3',
          borderColor: farolTom ? farolTom.borda : 'var(--line)'
        }}
      >
        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
          <span style={{ width:12, height:12, borderRadius:'50%', background: farolTom ? farolTom.cor : T.mut, boxShadow:`0 0 0 3px ${farolTom ? farolTom.borda : 'rgba(0,0,0,0.05)'}` }} />
          <span className="mono" style={{ fontSize:11.5, fontWeight:700, letterSpacing:'0.06em', textTransform:'uppercase', color:T.ink }}>Farol Medido × Físico</span>
        </div>
        
        <div style={{ width:1, height:16, background: farolTom ? farolTom.borda : 'var(--line)' }} />
        
        {farolDiff != null ? (
          <>
            <div style={{ display:'flex', alignItems:'center', gap:20, fontSize:12.5 }}>
              <span><span style={{ color:T.mut }}>Medido: </span><span style={{ fontWeight:600, color:T.ink }}>{percMedido.toFixed(2)}%</span></span>
              <span><span style={{ color:T.mut }}>Físico (Curva S): </span><span style={{ fontWeight:600, color:T.ink }}>{percFisico.toFixed(2)}%</span></span>
              <span><span style={{ color:T.mut }}>Diferença: </span><span className="mono" style={{ fontWeight:700, color:farolTom.cor }}>{farolDiff > 0 ? '+' : ''}{farolDiff.toFixed(2)}%</span></span>
            </div>
            <div style={{ marginLeft:'auto', fontSize:11, color:T.mut2 }}>
              Clique para ver o detalhamento e totais
            </div>
          </>
        ) : (
          <div style={{ fontSize:12.5, color:T.mut }}>
            Dados insuficientes no momento para comparar o medido com o físico.
          </div>
        )}
      </div>

      {MOSTRAR_TOPO_MEDICOES && (
      <div className="kpi-row-flex">
        {/* Farol Medido × Físico — balão BEM MENOR (só a luz, largura fixa,
            não divide espaço igual com os outros) e vem primeiro na
            fileira. Clique abre o detalhe (%medido/%físico/diferença/corte
            usado). % físico é o Realizado Acumulado da Curva S
            (`acum_realizado`), no corte mais próximo da data do ÚLTIMO
            FATURAMENTO (não o corte de hoje). Cor reaproveita a paleta de
            severidade já usada em Desvios (`corDesvioTom`). */}
        <div className={`farol-fix ${farolDiff != null ? 'card hoverable balao-clicavel' : 'card'}`}
          onClick={farolDiff != null ? () => setFarolAberto(true) : undefined}
          title="Farol Medido × Físico"
          style={{ flex:'0 0 84px', borderRadius:16, background: farolTom ? farolTom.bg : '#eef0f3', border:`1px solid ${farolTom ? farolTom.borda : 'var(--line)'}`,
            padding:'10px 10px', display:'flex', flexDirection:'column', alignItems:'center', height:'auto', alignSelf:'stretch', minHeight:74, boxSizing:'border-box', cursor: farolDiff != null ? 'pointer' : 'default' }}>
          <span className="mono" style={{ fontSize:8.5, letterSpacing:'0.06em', color:T.mut, textTransform:'uppercase', fontWeight:600, textAlign:'center', lineHeight:1.2 }}>Farol</span>
          <div style={{ flex:1, minHeight:8 }} />
          {farolDiff != null ? (
            <span style={{ width:20, height:20, borderRadius:'50%', background:farolTom.cor, boxShadow:`0 0 0 5px ${farolTom.bg}` }} />
          ) : (
            <span className="mono" style={{ fontSize:9, color:T.mut }}>{curvaFisica === null ? '···' : '—'}</span>
          )}
          <div style={{ minHeight:15, marginTop:2 }} />
        </div>
        <div style={{ flex:1, minWidth:0 }}>
          <Balao titulo="Valor Contrato" cor={T.ink} bg="rgba(37,99,235,0.05)" borda="rgba(37,99,235,0.1)"
            valor={valorContrato != null ? fmtReais(valorContrato) : 'sem dado'}
            onClick={temContrato ? () => setContratoAberto(true) : undefined} />
        </div>
        <div style={{ flex:1, minWidth:0 }}>
          <Balao titulo="Valor Medido" cor={T.green} bg="rgba(31,157,87,0.06)" borda="rgba(31,157,87,0.15)"
            valor={valorMedido != null ? fmtReais(valorMedido) : 'sem dado'}
            sub={percMedido != null ? `${percMedido.toFixed(2)}% do contrato` : undefined}
            onClick={valorMedido != null ? () => setMedidoAberto(true) : undefined} />
        </div>
        <div style={{ flex:1, minWidth:0 }}>
          <Balao titulo="Período do Próximo Faturamento" cor={T.ink} bg="rgba(31,157,87,0.06)" borda="rgba(31,157,87,0.15)"
            valor={temProximo ? fmtPeriodo(proximo) : 'sem previsão'}
            sub={temProximo ? `BM ${bmCurto(proximo.bm_label)}` : undefined} />
        </div>
        <div style={{ flex:1, minWidth:0 }}>
          <Balao titulo="Valor do Próximo Faturamento" cor={T.green} bg="rgba(31,157,87,0.06)" borda="rgba(31,157,87,0.15)"
            valor={(temProximo && proximo.valor_previsto != null) ? fmtReais(Number(proximo.valor_previsto)) : 'sem previsão'}
            sub={percProximo != null ? `${percProximo.toFixed(2)}% do contrato` : undefined} />
        </div>
      </div>
      )}

      {/* `overflowX:'auto'` é a rede de segurança: se os mínimos (pizza 220
          + gráfico 320, + as faixas de 22px dos resizers) somados passarem
          da largura real da tela, a fileira rola por dentro dela mesma em
          vez de estourar a página inteira pra direita. A fileira inteira
          só entra quando pizza ou KPIs/gráfico antigo estão ligados —
          `.medicoes-row` é `flex:1`, e vazia ela roubaria a altura toda
          do grid de widgets abaixo. */}
      {(MOSTRAR_PIZZA_MEDICOES || MOSTRAR_TOPO_MEDICOES) && (
      <div ref={areaRef} className="medicoes-row">
        {temContrato && MOSTRAR_PIZZA_MEDICOES && (
          <React.Fragment>
            <div className="card" style={{ flex:`1 1 ${pizzaPct}%`, minWidth:220, minHeight:0, display:'flex', flexDirection:'column', alignItems:'center', padding:'16px 18px' }}>
              <div className="mono" style={{ fontSize:11, letterSpacing:'0.08em', color:T.mut, textTransform:'uppercase', marginBottom:10, alignSelf:'flex-start', flexShrink:0 }}>Situação do Contrato</div>
              <div style={{ flex:1, minHeight:0, width:'100%' }}>
                <GraficoPizza fatias={fatiasContrato} />
              </div>
              <div style={{ display:'flex', flexDirection:'row', flexWrap:'nowrap', justifyContent:'center', alignItems:'center', gap:14, marginTop:16, width:'100%', flexShrink:0 }}>
                {fatiasContrato.map((f, i) => (

      {/* Blocos do grid de widgets — pedido explícito (2026-08-19):

          colocar lado a lado". Histórico, Previsão e o gráfico
          Previsto×Medido formam o conjunto (sem KPIs, pedido explícito);

          `layoutTiles`/`tileOcultos` acima). `renderTile` devolve só o

      {(() => {
      const renderTile = (id) => {
        const meta = TILES_MEDICOES_META[id];

              {/* Respiro horizontal das células é 10px (e não os 14px do

                  na horizontal mesmo em monitor de 1920 — inevitável nesse

              <table className="tabela-medicoes" style={{ width:'100%', minWidth:1450, textAlign:'left', borderCollapse:'collapse', whiteSpace:'nowrap' }}>

                      <td className="mono" style={{ padding:'9px 10px', textAlign:'right', fontSize:12, color:T.mut }}>{r.desconto_fd ? fmtReais(r.desconto_fd) : '—'}</td>
                      <td className="mono" style={{ padding:'9px 10px', textAlign:'right', fontSize:12, fontWeight:600, color:T.ink, fontVariantNumeric:'tabular-nums' }}>{r.valor_faturado != null ? fmtReais(r.valor_faturado) : '—'}</td>

                      <td style={{ padding:'9px 10px' }}><BadgeStatusMedicao texto={r.status_recebimento} /></td>

                {/* Resumo — soma sobre TODOS os boletins (faturado +

                    [[modelo-dados-supabase]]), somar daria número sem

      return (

        // `resizeHandles` com as 8 alças e `compactType={null}` andam

        // para o lado direito"). Redimensionar pelo topo/esquerda mexe no
        // x/y do bloco, não só no w/h — com compactação vertical ligada, a
        // lib puxava o bloco de volta pra cima logo depois e o gesto não

        // `onDragStop`/`onResizeStop` chamam `organizarLayout` — pedido
        // explícito (2026-08-21): "o organizar tem que ser automático, à

        // (ver comentário no estado `modoAjuste`).
        <GridLayoutMedicoes layout={layoutVisivel} onLayoutChange={aoMudarLayoutTiles}

          isDraggable={modoAjuste} isResizable={modoAjuste}

          resizeHandles={['nw', 'n', 'ne', 'w', 'e', 'sw', 's', 'se']} compactType={null}>
          {idsVisiveis.map(id => <div key={id}>{renderTile(id)}</div>)}
        </GridLayoutMedicoes>
      );
      })()}

          </span>

        <span style={{ flex:1, minWidth:8 }} />
        {tileOcultos.map(id => (
          <button key={id} onClick={() => setTileOcultos(o => o.filter(x => x !== id))} className="mono"

          style={{ background:'none', border:'1px solid var(--line)', color:T.mut, borderRadius:8, padding:'5px 11px', cursor:'pointer', fontSize:11.5 }}>
          Restaurar layout
        </button>

        <div onClick={() => setContratoAberto(false)} className="modal-overlay-in" style={{ position:'fixed', inset:0, zIndex:10001, background:'rgba(16,24,40,0.45)', backdropFilter:'blur(3px)', display:'flex', alignItems:'center', justifyContent:'center', padding:24 }}>

            <div style={{ padding:'14px 20px', borderBottom:'1px solid #eef0f3', display:'flex', alignItems:'center', gap:12, flexShrink:0 }}>
              <div style={{ flex:1, minWidth:0 }}>

              </div>
              <div style={{ display:'flex', justifyContent:'space-between', padding:'9px 0', borderBottom:'1px solid #eef0f3', fontSize:13, color:T.body }}>

                </div>

        </div>

      {medidoAberto && valorMedido != null && (
        <div onClick={() => setMedidoAberto(false)} className="modal-overlay-in" style={{ position:'fixed', inset:0, zIndex:10001, background:'rgba(16,24,40,0.45)', backdropFilter:'blur(3px)', display:'flex', alignItems:'center', justifyContent:'center', padding:24 }}>
          <div onClick={e => e.stopPropagation()} className="modal-card-in" style={{ background:'#fff', border:'1px solid #e4e7ec', borderRadius:16, width:'100%', maxWidth:440, maxHeight:'68vh', display:'flex', flexDirection:'column', overflow:'hidden', boxShadow:'0 24px 60px -12px rgba(16,24,40,0.25)' }}>
            <div style={{ padding:'14px 20px', borderBottom:'1px solid #eef0f3', display:'flex', alignItems:'center', gap:12, flexShrink:0 }}>
              <div style={{ flex:1, minWidth:0 }}>
                <div className="mono" style={{ fontSize:10, letterSpacing:'0.16em', color:T.mut2, textTransform:'uppercase', fontWeight:600, marginBottom:4 }}>Performance</div>
                <div style={{ fontSize:15, fontWeight:700, color:T.ink }}>Indicador de Performance Financeira — {obraNome}</div>
              </div>
              <button onClick={() => setMedidoAberto(false)} style={{ background:'#eef0f3', border:'none', color:T.mut, borderRadius:10, padding:'7px 12px', cursor:'pointer', fontSize:15, lineHeight:1, flexShrink:0 }}>✕</button>
            </div>
            <div style={{ overflowY:'auto', flex:1, minHeight:0, padding:'6px 20px 20px' }}>
              <div style={{ display:'flex', justifyContent:'space-between', padding:'12px 0', fontSize:14, color:T.ink, fontWeight:700 }}>

              </div>
              {(valorMedido - valorContrato) < 0 && (
                <div style={{ marginTop:12, padding:'8px 10px', borderRadius:8, background:'rgba(31,157,87,0.08)', border:'1px solid rgba(31,157,87,0.25)', fontSize:12, color:T.green, lineHeight:1.4 }}>

                </div>
              )}
              {(valorMedido - valorContrato) >= 0 && (

                  ⚠ Acima do previsto — contrato foi ultrapassado.
                </div>
              )}
            </div>
          </div>
        </div>
      )}

              {(() => {
