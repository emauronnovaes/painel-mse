            <div style={{ width:13, height:13, borderRadius:'50%', border:`1px solid ${T.mut2}`, color:T.mut, display:'grid', placeItems:'center', fontSize:9, fontWeight:700, fontStyle:'italic', cursor:'help', lineHeight:1, flexShrink:0 }}>i</div>
            {showInfo && (
              <div className="modal-card-in" style={{ position:'absolute', bottom:'calc(100% + 8px)', ...(infoAlign === 'right' ? { right:0 } : { left:0 }), zIndex:400, width:230, background:'#fff', border:'1px solid #e4e7ec', borderRadius:10, padding:'10px 12px', boxShadow:'0 12px 32px rgba(16,24,40,0.16)', fontSize:11, fontWeight:400, color:T.body, lineHeight:1.5, textTransform:'none', letterSpacing:'normal', cursor:'default' }}>
                {info}
              </div>
            )}
          </div>
        )}
      </div>
      <div style={{ fontSize:16, fontWeight:700, color: cor || T.body, lineHeight:1.1, whiteSpace:'nowrap' }}>{value ?? '—'}</div>
    </div>
  );
}

function CartaoAtivo({ c, onVerEfetivo, linhasVisiveis, fmtDateISO, fmtQtd }){
  const e = c.eap;
  const dtI = e ? (fmtDateISO(e.data_inicio_reprogramado) || fmtDateISO(e.data_inicio)) : null;
  const dtF = e ? (fmtDateISO(e.data_termino_reprogramado) || fmtDateISO(e.data_termino)) : null;
  const fmt2 = v => v != null && v !== '' ? parseFloat(v).toFixed(2) : null;
  const avanco = e?.avanco_atual != null ? parseFloat(e.avanco_atual) : null;
  const qualidade = c.status_qualidade || 'Pendente Qualidade';
  const qualidadeColor = !c.status_qualidade ? T.mut
    : /bom|ótimo|otimo|excelente|conforme/i.test(qualidade) && !/não|nao/i.test(qualidade) ? T.green
    : /satisfat/i.test(qualidade) && !/insatisfat/i.test(qualidade) ? T.amber
    : T.red;
  const temHistorico = (c.aponts || []).some(a => a.row);
  const mostrarHistorico = temHistorico && linhasVisiveis.historico;
  const mostrarIndices = !!c.indices && linhasVisiveis.indices;
  const hasMetrics = temHistorico || c.aderUltimo || e?.qtd != null || e?.meta_diaria != null || e?.saldo_qtd != null || qualidade || mostrarIndices;
  // Índice de produtividade (v_indices_financeiros_diario.indice_receita_custo_incorrido):
  // >=1 favorável (rendendo mais do que custando); <1 desfavorável.
  const idxCor = v => v == null ? T.mut2 : v >= 1 ? T.green : T.red;
  const idxTxt = v => v == null ? null : v.toFixed(2);
  // Cor do acento: verde se concluído, vermelho se atrasado, azul se dentro do prazo.
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const dtFRaw = e ? ((e.data_termino_reprogramado && !e.data_termino_reprogramado.startsWith('0000') && e.data_termino_reprogramado !== '') ? e.data_termino_reprogramado : e.data_termino) : null;
  const dtFDate = dtFRaw ? new Date(dtFRaw.split('T')[0]) : null;
  const acento = avanco >= 100 ? T.green : (dtFDate && dtFDate < hoje) ? T.red : T.blue;

  return (
    <div style={{ borderRadius:14, overflow:'hidden', border:'1px solid #cfd5dd', boxShadow:'0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.04)', flexShrink:0 }}>
      <div style={{ background:`linear-gradient(90deg, ${acento}26 0%, #fbfcfd 100%)`, borderLeft:`3px solid ${acento}`, padding:'10px 16px' }}>
        <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:5, flexWrap:'wrap' }}>
          <span style={{ fontSize:13, fontWeight:700, color:T.amber, letterSpacing:'0.05em' }}>Código: {c.edt}</span>
          {dtI && dtF && <span style={{ fontSize:11, fontWeight:600, color:T.mut }}>{dtI} — {dtF}</span>}
          <span className="mono" style={{ fontSize:9, fontWeight:600, letterSpacing:'0.08em', color:T.mut2, background:'#eef0f3', padding:'2px 9px', borderRadius:5, textTransform:'uppercase' }}>{c.nome_obra}</span>
          {c.efetivo?.length > 0 && (
            <button onClick={onVerEfetivo} title="Ver efetivo alocado" className="mono"
              style={{ fontSize:9, fontWeight:600, letterSpacing:'0.08em', color:T.green, background:'rgba(31,157,87,0.12)', border:'1px solid rgba(31,157,87,0.3)', padding:'2px 9px', borderRadius:5, textTransform:'uppercase', cursor:'pointer' }}>
              Efetivo: {c.efetivo.length}
            </button>
          )}
          <span style={{ marginLeft:'auto', display:'flex', alignItems:'baseline', gap:10 }}>
            {avanco != null && <span style={{ fontSize:12, fontWeight:700, letterSpacing:'0.04em', color:T.mut }}>Avanço {parseFloat(avanco.toFixed(1))}%</span>}
            <span style={{ fontSize:11, color:T.mut2 }}>#{c.card_id}</span>
          </span>
        </div>
        <div style={{ fontSize:14, fontWeight:600, color:T.ink, lineHeight:1.35 }}>{c.tarefa}</div>
        {(e?.local || e?.disciplina) && (
          <div style={{ marginTop:4, fontSize:11, color:T.mut, display:'flex', gap:14, flexWrap:'wrap' }}>
            {e?.local && <span><span style={{ fontWeight:700, textTransform:'uppercase', letterSpacing:'0.06em', fontSize:9 }}>Local </span>{e.local}</span>}
            {e?.disciplina && <span><span style={{ fontWeight:700, textTransform:'uppercase', letterSpacing:'0.06em', fontSize:9 }}>Disciplina </span>{e.disciplina}</span>}
          </div>
        )}
      </div>
      {hasMetrics && (
        <div style={{ background:'#fff', borderTop:'1px solid #eef0f3', padding:'10px 16px', display:'flex', gap:16, flexWrap:'nowrap', overflowX:'auto', alignItems:'stretch' }}>
          {e?.qtd != null && <CardMetric label="Quantidade" value={fmtQtd(fmt2(e.qtd), e.unidade)} />}
          {e?.saldo_qtd != null && <CardMetric label="Saldo" value={fmtQtd(fmt2(e.saldo_qtd), e.unidade)} />}
          {e?.meta_diaria != null && <CardMetric label="Meta Diária" value={fmtQtd(fmt2(e.meta_diaria), e.unidade)} />}
          {(e?.qtd != null || e?.saldo_qtd != null || e?.meta_diaria != null) && <div style={{ width:1, alignSelf:'stretch', background:'#e4e7ec' }} />}
          {qualidade && <CardMetric label="Qualidade" value={qualidade} cor={qualidadeColor} />}
          {qualidade && c.aderUltimo && <div style={{ width:1, alignSelf:'stretch', background:'#e4e7ec' }} />}
          {c.aderUltimo && (() => {
            const [ay, am, ad] = c.aderUltimo.data.split('T')[0].split('-');
            const semDado = c.aderUltimo.pct == null;
            const cor = semDado ? T.mut2 : c.aderUltimo.pct >= 100 ? T.green : c.aderUltimo.pct >= 80 ? T.blue : T.red;
            return <CardMetric label={`Aderência ${ad}/${am}`} value={semDado ? null : `${c.aderUltimo.pct.toFixed(0)}%`} cor={cor} />;
          })()}
          {c.aderUltimo && mostrarIndices && <div style={{ width:1, alignSelf:'stretch', background:'#e4e7ec' }} />}
          {mostrarIndices && (
            <CardMetric label="Índice de Produtividade"
              value={idxTxt(c.indices.indice_receita_custo_incorrido)}
              cor={idxCor(c.indices.indice_receita_custo_incorrido)}
              info="Mede a produtividade da atividade até o momento. Acima de 1,00 a execução está favorável; abaixo disso, indica queda de produtividade."
              infoAlign="right" />
          )}
        </div>
      )}
      {mostrarHistorico && (
        <div style={{ background:'#fff', borderTop:'1px dashed #eef0f3', padding:'10px 16px', display:'flex', gap:16, flexWrap:'wrap', alignItems:'center' }}>
          {c.aponts.map((a, i) => {
            const [ay, am, ad] = a.data.split('-');
            const destaque = a.data === c.aderUltimo?.data;
            return (
              <CardMetric key={a.data} label={`Apontamento ${ad}/${am}`}
                value={a.row ? fmtQtd(fmt2(a.row.avanco_diario), e?.unidade) : null}
                cor={destaque ? (a.row ? T.blue : undefined) : T.mut2}
                style={destaque ? { background:'rgba(37,99,235,0.07)', border:'1px solid rgba(37,99,235,0.3)', borderRadius:8, padding:'8px 12px' } : { opacity:0.75 }} />
            );
          })}
        </div>
      )}
    </div>
  );
}

function PopupCardsEncarregado({ nome, obraId, obraNome, onClose }){
  const obraCfg = OBRAS.find(o => o.id === obraId);
  const [loading, setLoading] = useState(true);
  const [erro, setErro] = useState(null);
  const [cards, setCards] = useState([]);
  const [efetivoCard, setEfetivoCard] = useState(null);
  const [filtros, setFiltros] = useState({ efetivo:false, apontou:false });
  const [linhasVisiveis, setLinhasVisiveis] = useState({ historico:true, indices:true });

  const nomeNorm = nome.trim().toUpperCase();

  const fmtDateISO = (iso) => {
    if (!iso || iso.startsWith('0000') || iso === '') return null;
    const d = iso.split('T')[0].split('-');
    return d.length === 3 ? `${d[2]}/${d[1]}/${d[0]}` : null;
  };
  const fmtQtd = (val, unidade) => (val === null || val === undefined || val === '') ? null : `${val}${unidade ? ' ' + unidade : ''}`.trim();

  useEffect(() => {
    setLoading(true); setErro(null); setCards([]);
    const headers = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };
    const alvo = (obraCfg?.origemTV || '').trim().toUpperCase();
    fetch(`${SUPABASE_URL}/rest/v1/cards_ativos?responsavel_encarregado=ilike.*${encodeURIComponent(nomeNorm)}*&order=nome_obra.asc,edt.asc`, { headers })
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      .then(async cardsRaw => {
        const cardsData = (Array.isArray(cardsRaw) ? cardsRaw : []).filter(c => (c.nome_obra || '').trim().toUpperCase() === alvo);
        if (!cardsData.length) { setCards([]); setLoading(false); return; }
        const ids = cardsData.map(c => c.card_id).join(',');
        const eapUrl = `${SUPABASE_URL}/rest/v1/EAP?id=in.(${ids})&select=id,disciplina,local,unidade,qtd,saldo_qtd,efetivo_previsto,avanco_atual,desvio,data_inicio,data_termino,data_inicio_reprogramado,data_termino_reprogramado,meta_diaria`;
        const efUrl  = `${SUPABASE_URL}/rest/v1/apontamento_efetivo?tarefa_id=in.(${ids})&select=tarefa_id,funcionario_nome,nome_funcao,data_consulta&order=funcionario_nome.asc`;
        // `Apontamentos` via `fetchPaginado` (não `fetch` cru + `limit=`
        // ignorado pelo PostgREST) — mesmo cap de 1000 linhas já corrigido
        // no `emLotes` da tela de ranking; aqui o universo é menor (só os
        // cards de 1 encarregado), mas o mesmo risco existe com bastante
        // histórico.
        const apontUrl = `${SUPABASE_URL}/rest/v1/Apontamentos?id=in.(${ids})&select=id,status_qualidade,data_do_input,avanco_diario,meta_diaria,UUID&order=data_do_input.desc`;
        const finUrl = `${SUPABASE_URL}/rest/v1/v_indices_financeiros_diario?tarefa_id=in.(${ids})&select=tarefa_id,data,indice_receita_custo_incorrido&order=data.desc&limit=20000`;
        const [eapRes, efRes, apontDataRaw, finRes] = await Promise.all([
          fetch(eapUrl, { headers }), fetch(efUrl, { headers }), fetchPaginado(apontUrl, headers), fetch(finUrl, { headers }),
        ]);
        const eapData = eapRes.ok ? await eapRes.json() : [];
        const efData = efRes.ok ? await efRes.json() : [];
        const apontData = apontDataRaw || [];
        const finData = finRes.ok ? await finRes.json() : [];
        const eapMap = {}; (Array.isArray(eapData) ? eapData : []).forEach(e => { eapMap[e.id] = e; });
        const finMap = {}; (Array.isArray(finData) ? finData : []).forEach(f => { const k = String(f.tarefa_id); if (!finMap[k]) finMap[k] = f; });
        const apontMap = {}; (Array.isArray(apontData) ? apontData : []).forEach(a => { const k = String(a.id); if (a.data_do_input) (apontMap[k] = apontMap[k] || []).push(a); });
        const efMap = {}; (Array.isArray(efData) ? efData : []).forEach(r => {
          const k = String(r.tarefa_id);
          if (!efMap[k] || r.data_consulta > efMap[k].data) efMap[k] = { data: r.data_consulta, rows: [] };
          if (r.data_consulta === efMap[k].data) efMap[k].rows.push(r);
        });

        const diaAderPorCard = {}; const apontDiaAder = {}; const qualMap = {};
        Object.keys(apontMap).forEach(k => {
          const rows = apontMap[k];
          const dia = getDiaAderenciaComFallback(ymd => rows.some(r => (r.data_do_input || '').startsWith(ymd)));
          diaAderPorCard[k] = dia;
          // Mesmo card pode ter mais de 1 linha no mesmo dia (achado real,
          // ver `emLotes` da tela de ranking) — prioriza a que tem status
          // de qualidade preenchido em vez da simplesmente primeira do array.
          const rowsDoDia = rows.filter(r => (r.data_do_input || '').startsWith(dia));
          const rowDoDia = rowsDoDia.find(r => r.status_qualidade?.trim()) || rowsDoDia[0] || null;
          apontDiaAder[k] = rowDoDia;
          if (rowDoDia?.status_qualidade?.trim()) qualMap[k] = rowDoDia.status_qualidade.trim();
        });
        const uuids = Object.values(apontDiaAder).filter(Boolean).map(r => r.UUID).filter(Boolean);
        const aderPorUuid = {};
        if (uuids.length) {
          const vwRes = await fetch(`${SUPABASE_URL}/rest/v1/vw_dados_tv?select=ID,ADERENCIA_LINEAR&ID=in.(${uuids.join(',')})&limit=5000`, { headers });
          const vwData = vwRes.ok ? await vwRes.json() : [];
          (Array.isArray(vwData) ? vwData : []).forEach(r => { if (r.ADERENCIA_LINEAR != null) aderPorUuid[r.ID] = parseFloat(r.ADERENCIA_LINEAR); });
        }
        const ymdLocal = dt => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
        const dias3 = [1, 2, 3].map(n => { const d = new Date(); d.setDate(d.getDate() - n); return ymdLocal(d); });
        setCards(cardsData.map(c => {
          const rows = apontMap[String(c.card_id)] || [];
          const aponts = dias3.map(dia => ({ data: dia, row: rows.find(r => (r.data_do_input || '').startsWith(dia)) || null }));
          const apontAder = apontDiaAder[String(c.card_id)] || null;
          const aderLin = apontAder && apontAder.UUID != null ? aderPorUuid[apontAder.UUID] : undefined;
          const aderUltimo = { data: diaAderPorCard[String(c.card_id)] || getDiaAderencia(), pct: (aderLin != null && !isNaN(aderLin)) ? aderLin * 100 : null };
          return { ...c, eap: eapMap[c.card_id] || null, efetivo: efMap[String(c.card_id)]?.rows || [], aponts, aderUltimo, temApontUltimoDia: !!apontAder, status_qualidade: qualMap[String(c.card_id)] || null, indices: finMap[String(c.card_id)] || null };
        }));
        setLoading(false);
      })
      .catch(e => { setErro(e.message); setLoading(false); });
  }, [nomeNorm, obraId]);

  const cardsFiltrados = cards.filter(c =>
    (!filtros.efetivo || (c.efetivo || []).length > 0) &&
    (!filtros.apontou || c.temApontUltimoDia));
  const numColaboradores = new Set(
    cardsFiltrados.flatMap(c => (c.efetivo || []).map(f => (f.funcionario_nome || '').trim().toUpperCase())).filter(Boolean)
  ).size;

  return (
    <div onClick={onClose} className="modal-overlay-in" style={{ position:'fixed', inset:0, zIndex:10000, background:'rgba(16,24,40,0.45)', backdropFilter:'blur(3px)', display:'flex', alignItems:'center', justifyContent:'center', padding:24 }}>
      <div onClick={e => e.stopPropagation()} className="modal-card-in" style={{ background:'#fff', border:'1px solid #e4e7ec', borderRadius:16, width:'100%', maxWidth:960, maxHeight:'72vh', display:'flex', flexDirection:'column', overflow:'hidden', boxShadow:'0 24px 60px -12px rgba(16,24,40,0.25)' }}>

        <div style={{ padding:'16px 22px', borderBottom:'1px solid #eef0f3', display:'flex', alignItems:'center', gap:14, flexShrink:0 }}>
          <div style={{ flex:1, minWidth:0 }}>
            <div className="mono" style={{ fontSize:10, letterSpacing:'0.16em', color:T.mut2, textTransform:'uppercase', fontWeight:600, marginBottom:4 }}>Cards Ativos</div>
            <div style={{ fontSize:20, fontWeight:700, color:T.ink, textTransform:'uppercase', letterSpacing:'0.03em', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{nome}</div>
          </div>
          {!loading && (
            <div style={{ fontSize:32, fontWeight:700, lineHeight:1, color: numColaboradores > 0 ? T.green : T.mut2, flexShrink:0 }}>
              {numColaboradores}<span style={{ fontSize:11, fontWeight:600, color:T.mut2, marginLeft:4 }}>colaboradores</span>
            </div>
          )}
          {!loading && <div style={{ width:1, height:30, background:'#eef0f3', flexShrink:0 }} />}
          {!loading && (
            <div style={{ fontSize:32, fontWeight:700, lineHeight:1, color: cardsFiltrados.length > 0 ? T.amber : T.mut2, flexShrink:0 }}>
              {cardsFiltrados.length}<span style={{ fontSize:11, fontWeight:600, color:T.mut2, marginLeft:4 }}>{(filtros.efetivo || filtros.apontou) ? `de ${cards.length} cards` : 'cards'}</span>
            </div>
          )}
          <button onClick={onClose} style={{ background:'#eef0f3', border:'none', color:T.mut, borderRadius:10, padding:'8px 13px', cursor:'pointer', fontSize:16, lineHeight:1, flexShrink:0 }}>✕</button>
        </div>

        {!loading && !erro && cards.length > 0 && (
          <div style={{ padding:'10px 22px', borderBottom:'1px solid #eef0f3', display:'flex', alignItems:'center', gap:8, flexShrink:0, flexWrap:'nowrap', overflowX:'auto' }}>
            <span className="mono" style={{ fontSize:9, fontWeight:600, letterSpacing:'0.14em', color:T.mut2, textTransform:'uppercase', whiteSpace:'nowrap' }}>Filtrar</span>
            {[{ key:'efetivo', label:'Efetivo Alocado' }, { key:'apontou', label:'Apontamento no Último Dia' }].map(f => {
              const on = filtros[f.key];
              return (
                <button key={f.key} onClick={() => setFiltros(v => ({ ...v, [f.key]: !v[f.key] }))} className="mono"
                  style={{ fontSize:10, fontWeight:500, letterSpacing:'0.06em', textTransform:'uppercase', padding:'6px 12px', borderRadius:999, cursor:'pointer', whiteSpace:'nowrap', flexShrink:0,
                    background: on ? T.blue : '#eef0f3', color: on ? '#fff' : T.body, border: on ? `1px solid ${T.blue}` : '1px solid #e4e7ec' }}>
                  {f.label}
                </button>
              );
            })}
            <div style={{ width:1, height:18, background:'#e4e7ec', margin:'0 2px', flexShrink:0 }} />
            <span className="mono" style={{ fontSize:9, fontWeight:600, letterSpacing:'0.14em', color:T.mut2, textTransform:'uppercase', whiteSpace:'nowrap', flexShrink:0 }}>Exibir</span>
            {[{ key:'historico', label:'Histórico de Apontamento' }, { key:'indices', label:'Índice de Produtividade' }].map(f => {
              const on = linhasVisiveis[f.key];
              return (
                <button key={f.key} onClick={() => setLinhasVisiveis(v => ({ ...v, [f.key]: !v[f.key] }))} className="mono"
                  style={{ fontSize:10, fontWeight:500, letterSpacing:'0.06em', textTransform:'uppercase', padding:'6px 12px', borderRadius:999, cursor:'pointer', whiteSpace:'nowrap', flexShrink:0,
                    background: on ? T.blue : '#eef0f3', color: on ? '#fff' : T.body, border: on ? `1px solid ${T.blue}` : '1px solid #e4e7ec' }}>
                  {f.label}
                </button>
              );
            })}
          </div>
        )}

        <div style={{ overflowY:'auto', flex:1, minHeight:0, padding:'16px 22px', display:'flex', flexDirection:'column', gap:14 }}>
          {loading && <div style={{ textAlign:'center', padding:48, fontSize:12, color:T.mut }}>Carregando…</div>}
          {erro && <div style={{ textAlign:'center', padding:48, color:T.red, fontSize:13 }}>Erro: {erro}</div>}
          {!loading && !erro && cards.length === 0 && <div style={{ textAlign:'center', padding:48, fontSize:12, color:T.mut }}>Nenhum card ativo encontrado para "{nomeNorm}"</div>}
          {!loading && !erro && cards.length > 0 && cardsFiltrados.length === 0 && <div style={{ textAlign:'center', padding:48, fontSize:12, color:T.mut }}>Nenhuma atividade atende aos filtros selecionados</div>}
          {cardsFiltrados.map(c => (
            <CartaoAtivo key={c.card_id} c={c} onVerEfetivo={() => setEfetivoCard(c)} linhasVisiveis={linhasVisiveis} fmtDateISO={fmtDateISO} fmtQtd={fmtQtd} />
          ))}
        </div>
      </div>

      {efetivoCard && (
        <div onClick={e => { e.stopPropagation(); setEfetivoCard(null); }} className="modal-overlay-in" style={{ position:'fixed', inset:0, zIndex:10001, background:'rgba(16,24,40,0.45)', backdropFilter:'blur(3px)', display:'flex', alignItems:'center', justifyContent:'center', padding:24 }}>
          <div onClick={e => e.stopPropagation()} className="modal-card-in" style={{ background:'#fff', border:'1px solid #e4e7ec', borderRadius:16, width:'100%', maxWidth:480, maxHeight:'68vh', display:'flex', flexDirection:'column', overflow:'hidden', boxShadow:'0 24px 60px -12px rgba(16,24,40,0.25)' }}>
            <div style={{ padding:'14px 20px', borderBottom:'1px solid #eef0f3', display:'flex', alignItems:'center', gap:12, flexShrink:0 }}>
              <div style={{ flex:1, minWidth:0 }}>
                <div className="mono" style={{ fontSize:10, letterSpacing:'0.16em', color:T.mut2, textTransform:'uppercase', fontWeight:600, marginBottom:4 }}>Efetivo Alocado</div>
                <div style={{ fontSize:13, fontWeight:600, color:T.ink, lineHeight:1.3 }}>{efetivoCard.tarefa}</div>
              </div>
              <div style={{ fontSize:28, fontWeight:700, lineHeight:1, color:T.green, flexShrink:0 }}>
                {efetivoCard.efetivo.length}<span style={{ fontSize:11, fontWeight:600, color:T.mut2, marginLeft:4 }}>pessoas</span>
              </div>
              <button onClick={() => setEfetivoCard(null)} style={{ background:'#eef0f3', border:'none', color:T.mut, borderRadius:10, padding:'7px 12px', cursor:'pointer', fontSize:15, lineHeight:1, flexShrink:0 }}>✕</button>
            </div>
            <div style={{ overflowY:'auto', flex:1, minHeight:0, padding:'10px 20px 16px' }}>
              {efetivoCard.efetivo.map((f, i) => (
                <div key={i} style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:12, padding:'9px 0', borderBottom: i < efetivoCard.efetivo.length - 1 ? '1px solid #eef0f3' : 'none' }}>
                  <div style={{ fontSize:13, fontWeight:600, color:T.ink, minWidth:0, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{f.funcionario_nome}</div>
                  <div className="mono" style={{ fontSize:10, fontWeight:600, letterSpacing:'0.08em', color:T.mut, textTransform:'uppercase', flexShrink:0 }}>{f.nome_funcao}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function ModuloEncarregados({ obraId, obraNome }){
  const obraCfg = OBRAS.find(o => o.id === obraId);
  const [nomeSelecionado, setNomeSelecionado] = useState(null);
  // Toggle "ASSIDUIDADE" — portado do dashboard atual (2026-08-14, pedido
  // explícito: "O toggle da assiduidade pode ser exibido"). Métrica só
  // informativa (não entra no score) — % de dias com apontamento nos
  // últimos 7 dias úteis, ver cálculo em `linhas`/`assiduidade` abaixo.
  const [showAssiduidade, setShowAssiduidade] = useState(false);

  const [tvRaw, setTvRaw] = useState(null);
  const [tvErro, setTvErro] = useState(false);
  const [cardsRaw, setCardsRaw] = useState(null);
  const [cardsErro, setCardsErro] = useState(false);
  const [qualidadeEnc, setQualidadeEnc] = useState({});
  const [produtividadeEnc, setProdutividadeEnc] = useState({});
  const [colaboradoresEnc, setColaboradoresEnc] = useState({});
  const [numColabObra, setNumColabObra] = useState(null);
  const [ptsPorNomeDia, setPtsPorNomeDia] = useState({});
  const [presencaEnc, setPresencaEnc] = useState({});

  // Aderência/meta/avanço diário por encarregado — últimos 21 dias, filtra
  // por OBRA no cliente (o valor vem com espaço/acento que não bate 100% com
  // eq. no PostgREST em todas as obras — mais seguro comparar já normalizado).
  useEffect(() => {
    setTvRaw(null); setTvErro(false);
    const headers = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };
    const desde = new Date(); desde.setDate(desde.getDate() - 21);
    const cols = encodeURIComponent('OBRA,RESPONSÁVEL,DATA,"META DO DIA","AVANÇO REGISTRADO",ADERENCIA_LINEAR');
    fetchPaginado(`${SUPABASE_URL}/rest/v1/vw_dados_tv?select=${cols}&DATA=gte.${desde.toISOString().slice(0, 10)}&order=DATA.asc`, headers)
      .then(rows => {
        if (rows === null) { setTvErro(true); setTvRaw([]); return; }
        const alvo = (obraCfg?.origemTV || '').trim().toUpperCase();
        setTvRaw(rows.filter(r => (r.OBRA || '').trim().toUpperCase() === alvo));
      })
      .catch(() => { setTvErro(true); setTvRaw([]); });
  }, [obraId]);

  // Cards ativos com encarregado responsável — define quem é elegível pro
  // ranking desta obra e alimenta os 3 fetches em lote abaixo.
  useEffect(() => {
    setCardsRaw(null); setCardsErro(false);
    const headers = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };
    fetchPaginado(`${SUPABASE_URL}/rest/v1/cards_ativos?select=card_id,nome_obra,responsavel_encarregado&responsavel_encarregado=not.is.null`, headers)
      .then(rows => {
        if (rows === null) { setCardsErro(true); setCardsRaw([]); return; }
        const alvo = (obraCfg?.origemTV || '').trim().toUpperCase();
        setCardsRaw(rows.filter(r => (r.nome_obra || '').trim().toUpperCase() === alvo));
      })
      .catch(() => { setCardsErro(true); setCardsRaw([]); });
  }, [obraId]);

  // Qualidade (Apontamentos.status_qualidade no dia de referência de cada
  // card), Produtividade (v_indices_financeiros_diario, valor mais recente) e
  // Colaboradores (apontamento_efetivo, snapshot mais recente) — as 3 usam os
  // mesmos card_id de cards_ativos, buscados em lotes de 200.
  useEffect(() => {
    if (!cardsRaw) return;
    if (cardsRaw.length === 0) { setQualidadeEnc({}); setProdutividadeEnc({}); setColaboradoresEnc({}); setNumColabObra(0); return; }
    let cancelado = false;
    const headers = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };
    const ids = cardsRaw.map(c => String(c.card_id));
    // `fetchPaginado` (Range/Content-Range), não `fetch` cru — o PostgREST
    // trunca em 1000 linhas por padrão INDEPENDENTE do `limit=` pedido na
    // query (mesmo bug já catalogado como "Cap de 1000 linhas Supabase" —
    // ver memória do projeto). Cada lote de 200 card_ids pode facilmente
    // ultrapassar 1000 linhas de `Apontamentos` (1 linha por card por dia,
    // meses de histórico), cortando silenciosamente os dias mais recentes
    // — foi exatamente isso que fez o "dia de referência" nunca aparecer
    // nos dados de qualidade, mesmo com a linha certa existindo no banco
    // (achado e corrigido primeiro no painel combinado, 2026-08-11, depois
    // replicado aqui no app principal, mesmo bug/mesma causa).
    const emLotes = async (tabela, select, campoId) => {
      const porId = {};
      for (let i = 0; i < ids.length; i += 200) {
        const chunk = ids.slice(i, i + 200).join(',');
        const rows = await fetchPaginado(`${SUPABASE_URL}/rest/v1/${tabela}?${campoId}=in.(${chunk})&select=${select}`, headers);
        (Array.isArray(rows) ? rows : []).forEach(row => { (porId[String(row[campoId])] = porId[String(row[campoId])] || []).push(row); });
      }
      return porId;
    };
    (async () => {
      const normQ = s => s.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
      const RANK_Q = ['bom', 'satisfatorio', 'corrigir'];
      const resumoQualidade = (lista) => {
        if (lista.some(s => normQ(s) === 'corrigir')) return 'Corrigir';
        const avaliados = lista.filter(s => !normQ(s).startsWith('pendente'));
        if (avaliados.length === 0) return 'Pendente Qualidade';
        const cont = {};
        avaliados.forEach(s => { const k = normQ(s); if (!cont[k]) cont[k] = { n: 0, label: s.trim() }; cont[k].n++; });
        const rank = k => { const idx = RANK_Q.indexOf(k); return idx === -1 ? 99 : idx; };
        return Object.entries(cont).sort((a, b) => b[1].n - a[1].n || rank(a[0]) - rank(b[0]))[0][1].label;
      };

      const apontPorCard = await emLotes('Apontamentos', 'id,status_qualidade,data_do_input', 'id');
      const statusPorCard = {};
      Object.keys(apontPorCard).forEach(k => {
        const rows = apontPorCard[k].filter(r => r.data_do_input);
        if (!rows.length) return;
        const dia = getDiaAderenciaComFallback(ymd => rows.some(r => (r.data_do_input || '').startsWith(ymd)));
        // `Apontamentos.id` não é único por dia — o mesmo card pode ter
        // mais de 1 linha no mesmo `data_do_input` (dado real: até 3
        // linhas no mesmo dia, misturando `status_qualidade` nulo e
        // preenchido). Pegar só a "primeira" linha que bate a data
        // descartava a real quando ela vinha depois de uma nula — corrigido
        // priorizando qualquer linha do dia que TENHA status preenchido.
        const rowsDoDia = rows.filter(r => (r.data_do_input || '').startsWith(dia));
        const rowDoDia = rowsDoDia.find(r => r.status_qualidade?.trim()) || rowsDoDia[0];
        if (rowDoDia?.status_qualidade?.trim()) statusPorCard[k] = rowDoDia.status_qualidade.trim();
      });
      const porEnc = {};
      cardsRaw.forEach(c => {
        const st = statusPorCard[String(c.card_id)] || 'Pendente Qualidade';
        const nome = c.responsavel_encarregado.trim().toUpperCase();
        (porEnc[nome] = porEnc[nome] || []).push(st);
      });
      const resumo = {};
      Object.entries(porEnc).forEach(([nome, lista]) => { resumo[nome] = resumoQualidade(lista); });
      if (!cancelado) setQualidadeEnc(resumo);

      const prodPorCard = await emLotes('v_indices_financeiros_diario', 'tarefa_id,data,indice_receita_custo_incorrido', 'tarefa_id');
      const produtividadePorCard = {};
      Object.keys(prodPorCard).forEach(k => {
        const comValor = prodPorCard[k].filter(r => r.indice_receita_custo_incorrido != null).sort((a, b) => (b.data || '').localeCompare(a.data || ''));
        if (comValor.length) produtividadePorCard[k] = comValor[0].indice_receita_custo_incorrido;
      });
      const porEncProd = {};
      cardsRaw.forEach(c => {
        const v = produtividadePorCard[String(c.card_id)];
        if (v == null) return;
        const nome = c.responsavel_encarregado.trim().toUpperCase();
        (porEncProd[nome] = porEncProd[nome] || []).push(v);
      });
      const resumoProd = {};
      Object.entries(porEncProd).forEach(([nome, lista]) => { resumoProd[nome] = lista.reduce((a, b) => a + b, 0) / lista.length; });
      if (!cancelado) setProdutividadeEnc(resumoProd);

      const efPorCard = await emLotes('apontamento_efetivo', 'tarefa_id,funcionario_nome,data_consulta', 'tarefa_id');
      const nomesPorCard = {};
      Object.keys(efPorCard).forEach(k => {
        const maisRecente = efPorCard[k].reduce((max, r) => (!max || r.data_consulta > max) ? r.data_consulta : max, null);
        nomesPorCard[k] = new Set(efPorCard[k].filter(r => r.data_consulta === maisRecente && r.funcionario_nome).map(r => r.funcionario_nome.trim().toUpperCase()));
      });
      const colabPorEnc = {};
      cardsRaw.forEach(c => {
        const nomes = nomesPorCard[String(c.card_id)];
        if (!nomes || !nomes.size) return;
        const nome = c.responsavel_encarregado.trim().toUpperCase();
        (colabPorEnc[nome] = colabPorEnc[nome] || new Set());
        nomes.forEach(n => colabPorEnc[nome].add(n));
      });
      const resumoColab = {};
      Object.entries(colabPorEnc).forEach(([nome, set]) => { resumoColab[nome] = set.size; });
      if (!cancelado) setColaboradoresEnc(resumoColab);
      if (!cancelado) setNumColabObra(new Set(Object.values(nomesPorCard).flatMap(s => [...s])).size);
    })().catch(() => {});
    return () => { cancelado = true; };
  }, [cardsRaw]);

  // Última liberação de PT por encarregado — só existe pra Novo Nordisk
  // (AP/UB), únicas obras com `origemPTS` mapeado.
  useEffect(() => {
    setPtsPorNomeDia({});
    if (!obraCfg?.origemPTS) return;
    const headers = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };
    fetchPaginado(`${SUPABASE_URL}/rest/v1/pts_emitidas?obra=eq.${encodeURIComponent(obraCfg.origemPTS)}&select=emitente,data_atividade,horario`, headers)
      .then(rows => {
        if (!rows) return;
        const HORARIO_MAX = '08:00';
        const mapa = {};
        rows.forEach(row => {
          if (!row.emitente || !row.data_atividade || !row.horario) return;
          const chave = `${normalizarNomeParaMatch(row.emitente)}__${row.data_atividade}`;
          const h = String(row.horario).slice(0, 5);
          const reg = mapa[chave] || (mapa[chave] = { ate: null, primeira: null });
          if (h <= HORARIO_MAX && (reg.ate === null || h > reg.ate)) reg.ate = h;
          if (reg.primeira === null || h < reg.primeira) reg.primeira = h;
        });
        const resolvido = {};
        Object.keys(mapa).forEach(k => { resolvido[k] = mapa[k].ate ?? mapa[k].primeira; });
        setPtsPorNomeDia(resolvido);
      })
      .catch(() => {});
  }, [obraId]);

  // Selo "Ausente" — mesma view do Histograma (efetivo_diario_raw, projeto
  // Efetivo), últimos 7 dias.
  useEffect(() => {
    setPresencaEnc({});
    const headers = { apikey: EFETIVO_SUPABASE_KEY, Authorization: `Bearer ${EFETIVO_SUPABASE_KEY}` };
    const hoje = new Date(); hoje.setHours(23, 59, 59, 999);
    const ontem = new Date(hoje); ontem.setDate(hoje.getDate() - 1);
    const seteDiasAtras = new Date(ontem); seteDiasAtras.setDate(ontem.getDate() - 6);
    const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    fetch(`${EFETIVO_SUPABASE_URL}/rest/v1/efetivo_diario_raw?obra_id=eq.${obraId}&data_efetivo_diario=gte.${ymd(seteDiasAtras)}&data_efetivo_diario=lte.${ymd(ontem)}&select=nome,data_efetivo_diario,situacao&limit=5000`, { headers })
      .then(r => r.ok ? r.json() : [])
      .then(rows => {
        const mapa = {};
        (Array.isArray(rows) ? rows : []).forEach(r => { if (r.nome) mapa[`${r.nome.trim().toUpperCase()}__${r.data_efetivo_diario}`] = r.situacao || ''; });
        setPresencaEnc(mapa);
      })
      .catch(() => setPresencaEnc({}));
  }, [obraId]);

  const statusPresenca = (nome, dia) => {
    if (!dia) return null;
    const situ = presencaEnc[`${(nome || '').trim().toUpperCase()}__${dia}`];
    return (situ && situ.trim().toLowerCase() === 'ausente') ? 'Ausente' : null;
  };
  const horarioPT = (nome, dia) => {
    if (!dia) return null;
    const h = ptsPorNomeDia[`${normalizarNomeParaMatch(nome)}__${dia}`];
    return h ? h.slice(0, 5) : null;
  };

  // Dia de referência POR ENCARREGADO (fim de semana só conta se ELE tiver
  // apontamento nele) + elegibilidade: só entra quem tem card ativo nesta
  // obra OU apontou no seu próprio dia de referência — mesma regra corrigida
  // no dashboard atual (ver [[cap-1000-linhas-supabase]]/RankingScreen).
  const { linhas, diaAderenciaObra } = useMemo(() => {
    if (tvRaw == null || cardsRaw == null) return { linhas: null, diaAderenciaObra: null };
    const cardsEncsUpper = new Set(cardsRaw.map(c => c.responsavel_encarregado.trim().toUpperCase()));
    const hoje = new Date(); hoje.setHours(23, 59, 59, 999);
    const ontem = new Date(hoje); ontem.setDate(hoje.getDate() - 1); ontem.setHours(23, 59, 59, 999);
    const seteDiasAtras = new Date(ontem); seteDiasAtras.setDate(ontem.getDate() - 6); seteDiasAtras.setHours(0, 0, 0, 0);

    const porEnc = {};
    tvRaw.forEach(row => {
      const resp = row['RESPONSÁVEL']; if (!resp) return;
      const dataYMD = parseBRDateParaYMD(row.DATA); if (!dataYMD) return;
      const dt = new Date(dataYMD + 'T12:00:00'); if (dt < seteDiasAtras || dt > ontem) return;
      if (!porEnc[resp]) porEnc[resp] = { nome: resp, diasApontados: new Set(), aderenciaPorDia: {} };
      porEnc[resp].diasApontados.add(dataYMD);
      const lin = parsePTNumero(row.ADERENCIA_LINEAR);
      if (lin > 0) {
        const pd = porEnc[resp].aderenciaPorDia[dataYMD] || (porEnc[resp].aderenciaPorDia[dataYMD] = { sum: 0, n: 0 });
        pd.sum += lin; pd.n++;
      }
    });

    // Assiduidade (toggle "ASSIDUIDADE", porta LoopEncSection do dashboard
    // atual) — % de dias com apontamento nos últimos 7 dias úteis. Só
    // informativa, não entra no score. Denominador = dias úteis da JANELA em
    // que a OBRA trabalhou (união de todos os encarregados), excluindo
    // feriado nacional em que a obra não trabalhou (mesma regra do original).
    const diasUteisObra = new Set();
    Object.values(porEnc).forEach(s => {
      s.diasApontados.forEach(ymd => {
        const dt = new Date(ymd + 'T12:00:00');
        if (dt.getDay() !== 0 && dt.getDay() !== 6) diasUteisObra.add(ymd);
      });
    });
    const yearsInWindow = new Set();
    for (let i = 0; i < 7; i++) {
      const d = new Date(seteDiasAtras); d.setDate(seteDiasAtras.getDate() + i);
      yearsInWindow.add(d.getFullYear());
    }
    const feriadosNacionais = new Set();
    yearsInWindow.forEach(y => getFeriadosNacionais(y).forEach(f => feriadosNacionais.add(f)));
    const diasBaseObra = new Set();
    for (let i = 0; i < 7; i++) {
      const d = new Date(seteDiasAtras); d.setDate(seteDiasAtras.getDate() + i);
      if (d > ontem) break;
      if (d.getDay() === 0 || d.getDay() === 6) continue;
      const ymd = d.toISOString().slice(0, 10);
      if (feriadosNacionais.has(ymd) && !diasUteisObra.has(ymd)) continue;
      diasBaseObra.add(ymd);
    }
    const totalDiasAssiduidade = Math.max(1, diasBaseObra.size);

    let arr = Object.values(porEnc).map(s => {
      const diaAderencia = getDiaAderenciaComFallback(ymd => !!s.aderenciaPorDia[ymd]);
      const d = s.aderenciaPorDia[diaAderencia];
      const aderenciaLin = d ? (d.sum / d.n) * 100 : null;
      const diasUteisEnc = Array.from(s.diasApontados).filter(ymd => diasBaseObra.has(ymd)).length;
      const assiduidade = (diasUteisEnc / totalDiasAssiduidade) * 100;
      return { nome: s.nome, diaAderencia, aderenciaLin, assiduidade, score: aderenciaLin ?? -1, semApontamentos: !s.diasApontados.has(diaAderencia) };
    }).filter(s => cardsEncsUpper.has(s.nome.trim().toUpperCase()) || !s.semApontamentos);

    const encNamesSet = new Set(arr.map(s => s.nome.trim().toUpperCase()));
    cardsRaw.forEach(c => {
      const nome = c.responsavel_encarregado.trim();
      if (encNamesSet.has(nome.toUpperCase())) return;
      encNamesSet.add(nome.toUpperCase());
      arr.push({ nome, diaAderencia: getDiaAderencia(), aderenciaLin: null, assiduidade: 0, score: -1, semApontamentos: true });
    });

    arr.forEach(s => { s.ausente = statusPresenca(s.nome, s.diaAderencia) === 'Ausente'; });
    arr.sort((a, b) =>
      (a.ausente ? 1 : 0) - (b.ausente ? 1 : 0) ||
      (a.semApontamentos ? 1 : 0) - (b.semApontamentos ? 1 : 0) ||
      b.score - a.score);

    const diaAderenciaObra = getDiaAderenciaComFallback(ymd => tvRaw.some(r => parseBRDateParaYMD(r.DATA) === ymd));
    return { linhas: arr, diaAderenciaObra };
  }, [tvRaw, cardsRaw, presencaEnc]);

  const [ordenarEnc, setOrdenarEnc] = useState('aderencia');
  const [ordenarDirEnc, setOrdenarDirEnc] = useState('desc');
  const alternarOrdenacaoEnc = (campo) => {
    if (!campo) return;
    if (ordenarEnc === campo) setOrdenarDirEnc(d => d === 'asc' ? 'desc' : 'asc');
    else { setOrdenarEnc(campo); setOrdenarDirEnc(campo === 'nome' ? 'asc' : 'desc'); }
  };
  const rankQualidade = (nome) => {
    const q = qualidadeEnc[(nome || '').trim().toUpperCase()];
    if (!q) return -1;
    const n = q.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    if (n.startsWith('pendente')) return 0;
    if (n === 'bom') return 3;
    if (n === 'satisfatorio') return 2;
    return 1;
  };
  const temPT = !!obraCfg?.origemPTS && Object.keys(ptsPorNomeDia).length > 0;
  const rankingRows = useMemo(() => {
    if (!linhas) return [];
    const arr = [...linhas];
    const dir = ordenarDirEnc === 'asc' ? 1 : -1;
    const up = n => (n || '').trim().toUpperCase();
    const valor = (r) => {
      switch (ordenarEnc) {
        case 'qualidade': return rankQualidade(r.nome);
        case 'assiduidade': return r.assiduidade ?? -1;
        case 'colaboradores': return colaboradoresEnc[up(r.nome)] ?? -1;
        case 'produtividade': return produtividadeEnc[up(r.nome)] ?? -1;
        case 'pt': {
          const hpt = horarioPT(r.nome, r.diaAderencia);
          if (!hpt) return -1;
          const [hh, mm] = hpt.split(':').map(Number);
          return hh * 60 + mm;
        }
        default: return r.score ?? -1;
      }
    };
    arr.sort((a, b) =>
      (a.ausente ? 1 : 0) - (b.ausente ? 1 : 0) ||
      (a.semApontamentos ? 1 : 0) - (b.semApontamentos ? 1 : 0) ||
      (ordenarEnc === 'nome'
        ? a.nome.localeCompare(b.nome, 'pt', { sensitivity: 'base' }) * dir
        : (valor(a) - valor(b)) * dir));
    return arr;
  }, [linhas, ordenarEnc, ordenarDirEnc, colaboradoresEnc, produtividadeEnc, qualidadeEnc, ptsPorNomeDia]);

  // Exportar PNG do ranking — portado do dashboard-main (`exportarPNG` da
  // seção de Performance de Encarregados), pedido explícito: "trazer o
  // mecanismo de gerar png, do dash-main, para a tela dos encarregados
  // deste dash". Desenho em `<canvas>` (não é print de tela) pra sair
  // sempre nítido e com layout fixo, independente do zoom/resolução de
  // quem exportou. Cores/limiares batem com os badges já usados na TELA
  // (mesmos T.green/amber/red/blue), não com a paleta original do
  // dashboard-main (levemente diferente) — consistência com o resto do
  // painel-mse, não com a origem do código.
  const exportarPNG = async () => {
    const diaYMD = diaAderenciaObra;
    if (!diaYMD || !rankingRows.length) return;
    const [yy, mm, dd] = diaYMD.split('-');
    const dataLabel = `${dd}/${mm}/${yy}`;
    const rows = rankingRows; // segue a ordenação atual da tela
    try { await document.fonts.ready; } catch (_) {}

    const W = 1150, headerH = 144, rowH = 52, padB = 24;
    const GAP = 14;
    const H = headerH + rows.length * rowH + padB;
    const scale = 2; // 2x para nitidez
    const cv = document.createElement('canvas');
    cv.width = W * scale; cv.height = H * scale;
    const ctx = cv.getContext('2d');
    ctx.scale(scale, scale);

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);

    ctx.font = '600 10px "IBM Plex Sans", Arial';
    const wLabelColab = ctx.measureText('COLABORADORES').width;
    const wLabelQual  = ctx.measureText('STATUS QUALIDADE').width;
    const wLabelProd  = Math.max(ctx.measureText('ÍNDICE DE').width, ctx.measureText('PRODUTIVIDADE').width);
    const wLabelAder  = Math.max(ctx.measureText('ADERÊNCIA AO').width, ctx.measureText('AVANÇO PLANEJADO').width);
    ctx.font = '700 18px "IBM Plex Sans", Arial';
    const wBadgeAder = ctx.measureText('100.0%').width + 28;
    ctx.font = '700 15px "IBM Plex Sans", Arial';
    const wBadgeProd = ctx.measureText('000.00').width + 24;
    ctx.font = '600 12px "IBM Plex Sans", Arial';
    const wBadgeQual = ctx.measureText('PENDENTE QUALIDADE').width + 22;
    ctx.font = '700 16px "IBM Plex Sans", Arial';
    const wValColab = ctx.measureText('000').width;
    ctx.font = '600 10px "IBM Plex Sans", Arial';
    const wLabelPT = Math.max(ctx.measureText('ÚLTIMA').width, ctx.measureText('LIBERAÇÃO DE PT').width);
    ctx.font = '700 16px "IBM Plex Sans", Arial';
    const wBadgePT = ctx.measureText('00:00').width + 24;

    const ADER_W = Math.max(wLabelAder, wBadgeAder);
    const PROD_W = Math.max(wLabelProd, wBadgeProd);
    const QUAL_W = Math.max(wLabelQual, wBadgeQual);
    const COLAB_W = Math.max(wLabelColab, wValColab);
    const PT_W = Math.max(wLabelPT, wBadgePT);

    const PT_X = temPT ? W - 32 : null;
    const ADER_X = temPT ? PT_X - PT_W - GAP : W - 32;
    const PROD_X = ADER_X - ADER_W - GAP;
    const COLAB_X = PROD_X - PROD_W - GAP;
    const QUAL_X = COLAB_X - COLAB_W - GAP;
    const NOME_MAXW = QUAL_X - QUAL_W - GAP - 84;

    ctx.fillStyle = T.mut;
    ctx.font = '700 11px "IBM Plex Sans", Arial';
    ctx.fillText('MSE ENGENHARIA · PERFORMANCE DE ENCARREGADOS', 32, 32);
    ctx.fillStyle = T.ink;
    const tituloObra = (obraNome || '').toUpperCase();
    let tituloSize = 26;
    ctx.font = `700 ${tituloSize}px "IBM Plex Sans", Arial`;
    while (tituloSize > 15 && ctx.measureText(tituloObra).width > W - 64) {
      tituloSize -= 1;
      ctx.font = `700 ${tituloSize}px "IBM Plex Sans", Arial`;
    }
    ctx.fillText(tituloObra, 32, 62);

    const LABELS_ORD = { aderencia:'Aderência ao avanço planejado', nome:'Encarregado', qualidade:'Qualidade', colaboradores:'Colaboradores', produtividade:'Índice de produtividade', pt:'Última liberação de PT' };
    const setaOrd = ordenarDirEnc === 'asc' ? '▲' : '▼';
    ctx.textAlign = 'left';
    ctx.fillStyle = T.mut;
    ctx.font = '600 14px IBM Plex Sans, Arial';
    const preOrd = `Dia de referência: ${dataLabel}    ·    Ordenado por: `;
    ctx.fillText(preOrd, 32, 84);
    const preOrdW = ctx.measureText(preOrd).width;
    ctx.fillStyle = T.green;
    ctx.font = '700 14px IBM Plex Sans, Arial';
    ctx.fillText(`${LABELS_ORD[ordenarEnc] || LABELS_ORD.aderencia} ${setaOrd}`, 32 + preOrdW, 84);

    const legendItems = [
      { color: T.green, label: '≥ 1,00 favorável' },
      { color: T.red, label: '< 1,00 desfavorável' },
    ];
    ctx.font = '600 10px "IBM Plex Sans", Arial';
    const legendGap = 16;
    const legendItemWidths = legendItems.map(it => 13 + ctx.measureText(it.label).width);
    const legendContentW = legendItemWidths.reduce((a, b) => a + b, 0) + legendGap * (legendItems.length - 1);
    const chipPadX = 10, chipTop = 74, chipH = 22, chipBottom = chipTop + chipH;
    const colCenterX = PROD_X - PROD_W / 2;
    const chipW = legendContentW + chipPadX * 2;
    const chipLeft = colCenterX - chipW / 2, chipRight = colCenterX + chipW / 2;
    ctx.fillStyle = 'rgba(15,23,42,0.035)';
    ctx.strokeStyle = 'rgba(15,23,42,0.09)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(chipLeft, chipTop, chipRight - chipLeft, chipH, 11); else ctx.rect(chipLeft, chipTop, chipRight - chipLeft, chipH);
    ctx.fill();
    ctx.stroke();
    let legendX = chipLeft + chipPadX;
    const legendCy = chipTop + chipH / 2;
    ctx.textAlign = 'left';
    legendItems.forEach((it, idx) => {
      ctx.fillStyle = it.color;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(legendX, legendCy - 4, 8, 8, 2); else ctx.rect(legendX, legendCy - 4, 8, 8);
      ctx.fill();
      ctx.fillStyle = T.body;
      ctx.fillText(it.label, legendX + 12, legendCy + 3.5);
      legendX += legendItemWidths[idx] + legendGap;
    });
    const setaX = colCenterX;
    ctx.strokeStyle = '#c7ccd4';
    ctx.lineWidth = 1.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(setaX, chipBottom + 12);
    ctx.lineTo(setaX, 111);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(setaX - 3, 107.5);
    ctx.lineTo(setaX, 112);
    ctx.lineTo(setaX + 3, 107.5);
    ctx.stroke();
    ctx.lineCap = 'butt';

    ctx.font = '600 10px "IBM Plex Sans", Arial';
    ctx.fillStyle = T.mut;
    ctx.textAlign = 'left';
    ctx.fillText('ENCARREGADO', 84, 134);
    ctx.textAlign = 'right';
    ctx.fillText('QUALIDADE', QUAL_X, 134);
    ctx.fillText('COLABORADORES', COLAB_X, 134);
    ctx.fillText('ÍNDICE DE', PROD_X, 127);
    ctx.fillText('PRODUTIVIDADE', PROD_X, 139);
    ctx.fillText('ADERÊNCIA AO', ADER_X, 127);
    ctx.fillText('AVANÇO PLANEJADO', ADER_X, 139);
    if (temPT) {
      ctx.fillText('ÚLTIMA', PT_X, 127);
      ctx.fillText('LIBERAÇÃO DE PT', PT_X, 139);
    }
    ctx.textAlign = 'left';

    ctx.textBaseline = 'middle';
    rows.forEach((r, i) => {
      const y = headerH + i * rowH;
      if (i % 2 === 0) { ctx.fillStyle = 'rgba(15,23,42,0.03)'; ctx.fillRect(16, y, W - 32, rowH); }
      ctx.strokeStyle = 'rgba(15,23,42,0.07)';
      ctx.beginPath(); ctx.moveTo(16, y); ctx.lineTo(W - 16, y); ctx.stroke();

      const cy = y + rowH / 2;
      const destaque = i === 0 && !r.ausente && !r.semApontamentos;
      const dimRow = !!r.semApontamentos && !r.ausente;
      ctx.globalAlpha = dimRow ? 0.55 : 1;
      ctx.textAlign = 'left';
      ctx.fillStyle = destaque ? T.amber : T.mut2;
      ctx.font = '700 18px "IBM Plex Sans", Arial';
      ctx.fillText(r.ausente || r.semApontamentos ? '—' : `#${i + 1}`, 32, cy);
      ctx.fillStyle = destaque ? T.amber : T.ink;
      ctx.font = '600 16px IBM Plex Sans, Arial';
      ctx.fillText(r.nome.toUpperCase(), 84, cy, NOME_MAXW);

      const nomeUpper = (r.nome || '').trim().toUpperCase();

      if (r.ausente) {
        ctx.globalAlpha = 1;
        ctx.font = '800 15px "IBM Plex Sans", Arial';
        const aTxt = 'AUSENTE';
        const atw = ctx.measureText(aTxt).width;
        const abw = atw + 28, abh = 30, abx = ADER_X - abw, aby = cy - abh / 2;
        ctx.fillStyle = T.red;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(abx, aby, abw, abh, 9); else ctx.rect(abx, aby, abw, abh);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.fillText(aTxt, abx + abw / 2, cy + 1);
        ctx.textAlign = 'left';
        return;
      }

      const nColab = colaboradoresEnc[nomeUpper];
      ctx.textAlign = 'right';
      ctx.font = '700 16px "IBM Plex Sans", Arial';
      ctx.fillStyle = nColab != null ? T.ink : T.mut;
      ctx.fillText(nColab != null ? String(nColab) : '—', COLAB_X, cy + 1);
      ctx.textAlign = 'left';

      const temAder = r.aderenciaLin != null;
      const txt = temAder ? r.aderenciaLin.toFixed(1) + '%' : 'ALOCADO';
      const cor = !temAder ? T.mut2 : r.aderenciaLin >= 100 ? T.green : r.aderenciaLin >= 80 ? T.blue : T.red;
      const corBg = !temAder ? '#eef0f3' : r.aderenciaLin >= 100 ? 'rgba(31,157,87,0.12)' : r.aderenciaLin >= 80 ? 'rgba(37,99,235,0.10)' : 'rgba(210,59,59,0.10)';
      ctx.font = temAder ? '700 18px "IBM Plex Sans", Arial' : '800 12px "IBM Plex Sans", Arial';
      const tw = ctx.measureText(txt).width;
      const bw = tw + 28, bh = 30, bx = ADER_X - bw, by = cy - bh / 2;
      ctx.fillStyle = corBg;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 8); else ctx.rect(bx, by, bw, bh);
      ctx.fill();
      ctx.fillStyle = cor;
      ctx.textAlign = 'center';
      ctx.fillText(txt, bx + bw / 2, cy + 1);

      const prod = produtividadeEnc[nomeUpper];
      {
        const temProd = prod != null;
        const pTxt = temProd ? prod.toFixed(2) : '—';
        const pCor = !temProd ? T.mut : prod >= 1 ? T.green : T.red;
        const pBg  = !temProd ? '#eef0f3' : prod >= 1 ? 'rgba(31,157,87,0.12)' : 'rgba(210,59,59,0.10)';
        ctx.font = '700 15px "IBM Plex Sans", Arial';
        const ptw = ctx.measureText(pTxt).width;
        const pbw = ptw + 24, pbh = 27, pbx = PROD_X - pbw, pby = cy - pbh / 2;
        ctx.fillStyle = pBg;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(pbx, pby, pbw, pbh, 7); else ctx.rect(pbx, pby, pbw, pbh);
        ctx.fill();
        ctx.fillStyle = pCor;
        ctx.fillText(pTxt, pbx + pbw / 2, cy + 1);
      }

      const q = qualidadeEnc[nomeUpper];
      if (q) {
        const nq = q.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
        const qCor = nq.startsWith('pendente') ? T.mut : nq === 'bom' ? T.green : nq === 'satisfatorio' ? T.amber : T.red;
        const qBg  = nq.startsWith('pendente') ? '#eef0f3' : nq === 'bom' ? 'rgba(31,157,87,0.12)' : nq === 'satisfatorio' ? 'rgba(217,145,26,0.12)' : 'rgba(210,59,59,0.10)';
        ctx.font = '600 12px "IBM Plex Sans", Arial';
        const qTxt = q.toUpperCase();
        const qtw = ctx.measureText(qTxt).width;
        const qbw = qtw + 22, qbh = 24, qbx = QUAL_X - qbw, qby = cy - qbh / 2;
        ctx.fillStyle = qBg;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(qbx, qby, qbw, qbh, 7); else ctx.rect(qbx, qby, qbw, qbh);
        ctx.fill();
        ctx.fillStyle = qCor;
        ctx.fillText(qTxt, qbx + qbw / 2, cy + 1);
      }

      if (temPT) {
        const h = horarioPT(r.nome, r.diaAderencia);
        const ptTxt = h || '—';
        const ptCor = !h ? T.mut : h <= '07:00' ? T.green : h <= '07:15' ? T.amber : T.red;
        const ptBg  = !h ? '#eef0f3' : h <= '07:00' ? 'rgba(31,157,87,0.13)' : h <= '07:15' ? 'rgba(217,145,26,0.13)' : 'rgba(210,59,59,0.13)';
        ctx.font = '700 16px "IBM Plex Sans", Arial';
        const pttw = ctx.measureText(ptTxt).width;
        const ptbw = pttw + 24, ptbh = 28, ptbx = PT_X - ptbw, ptby = cy - ptbh / 2;
        ctx.fillStyle = ptBg;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(ptbx, ptby, ptbw, ptbh, 8); else ctx.rect(ptbx, ptby, ptbw, ptbh);
        ctx.fill();
        ctx.fillStyle = ptCor;
        ctx.textAlign = 'center';
        ctx.fillText(ptTxt, ptbx + ptbw / 2, cy + 1);
        ctx.textAlign = 'left';
      }
      ctx.globalAlpha = 1;
    });

    const nomeArq = (obraNome || 'obra').replace(/[^A-Za-z0-9]+/g, '_');
    const a = document.createElement('a');
    a.download = `aderencia_${nomeArq}_${diaYMD}.png`;
    a.href = cv.toDataURL('image/png');
    a.click();
  };

  const carregando = tvRaw === null || cardsRaw === null;
  const erro = tvErro || cardsErro;
  if (carregando) return <CartaoEstado texto="Carregando encarregados…" maxHeight={620} />;
  if (erro) return <CartaoEstado texto="Erro ao carregar vw_dados_tv / cards_ativos" maxHeight={620} tom={T.red} />;

  const aderenciaGlobal = linhas.length ? linhas.reduce((s, r) => s + (r.aderenciaLin ?? 0), 0) / linhas.length : 0;
  const assiduidadeGlobal = linhas.length ? linhas.reduce((s, r) => s + (r.assiduidade ?? 0), 0) / linhas.length : 0;
  const colsEncarregados = [
    { label:'Pos', campo:null, align:'left' },
    { label:'Encarregado', campo:'nome', align:'left' },
    { label:'Qualidade', campo:'qualidade', align:'right' },
    ...(showAssiduidade ? [{ label:'Assiduidade', campo:'assiduidade', align:'right' }] : []),
    { label:'Colaboradores', campo:'colaboradores', align:'right' },
    { label:'Produtividade', campo:'produtividade', align:'right' },
    { label:'Aderência', campo:'aderencia', align:'right' },
    ...(temPT ? [{ label:'Últ. Liberação PT', campo:'pt', align:'right' }] : []),
  ];

  return (
    <div className="painel-gutter" style={{ flex:1, minHeight:0, display:'flex', flexDirection:'column', gap:14 }}>
      <div style={{ display:'flex', alignItems:'center', gap:10, padding:'8px 14px', background:'rgba(217,145,26,0.08)', border:'1px solid rgba(217,145,26,0.18)', borderRadius:12, flexShrink:0 }}>
        <svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke={T.amber} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4Z" /><path d="M17 5h3a2 2 0 0 1-2 4M7 5H4a2 2 0 0 0 2 4" />
        </svg>
        <span className="mono" style={{ fontSize:12, fontWeight:700, letterSpacing:'0.12em', color:T.body, textTransform:'uppercase' }}>Performance de Encarregados</span>
        <span className="mono" style={{ marginLeft:'auto', fontSize:11, color:T.mut }}>Referência: {fmtDataCurta(parseDataCorte(diaAderenciaObra)) || '—'}</span>
        <button onClick={exportarPNG} disabled={!rankingRows.length} title="Baixar PNG do ranking de aderência"
          className="mono" style={{ background:'#eef3fe', border:'1px solid #d8e3fb', color:T.blue, padding:'6px 11px', borderRadius:8, cursor: rankingRows.length ? 'pointer' : 'default', opacity: rankingRows.length ? 1 : 0.5, fontSize:10.5, fontWeight:600, letterSpacing:'0.06em', textTransform:'uppercase' }}>
          Baixar PNG ↓
        </button>
        <button onClick={() => setShowAssiduidade(v => !v)} title="Exibir/ocultar assiduidade dos cards (dias com apontamento nos últimos 7 dias úteis — só informativa, não entra no score)"
          className="mono" style={{ background: showAssiduidade ? 'rgba(31,157,87,0.15)' : '#eef0f3', border:'none', color: showAssiduidade ? T.green : T.mut, padding:'6px 12px', borderRadius:8, cursor:'pointer', fontSize:10.5, fontWeight:700, letterSpacing:'0.06em', textTransform:'uppercase' }}>
          Assiduidade
        </button>
      </div>

      <div className={`kpi-row ${showAssiduidade ? 'cols-3' : 'cols-2'}`}>
        <Balao titulo="Aderência Média" cor={T.blue} bg="rgba(37,99,235,0.08)" borda="rgba(37,99,235,0.15)" valor={`${aderenciaGlobal.toFixed(1)}%`} />
        <Balao titulo="Colaboradores Alocados" cor={T.green} bg="rgba(31,157,87,0.08)" borda="rgba(31,157,87,0.15)" valor={numColabObra ?? '—'} />
        {showAssiduidade && <Balao titulo="Assiduidade Média" cor={T.green} bg="rgba(31,157,87,0.08)" borda="rgba(31,157,87,0.15)" valor={`${assiduidadeGlobal.toFixed(1)}%`} />}
      </div>

      <div className="card" style={{ flex:1, minHeight:0, borderRadius:14, overflow:'hidden', display:'flex', flexDirection:'column', padding:0 }}>
        <div className="table-scroll-x" style={{ overflow:'auto', flex:1 }}>
          <table style={{ width:'100%', textAlign:'left', borderCollapse:'collapse' }}>
            <thead style={{ position:'sticky', top:0, zIndex:2, background:'#fff' }}>
              <tr className="mono" style={{ fontSize:10, textTransform:'uppercase', letterSpacing:'0.1em', color:T.mut, fontWeight:600 }}>
                {colsEncarregados.map(col => {
                  const ativo = col.campo && ordenarEnc === col.campo;
                  return (
                    <th key={col.label} onClick={() => alternarOrdenacaoEnc(col.campo)}
                      title={col.campo ? 'Ordenar por esta coluna' : undefined}
                      style={{ padding:'10px 14px', textAlign:col.align, cursor: col.campo ? 'pointer' : 'default', userSelect:'none', color: ativo ? T.green : undefined, borderBottom:'1px solid var(--line)' }}>
                      {col.label}{ativo ? (ordenarDirEnc === 'asc' ? ' ▲' : ' ▼') : ''}
                    </th>
                  );
                })}
              </tr>
            </thead>
            <tbody>
              {rankingRows.map((row, idx) => (
                <LinhaEncarregado key={row.nome} row={row} idx={idx} temPT={temPT} showAssiduidade={showAssiduidade}
                  qualidadeEnc={qualidadeEnc} produtividadeEnc={produtividadeEnc} colaboradoresEnc={colaboradoresEnc}
                  horarioPT={horarioPT} onClickNome={setNomeSelecionado} />
              ))}
              {rankingRows.length === 0 && (
                <tr><td colSpan={5 + (showAssiduidade ? 1 : 0) + (temPT ? 1 : 0)} style={{ padding:24, textAlign:'center', fontSize:12, color:T.mut }}>Nenhum encarregado elegível encontrado para esta obra</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>

      {nomeSelecionado && (
        <PopupCardsEncarregado nome={nomeSelecionado} obraId={obraId} obraNome={obraNome}
          onClose={() => setNomeSelecionado(null)} />
      )}
    </div>
  );
}

// ── Setor 3 — Histograma, módulo de Efetivo portado do dashboard atual
//    (EfetivoSection): granularidade Dia/Semana/Mês, filtro MOI/MOD, filtro
//    de período, esconder Real/Previsto, exportar PNG, clique na barra abre
//    o detalhamento (pessoas ou funções). Mais o quadro-resumo (Efetivo
//    Total/％MOI/％MOD), pedido junto (2026-08-05), sempre com o dado mais
//    recente, independente do filtro de granularidade escolhido no gráfico
//    abaixo. Até 2026-08-05 vivia como 2ª página do setor "Curva S +
//    Histograma" (scroll/dropdown); virou aba própria a pedido do usuário —
//    ver [[08 - Blueprint do Painel de Obra]]. ─────────────────────────────
const GRAN_EFETIVO = [
  { key: 'dia',    label: 'Dia',    view: 'diario'  },
  { key: 'semana', label: 'Semana', view: 'semanal' },
  { key: 'mes',    label: 'Mês',    view: 'mensal'  },
];

function ModuloEfetivo({ obraId, obraNome }){
  const [granularidade, setGranularidade] = useState('mes');
  const [moiModFiltro, setMoiModFiltro] = useState('TOTAL');
  const [filtroDataDe, setFiltroDataDe] = useState('');
  const [filtroDataAte, setFiltroDataAte] = useState('');
  const [ocultarReal, setOcultarReal] = useState(false);
  const [ocultarPrevisto, setOcultarPrevisto] = useState(false);
  const [dados, setDados] = useState([]);
  const [loading, setLoading] = useState(true);
  const [popup, setPopup] = useState(null);
  const [detalhe, setDetalhe] = useState([]);
  const [detalheLoading, setDetalheLoading] = useState(false);
  const [buscaDetalhe, setBuscaDetalhe] = useState('');
  const [ordenarCampo, setOrdenarCampo] = useState('nome');
  const [ordenarDir, setOrdenarDir] = useState('asc');
  const [previstoMensal, setPrevistoMensal] = useState([]);
  const [previstoSemanal, setPrevistoSemanal] = useState([]);
  const [previstoDetalhe, setPrevistoDetalhe] = useState([]);
  const [previstoDetalheLoading, setPrevistoDetalheLoading] = useState(false);
  const [buscaPrevisto, setBuscaPrevisto] = useState('');
  const [ordenarCampoPrevisto, setOrdenarCampoPrevisto] = useState('nome_funcao');
  const [ordenarDirPrevisto, setOrdenarDirPrevisto] = useState('asc');
  const [realHistorico, setRealHistorico] = useState([]);
  const [semHistoricoAviso, setSemHistoricoAviso] = useState(null);
  const [resumo, setResumo] = useState(null);       // null = carregando
  const [resumoErro, setResumoErro] = useState(false);
  const [resumoPopupAberto, setResumoPopupAberto] = useState(false);
  const [resumoDetalhe, setResumoDetalhe] = useState([]);
  const [resumoDetalheLoading, setResumoDetalheLoading] = useState(false);
  const [buscaResumo, setBuscaResumo] = useState('');
  const [ordenarCampoResumo, setOrdenarCampoResumo] = useState('nome');
  const [ordenarDirResumo, setOrdenarDirResumo] = useState('asc');

  const gran = GRAN_EFETIVO.find(g => g.key === granularidade);

  const alternarOrdenacao = (campo) => {
    if (ordenarCampo === campo) { setOrdenarDir(d => d === 'asc' ? 'desc' : 'asc'); }
    else { setOrdenarCampo(campo); setOrdenarDir(campo === 'dias_presentes' ? 'desc' : 'asc'); }
  };
  const alternarOrdenacaoPrevisto = (campo) => {
    if (ordenarCampoPrevisto === campo) { setOrdenarDirPrevisto(d => d === 'asc' ? 'desc' : 'asc'); }
    else { setOrdenarCampoPrevisto(campo); setOrdenarDirPrevisto(campo === 'qtd' ? 'desc' : 'asc'); }
  };

  const mesDoPeriodo = (periodo) => periodo.slice(0, 7) + '-01';
  const semanaDoPeriodo = (periodo) => {
    const d = new Date(periodo + 'T00:00:00');
    const dow = d.getDay();
    d.setDate(d.getDate() + (dow === 0 ? -6 : 1 - dow));
    return d.toISOString().slice(0, 10);
  };

  const previstoPorMes = useMemo(() => {
    const mapa = new Map();
    previstoMensal.forEach(p => mapa.set(p.periodo, p.qtd));
    return mapa;
  }, [previstoMensal]);
  const previstoPorSemana = useMemo(() => {
    const mapa = new Map();
    previstoSemanal.forEach(p => mapa.set(p.periodo, p.qtd));
    return mapa;
  }, [previstoSemanal]);
  const realHistoricoPorMes = useMemo(() => {
    const mapa = new Map();
    realHistorico.filter(r => (r.granularidade || 'mes') === 'mes').forEach(r => mapa.set(r.mes, (mapa.get(r.mes) || 0) + r.qtd));
    return mapa;
  }, [realHistorico]);
  const realHistoricoPorSemana = useMemo(() => {
    const mapa = new Map();
    realHistorico.filter(r => r.granularidade === 'semana').forEach(r => mapa.set(r.mes, (mapa.get(r.mes) || 0) + r.qtd));
    return mapa;
  }, [realHistorico]);
  const realHistoricoPorMesViaSemana = useMemo(() => {
    const mapa = new Map();
    realHistoricoPorSemana.forEach((qtd, periodo) => {
      const mes = mesDoPeriodo(periodo);
      mapa.set(mes, Math.max(mapa.has(mes) ? mapa.get(mes) : -Infinity, qtd));
    });
    return mapa;
  }, [realHistoricoPorSemana]);

  const avisarSemHistorico = (periodo) => {
    setSemHistoricoAviso(periodo);
    setTimeout(() => setSemHistoricoAviso(atual => atual === periodo ? null : atual), 1600);
  };

  const detalheVisivel = useMemo(() => {
    const termo = buscaDetalhe.trim().toLowerCase();
    let lista = detalhe;
    if (termo) {
      lista = lista.filter(r =>
        (r.nome || '').toLowerCase().includes(termo) ||
        (r.nome_funcao || '').toLowerCase().includes(termo) ||
        (r.razao_social || '').toLowerCase().includes(termo) ||
        (r.moi_mod || '').toLowerCase().includes(termo)
      );
    }
    const dir = ordenarDir === 'asc' ? 1 : -1;
    return [...lista].sort((a, b) => {
      const va = a[ordenarCampo], vb = b[ordenarCampo];
      if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * dir;
      return String(va || '').localeCompare(String(vb || ''), 'pt-BR') * dir;
    });
  }, [detalhe, buscaDetalhe, ordenarCampo, ordenarDir]);

  const previstoDetalheVisivel = useMemo(() => {
    const termo = buscaPrevisto.trim().toLowerCase();
    let lista = previstoDetalhe;
    if (termo) {
      lista = lista.filter(r =>
        (r.nome_funcao || '').toLowerCase().includes(termo) ||
        (r.moi_mod || '').toLowerCase().includes(termo)
      );
    }
    const dir = ordenarDirPrevisto === 'asc' ? 1 : -1;
    return [...lista].sort((a, b) => {
      const va = a[ordenarCampoPrevisto], vb = b[ordenarCampoPrevisto];
      if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * dir;
      return String(va || '').localeCompare(String(vb || ''), 'pt-BR') * dir;
    });
  }, [previstoDetalhe, buscaPrevisto, ordenarCampoPrevisto, ordenarDirPrevisto]);

  useEffect(() => {
    if (!obraId) return;
    setLoading(true);
    const headers = { apikey: EFETIVO_SUPABASE_KEY, Authorization: `Bearer ${EFETIVO_SUPABASE_KEY}` };
    const view = moiModFiltro === 'TOTAL' ? `vw_efetivo_${gran.view}_total` : `vw_efetivo_${gran.view}_moimod_total`;
    const filtroMoi = moiModFiltro === 'TOTAL' ? '' : `&moi_mod=eq.${moiModFiltro}`;
    fetch(`${EFETIVO_SUPABASE_URL}/rest/v1/${view}?obra_id=eq.${obraId}${filtroMoi}&select=periodo,qtd&order=periodo.asc&limit=1000`, { headers })
      .then(r => r.ok ? r.json() : [])
      .then(rows => { setDados(Array.isArray(rows) ? rows : []); setLoading(false); })
      .catch(() => { setDados([]); setLoading(false); });
  }, [obraId, granularidade, moiModFiltro]);

  useEffect(() => {
    if (!obraId) return;
    const headers = { apikey: EFETIVO_SUPABASE_KEY, Authorization: `Bearer ${EFETIVO_SUPABASE_KEY}` };
    const view = moiModFiltro === 'TOTAL' ? 'vw_efetivo_previsto_mensal_total' : 'vw_efetivo_previsto_mensal_moimod_total';
    const filtroMoi = moiModFiltro === 'TOTAL' ? '' : `&moi_mod=eq.${moiModFiltro}`;
    fetch(`${EFETIVO_SUPABASE_URL}/rest/v1/${view}?obra_id=eq.${obraId}${filtroMoi}&select=periodo,qtd&order=periodo.asc&limit=1000`, { headers })
      .then(r => r.ok ? r.json() : [])
      .then(rows => setPrevistoMensal(Array.isArray(rows) ? rows : []))
      .catch(() => setPrevistoMensal([]));
  }, [obraId, moiModFiltro]);

  useEffect(() => {
    if (!obraId) return;
    const headers = { apikey: EFETIVO_SUPABASE_KEY, Authorization: `Bearer ${EFETIVO_SUPABASE_KEY}` };
    const view = moiModFiltro === 'TOTAL' ? 'vw_efetivo_previsto_semanal_total' : 'vw_efetivo_previsto_semanal_moimod_total';
    const filtroMoi = moiModFiltro === 'TOTAL' ? '' : `&moi_mod=eq.${moiModFiltro}`;
    fetch(`${EFETIVO_SUPABASE_URL}/rest/v1/${view}?obra_id=eq.${obraId}${filtroMoi}&select=periodo,qtd&order=periodo.asc&limit=2000`, { headers })
      .then(r => r.ok ? r.json() : [])
      .then(rows => setPrevistoSemanal(Array.isArray(rows) ? rows : []))
      .catch(() => setPrevistoSemanal([]));
  }, [obraId, moiModFiltro]);

  useEffect(() => {
    if (!obraId) { setRealHistorico([]); return; }
    const headers = { apikey: EFETIVO_SUPABASE_KEY, Authorization: `Bearer ${EFETIVO_SUPABASE_KEY}` };
    const filtroMoi = moiModFiltro === 'TOTAL' ? '' : `&moi_mod=eq.${moiModFiltro}`;
    fetch(`${EFETIVO_SUPABASE_URL}/rest/v1/efetivo_real_historico?obra_id=eq.${obraId}${filtroMoi}&select=mes,qtd,granularidade&order=mes.asc&limit=1000`, { headers })
      .then(r => r.ok ? r.json() : [])
      .then(rows => setRealHistorico(Array.isArray(rows) ? rows : []))
      .catch(() => setRealHistorico([]));
  }, [obraId, moiModFiltro]);

  useEffect(() => {
    if (!popup || popup.tipo !== 'real' || !obraId) return;
    setDetalheLoading(true);
    setBuscaDetalhe('');
    setOrdenarCampo('nome');
    setOrdenarDir('asc');
    const headers = { apikey: EFETIVO_SUPABASE_KEY, Authorization: `Bearer ${EFETIVO_SUPABASE_KEY}` };
    const filtroMoi = moiModFiltro === 'TOTAL' ? '' : `&moi_mod=eq.${moiModFiltro}`;
    fetch(`${EFETIVO_SUPABASE_URL}/rest/v1/vw_efetivo_${gran.view}_pessoas?obra_id=eq.${obraId}&periodo=eq.${popup.periodo}${filtroMoi}&select=*&order=nome.asc&limit=1000`, { headers })
      .then(r => r.ok ? r.json() : [])
      .then(rows => { setDetalhe(Array.isArray(rows) ? rows : []); setDetalheLoading(false); })
      .catch(() => { setDetalhe([]); setDetalheLoading(false); });
  }, [popup, granularidade, moiModFiltro, obraId]);

  useEffect(() => {
    if (!popup || popup.tipo !== 'previsto' || !obraId) return;
    setPrevistoDetalheLoading(true);
    setBuscaPrevisto('');
    setOrdenarCampoPrevisto('nome_funcao');
    setOrdenarDirPrevisto('asc');
    const headers = { apikey: EFETIVO_SUPABASE_KEY, Authorization: `Bearer ${EFETIVO_SUPABASE_KEY}` };
    const filtroMoi = moiModFiltro === 'TOTAL' ? '' : `&moi_mod=eq.${moiModFiltro}`;
    fetch(`${EFETIVO_SUPABASE_URL}/rest/v1/vw_efetivo_previsto_mensal_detalhe?obra_id=eq.${obraId}&periodo=eq.${popup.periodo}${filtroMoi}&select=nome_funcao,moi_mod,qtd&order=qtd.desc&limit=500`, { headers })
      .then(r => r.ok ? r.json() : [])
      .then(rows => { setPrevistoDetalhe(Array.isArray(rows) ? rows : []); setPrevistoDetalheLoading(false); })
      .catch(() => { setPrevistoDetalhe([]); setPrevistoDetalheLoading(false); });
  }, [popup, moiModFiltro, obraId]);

  // Quadro-resumo: efetivo total disponível + %MOI/%MOD, sempre do dado
  // diário mais recente — independe da granularidade escolhida no gráfico.
  useEffect(() => {
    setResumo(null); setResumoErro(false);
    if (!obraId) return;
    const headers = { apikey: EFETIVO_SUPABASE_KEY, Authorization: `Bearer ${EFETIVO_SUPABASE_KEY}` };
    const pega = (url) => fetch(url, { headers })
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(rows => (Array.isArray(rows) && rows[0]) ? rows[0] : null);
    Promise.all([
      pega(`${EFETIVO_SUPABASE_URL}/rest/v1/vw_efetivo_diario_total?obra_id=eq.${obraId}&select=periodo,qtd&order=periodo.desc&limit=1`),
      pega(`${EFETIVO_SUPABASE_URL}/rest/v1/vw_efetivo_diario_moimod_total?obra_id=eq.${obraId}&moi_mod=eq.MOI&select=periodo,qtd&order=periodo.desc&limit=1`),
      pega(`${EFETIVO_SUPABASE_URL}/rest/v1/vw_efetivo_diario_moimod_total?obra_id=eq.${obraId}&moi_mod=eq.MOD&select=periodo,qtd&order=periodo.desc&limit=1`),
    ]).then(([rt, rmoi, rmod]) => {
      setResumo({
        total: rt ? parseValNum(rt.qtd) : null,
        moi: rmoi ? parseValNum(rmoi.qtd) : null,
        mod: rmod ? parseValNum(rmod.qtd) : null,
        periodo: rt ? rt.periodo : null,
      });
    }).catch(() => { setResumo({ total: null, moi: null, mod: null, periodo: null }); setResumoErro(true); });
  }, [obraId]);

  // Detalhe do quadro-resumo (nome, função, MOI/MOD) — mesmo dia usado no balão
  // "Efetivo Total Disponível", independente do filtro/granularidade do gráfico.
  useEffect(() => {
    if (!resumoPopupAberto || !obraId || !resumo?.periodo) return;
    setResumoDetalheLoading(true);
    setBuscaResumo('');
    setOrdenarCampoResumo('nome');
    setOrdenarDirResumo('asc');
    const headers = { apikey: EFETIVO_SUPABASE_KEY, Authorization: `Bearer ${EFETIVO_SUPABASE_KEY}` };
    fetch(`${EFETIVO_SUPABASE_URL}/rest/v1/vw_efetivo_diario_pessoas?obra_id=eq.${obraId}&periodo=eq.${resumo.periodo}&select=nome,nome_funcao,moi_mod&order=nome.asc&limit=1000`, { headers })
      .then(r => r.ok ? r.json() : [])
      .then(rows => { setResumoDetalhe(Array.isArray(rows) ? rows : []); setResumoDetalheLoading(false); })
      .catch(() => { setResumoDetalhe([]); setResumoDetalheLoading(false); });
  }, [resumoPopupAberto, obraId, resumo?.periodo]);

  const resumoDetalheVisivel = useMemo(() => {
    const termo = buscaResumo.trim().toLowerCase();
    let lista = resumoDetalhe;
    if (termo) {
      lista = lista.filter(r =>
        (r.nome || '').toLowerCase().includes(termo) ||
        (r.nome_funcao || '').toLowerCase().includes(termo) ||
        (r.moi_mod || '').toLowerCase().includes(termo)
      );
    }
    const dir = ordenarDirResumo === 'asc' ? 1 : -1;
    return [...lista].sort((a, b) => {
      const va = a[ordenarCampoResumo], vb = b[ordenarCampoResumo];
      return String(va || '').localeCompare(String(vb || ''), 'pt-BR') * dir;
    });
  }, [resumoDetalhe, buscaResumo, ordenarCampoResumo, ordenarDirResumo]);

  const alternarOrdenacaoResumo = (campo) => {
    if (ordenarCampoResumo === campo) { setOrdenarDirResumo(d => d === 'asc' ? 'desc' : 'asc'); }
    else { setOrdenarCampoResumo(campo); setOrdenarDirResumo('asc'); }
  };

  const fmtPeriodo = (p) => {
    const [ano, mes, dia] = p.split('-');
    if (granularidade === 'mes') {
      return `${MESES_ABREV[parseInt(mes, 10) - 1]}/${ano.slice(2)}`;
    }
    return `${dia}/${mes}`;
  };
  const fmtMes = (p) => {
    const [ano, mes] = p.split('-');
    return `${MESES_ABREV[parseInt(mes, 10) - 1]}/${ano.slice(2)}`;
  };

  if (!obraId) return null;

  const periodosReal = new Map(dados.map(d => [d.periodo, d.qtd]));
  const semanaMostraAmbos = !ocultarReal && !ocultarPrevisto && previstoSemanal.length > 0;
  const MAX_SEMANAS_GRAFICO = semanaMostraAmbos ? 12 : 26;
  const temFiltroData = (granularidade === 'semana' || granularidade === 'dia') && filtroDataDe && filtroDataAte;
  const dentroDoFiltro = (periodo) => !temFiltroData || (periodo >= filtroDataDe && periodo <= filtroDataAte);
  const periodosTodos = granularidade === 'mes'
    ? Array.from(new Set([...dados.map(d => d.periodo), ...previstoMensal.map(p => p.periodo), ...realHistoricoPorMes.keys(), ...realHistoricoPorMesViaSemana.keys()])).sort()
    : granularidade === 'semana'
      ? (() => {
        const todas = Array.from(new Set([...dados.map(d => d.periodo), ...previstoSemanal.map(p => p.periodo), ...realHistoricoPorSemana.keys()])).sort().filter(dentroDoFiltro);
        if (temFiltroData) return todas;
        const hojeStr = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; })();
        const ateHoje = todas.filter(p => p <= hojeStr);
        const base = ateHoje.length > 0 ? ateHoje : todas;
        return base.length > MAX_SEMANAS_GRAFICO ? base.slice(-MAX_SEMANAS_GRAFICO) : base;
      })()
      : dados.map(d => d.periodo).filter(dentroDoFiltro);
  const previstoDoPeriodo = (periodo) => {
    if (granularidade === 'mes') {
      return previstoPorMes.has(mesDoPeriodo(periodo)) ? previstoPorMes.get(mesDoPeriodo(periodo)) : null;
    }
    const semana = granularidade === 'semana' ? periodo : semanaDoPeriodo(periodo);
    if (previstoPorSemana.has(semana)) return previstoPorSemana.get(semana);
    return previstoPorMes.has(mesDoPeriodo(periodo)) ? previstoPorMes.get(mesDoPeriodo(periodo)) : null;
  };
  const realHistoricoDoPeriodo = (periodo) => {
    if (granularidade === 'mes') {
      if (realHistoricoPorMesViaSemana.has(periodo)) return realHistoricoPorMesViaSemana.get(periodo);
      return realHistoricoPorMes.has(periodo) ? realHistoricoPorMes.get(periodo) : null;
    }
    const semana = granularidade === 'semana' ? periodo : semanaDoPeriodo(periodo);
    if (realHistoricoPorSemana.has(semana)) return realHistoricoPorSemana.get(semana);
    return realHistoricoPorMes.has(mesDoPeriodo(periodo)) ? realHistoricoPorMes.get(mesDoPeriodo(periodo)) : null;
  };
  const dadosComPrevisto = periodosTodos.map(periodo => {
    const qtdLive = periodosReal.get(periodo);
    const historico = realHistoricoDoPeriodo(periodo);
    const semHistorico = qtdLive == null && historico != null;
    return {
      periodo,
      qtd: qtdLive ?? (semHistorico ? historico : 0),
      previsto: previstoDoPeriodo(periodo),
      semHistorico,
    };
  });
  const temPrevisto = dadosComPrevisto.some(d => d.previsto != null);
  const maxQtd = Math.max(1, ...dadosComPrevisto.map(d => Math.max(ocultarReal ? 0 : d.qtd, ocultarPrevisto ? 0 : (d.previsto || 0))));
  const niceMax = Math.ceil(maxQtd * 1.15 / 10) * 10 || 10;
  const W = 900, H = 230, L = 48, R = 16, TT2 = 16, B = 40;
  const plotW = W - L - R, plotH = H - TT2 - B;
  const n = dadosComPrevisto.length;
  const bw = n > 0 ? Math.min(46, (plotW / n) * 0.62) : 0;
  const skipLabel = granularidade === 'mes' ? 1 : (n > 14 ? Math.ceil(n / 14) : 1);
  const yFor = (qtd) => TT2 + plotH * (1 - qtd / niceMax);
  const xFor = (i) => L + (plotW / n) * (i + 0.5);

  const exportarPNG = () => {
    if (n === 0) return;
    const esc = (s) => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const OP = 26, HDR = 64;
    const EH = 480, EW = 1400;
    const EplotH = EH - TT2 - B, EplotW = EW - L - R;
    const yForE = (qtd) => TT2 + EplotH * (1 - qtd / niceMax);
    const xForE = (i) => L + (EplotW / n) * (i + 0.5);
    const EBw = n > 0 ? Math.min(70, (EplotW / n) * 0.62) : 0;
    const larguraTotal = EW + OP * 2;
    const alturaTotal = EH + HDR + OP * 2;
    const X = (x) => x + OP;
    const Y = (y) => y + HDR + OP;
    const granLabel = GRAN_EFETIVO.find(g => g.key === granularidade).label;
    const filtroLabel = moiModFiltro === 'TOTAL' ? '' : ` — ${moiModFiltro}`;
    const titulo = `Efetivo${filtroLabel} — ${obraNome || ''}`;
    const subtitulo = `Visão: ${granLabel}`;
    let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${larguraTotal} ${alturaTotal}" width="${larguraTotal}" height="${alturaTotal}" font-family="'IBM Plex Sans', Arial, sans-serif">`;
    svg += `<rect x="0" y="0" width="${larguraTotal}" height="${alturaTotal}" fill="#ffffff"/>`;
    svg += `<rect x="0.5" y="0.5" width="${larguraTotal - 1}" height="${alturaTotal - 1}" rx="16" fill="none" stroke="#e4e7ec" stroke-width="1"/>`;
    svg += `<text x="${X(L)}" y="${OP + 26}" font-size="20" font-weight="700" fill="#192231">${esc(titulo)}</text>`;
    svg += `<text x="${X(L)}" y="${OP + 45}" font-size="14" fill="#98a1b0">${esc(subtitulo)}</text>`;
    if (temPrevisto) {
      const lx = X(EW - R) - 180;
      svg += `<rect x="${lx}" y="${OP + 13}" width="13" height="13" rx="3" fill="#366092" opacity="${ocultarPrevisto ? 0.35 : 1}"/><text x="${lx + 19}" y="${OP + 23}" font-size="13" fill="#4d5868" opacity="${ocultarPrevisto ? 0.35 : 1}">Previsto</text>`;
      svg += `<rect x="${lx + 84}" y="${OP + 13}" width="13" height="13" rx="3" fill="#38761d" opacity="${ocultarReal ? 0.35 : 1}"/><text x="${lx + 103}" y="${OP + 23}" font-size="13" fill="#4d5868" opacity="${ocultarReal ? 0.35 : 1}">Real</text>`;
    }
    [0, 0.25, 0.5, 0.75, 1].forEach(f => {
      const y = Y(TT2 + EplotH * (1 - f));
      svg += `<line x1="${X(L)}" x2="${X(EW - R)}" y1="${y}" y2="${y}" stroke="#eef0f3" stroke-width="1"/>`;
    });
    [0, 0.5, 1].forEach(f => {
      const y = Y(TT2 + EplotH * (1 - f));
      svg += `<text x="${X(L) - 10}" y="${y}" text-anchor="end" dominant-baseline="middle" font-size="12" fill="#98a1b0">${Math.round(niceMax * f)}</text>`;
    });
