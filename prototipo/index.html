  const status = qtdTotal > 0 && qtdFinalizados === qtdTotal ? 'Finalizado' : qtdFinalizados === 0 ? 'Pendente' : 'Em andamento';
  const cor = status === 'Finalizado' ? T.green : status === 'Pendente' ? T.mut : T.amber;
  const bg = status === 'Finalizado' ? 'rgba(31,157,87,0.13)' : status === 'Pendente' ? '#eef0f3' : 'rgba(217,145,26,0.13)';
  return (
    <span className="mono status-badge-rmi" style={{ display:'inline-block', padding:'3px 9px', borderRadius:8, fontSize:10, fontWeight:700, letterSpacing:'0.03em', textTransform:'uppercase', background:bg, color:cor }}>
      <span className="status-badge-rmi-texto">{status}</span>
      <span className="status-badge-rmi-fracao">{qtdFinalizados}/{qtdTotal}</span>
    </span>
  );
}

// Farol Financeiro — pedido explícito (2026-08-24): "o valor, total
// consumido e saldo orçamentário poderão ser parte de um farol...
// funcionando similarmente ao desvio". Perguntado ao usuário qual regra
// definiria a cor (ADR-005, não inventar limiar): confirmado reaproveitar
// a MESMA classificação que já existia na coluna Desvio
// (`desvio_saldo_orcamentario`: positivo=verde, negativo=vermelho) — o
// Farol Financeiro é essa mesma informação, só que como o "ponto de luz"
// que o produto já usa em outros lugares (`FarolMedidoPrevisto`, Farol
// Medido×Físico em Medições) em vez de badge de texto — por isso a
// coluna Desvio separada saiu (redundante).
//
// Os 3 valores (Valor/Total Consumido/Saldo) passaram por 2 formatos
// antes deste — `title` nativo, depois um card que expandia no hover
// — até o usuário pedir, no mesmo dia: "vamos trocar o tooltip por um
// pop-up". Agora é clique: abre o mesmo tipo de pop-up
// (`modal-overlay-in`/`modal-card-in`) que o resto da tela já usa,
// via `onClick` recebido de fora (quem chama decide o título e os 3
// valores — material, Área ou Disciplina, ver `farolAgregado`).
function FarolFinanceiroRmi({ desvio, onClick }){
  const tom = desvio === 'negativo' ? { cor:T.red, borda:'rgba(210,59,59,0.4)', glow:'rgba(210,59,59,0.15)' }
    : desvio === 'positivo' ? { cor:T.green, borda:'rgba(31,157,87,0.4)', glow:'rgba(31,157,87,0.15)' }
    : { cor:T.mut, borda:'#c7cdd8', glow:'rgba(199,205,216,0.1)' };
  return (
    <span onClick={onClick} className="farol-financeiro-rmi"
      style={{ display:'inline-block', width:FAROL_LARGURA, height:FAROL_LARGURA, borderRadius:'50%', flexShrink:0, cursor:'pointer', background:tom.cor, border:`1px solid ${tom.borda}`, boxShadow:`0 0 8px 1px ${tom.glow}` }} />
  );
}

// Data da necessidade de compra / prazo de entrega / material em obra —
// pedido explícito (2026-08-24): "material em obra... será a Data da
// necessidade somada ao prazo de entrega". Campos vêm prontos da origem
// (`raw.data_necessidade_compra`, `raw.prazo_entrega` em dias) — só a
// soma é derivada aqui, nada fabricado.
function calcularMaterialEmObra(dataNecessidadeIso, prazoEntregaDias){
  if (!dataNecessidadeIso || prazoEntregaDias == null || isNaN(prazoEntregaDias)) return null;
  const dt = parseDataFlexivel(dataNecessidadeIso);
  if (!dt) return null;
  dt.setDate(dt.getDate() + prazoEntregaDias);
  return dt;
}
function fmtDataObjRmi(dt){
  if (!dt || isNaN(dt.getTime())) return '—';
  return `${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`;
}

// Calcula criticidade baseado em dias até a data limite em obra
function calcularCriticidade(dataLimite){
  if (!dataLimite || isNaN(dataLimite.getTime())) return { nivel: 'desconhecido', label: '—', cor: T.mut, bg: '#eef0f3' };
  const diasRestantes = Math.ceil((dataLimite.getTime() - new Date().getTime()) / (1000*60*60*24));
  if (diasRestantes <= 0) return { nivel: 'urgente', label: 'Urgente', cor:'#fff', bg:T.red };
  if (diasRestantes <= 7) return { nivel: 'alta', label: 'Alta', cor:'#fff', bg:T.amber };
  if (diasRestantes <= 30) return { nivel: 'moderada', label: 'Moderada', cor:T.ink, bg:'#fef3c7' };
  return { nivel: 'baixa', label: 'Baixa', cor:T.body, bg:'#e0e7ff' };
}

function CriticidadeBadgeRmi({ dataLimite, finalizado }){
  if (finalizado) return <span style={{ fontSize:11, color:T.mut }}>—</span>;
  const crit = calcularCriticidade(dataLimite);
  if (crit.nivel === 'desconhecido') return <span style={{ fontSize:11, color:T.mut }}>—</span>;
  return (
    <span className="mono" style={{ fontSize:10, fontWeight:700, letterSpacing:'0.03em', padding:'4px 10px', borderRadius:6, background:crit.bg, color:crit.cor, textTransform:'uppercase', display:'inline-block' }}>
      {crit.label}
    </span>
  );
}

function ModuloSuprimentos({ obraId, obraNome }){
  const [todosItens, setTodosItens] = useState(null); // null = carregando; senão array com raw de TODOS os níveis
  const [erro, setErro] = useState(false);
  const obraValidada = obraId === OBRA_SUPRIMENTOS_VALIDADA;
  // Fecha/abre linha de Área ou Disciplina na árvore — pedido explícito
  // (2026-08-24): "precisamos conseguir fechar os itens, visualização
  // macro é relevante". Chave = nome da área (fecha a área inteira) ou
  // `área::disciplina` (fecha só aquela disciplina). Nasce tudo aberto
  // (mesmo comportamento de sempre); fechar é opt-in por clique.
  const [fechados, setFechados] = useState(() => new Set());
  const alternarFechado = (chave) => setFechados(prev => {
    const next = new Set(prev);
    if (next.has(chave)) next.delete(chave); else next.add(chave);
    return next;
  });
  // Pop-up com os itens ORIGINAIS por trás de uma linha consolidada —
  // pedido explícito (2026-08-24): "pop-up que permita verificar quais
  // são os itens que estão aninhados, ao clicar na linha de resumo
  // dele". Guarda o material inteiro (já traz `itensOriginais` de
  // `consolidarMateriaisSemelhantes`); só abre pra linha com mais de 1
  // item (linha de item único não tem nada "aninhado" pra mostrar).
  const [materialAberto, setMaterialAberto] = useState(null);
  // Pop-up do Farol Financeiro (Valor/Total Consumido/Saldo) — pedido
  // explícito (2026-08-24): "vamos trocar o tooltip por um pop-up".
  // Era um card que expandia no hover (correção anterior, mesmo dia);
  // virou clique porque o usuário queria pop-up de verdade, não mais
  // uma variação de tooltip. Guarda só o necessário pra render (não o
  // objeto inteiro, porque também abre a partir das linhas de
  // Área/Disciplina, que não têm o mesmo formato de material).
  const [farolDetalhe, setFarolDetalhe] = useState(null);

  useEffect(() => {
    if (!obraValidada) return;
    setTodosItens(null); setErro(false);
    const headers = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };
    // Busca a obra INTEIRA (todos os níveis) de uma vez — resolver
    // disciplina + área + material precisa caminhar a árvore até a
    // folha, e essa folha pode estar em qualquer profundidade (ver
    // comentário acima). Volume por obra confirmado pequeno o bastante
    // (~500 a ~8.000 linhas) pra isso valer mais que ficar buscando
    // nível por nível sob demanda.
    fetchPaginado(`${SUPABASE_URL}/rest/v1/itens_rmi?id_obra=eq.${obraId}&select=id,raw`, headers)
      .then(rows => { if (rows === null) { setErro(true); setTodosItens([]); } else setTodosItens(rows); })
      .catch(() => { setErro(true); setTodosItens([]); });
  }, [obraId, obraValidada]);

  // Resolve disciplina por ramo, caminha até os materiais de verdade de
  // cada disciplina não-canteiro, consolida materiais semelhantes,
  // ordena por valor decrescente, acumula, marca Curva A e monta a
  // árvore Área → Disciplina → Material — ver comentário grande acima
  // pro racional completo.
  const { curvaA, arvore, todosOrdenados, restante, totalObra } = useMemo(() => {
    if (!todosItens) return { curvaA: [], arvore: [], todosOrdenados: [], restante: [], canteiro: { qtd:0, valor:0 }, semArea: { qtd:0, valor:0 }, totalObra: 0 };
    const itensNivel0 = todosItens.filter(r => r.raw.nivel === 0);
    const itensNivel1 = todosItens.filter(r => r.raw.nivel === 1);
    const disciplinas = resolverDisciplinasRmi(itensNivel0, itensNivel1);

    const filhosPorPaiGeral = new Map(); // pai->filhos, QUALQUER nível — pra caminhar até o material
    todosItens.forEach(r => {
      const pai = codigoPaiRmi(r.raw.codigo_seq);
      if (pai == null) return;
      const chave = `${r.raw.id_rmi}::${pai}`;
      if (!filhosPorPaiGeral.has(chave)) filhosPorPaiGeral.set(chave, []);
      filhosPorPaiGeral.get(chave).push(r);
    });

    let brutos = [];
    let qtdCanteiro = 0, valorCanteiro = 0;
    let qtdSemArea = 0, valorSemArea = 0;
    disciplinas.forEach(({ item, nome, areaHerdada }) => {
      if (ehItemCanteiroRmi(item.raw.descricao)) {
        qtdCanteiro++; valorCanteiro += Number(item.raw.subtotal_custo_meta_orcamento) || 0;
        return;
      }
      coletarMateriaisDaDisciplina(item, areaHerdada, filhosPorPaiGeral).forEach(({ item: m, area }) => {
        const valor = Number(m.raw.subtotal_custo_meta_orcamento) || 0;
        if (valor <= 0) return; // sem valor ainda — não é candidato a crítico
        // Itens sem área não precisam ser considerados (pedido
        // explícito, 2026-08-24) — ficam de fora do cálculo inteiro,
        // igual canteiro, não só escondidos da árvore.
        if (!area) { qtdSemArea++; valorSemArea += valor; return; }
        brutos.push({
          id: m.id, descricao: m.raw.descricao, unidade: m.raw.unidade,
          disciplina: nome, area, nome_rmi: m.raw.nome_rmi, id_rmi: m.raw.id_rmi,
          saldo_orcamentario: m.raw.saldo_orcamentario,
          desvio_saldo_orcamentario: m.raw.desvio_saldo_orcamentario,
          totalConsumido: Number(m.raw.total_consumido) || 0,
          finalizado: !!m.raw.finalizado,
          dataNecessidadeCompra: m.raw.data_necessidade_compra || null,
          prazoEntregaDias: (m.raw.prazo_entrega != null && m.raw.prazo_entrega !== '') ? Number(m.raw.prazo_entrega) : null,
          valor,
        });
      });
    });

    const validos = consolidarMateriaisSemelhantes(brutos);
    validos.sort((a, b) => b.valor - a.valor);
    const totalObra = validos.reduce((s, v) => s + v.valor, 0);
    let acumulado = 0;
    const todosOrdenados = validos.map(v => {
      const antes = acumulado;
      acumulado += v.valor;
      return {
        ...v,
        pctIndividual: totalObra ? (v.valor / totalObra) * 100 : 0,
        pctAcumulado: totalObra ? (acumulado / totalObra) * 100 : 0,
        curvaA: totalObra ? (antes / totalObra) < 0.8 : false,
      };
    });
    const curvaA = todosOrdenados.filter(v => v.curvaA);
    return {
      curvaA,
      arvore: agruparPorAreaDisciplina(curvaA),
      todosOrdenados,
      restante: todosOrdenados.filter(v => !v.curvaA),
      canteiro: { qtd: qtdCanteiro, valor: valorCanteiro },
      semArea: { qtd: qtdSemArea, valor: valorSemArea },
      totalObra,
    };
  }, [todosItens]);

  const restanteValor = soma(restante, 'valor') || 0;

  if (!obraValidada) return <CartaoEstado texto="🔨 Em desenvolvimento — Suprimentos está sendo validado para esta obra" maxHeight={620} />;
  if (todosItens === null) return <CartaoEstado texto="Carregando itens de RMI…" maxHeight={620} />;
  if (erro) return <CartaoEstado texto="Erro ao carregar itens_rmi" maxHeight={620} tom={T.red} />;
  if (todosOrdenados.length === 0) return <CartaoEstado texto="Nenhum material com valor lançado para esta obra" maxHeight={620} />;

  return (
    <div className="painel-gutter" style={{ flex:1, minHeight:0, display:'flex', flexDirection:'column', gap:14, overflow:'auto' }}>
      {/* Balões de resumo do topo saíram por pedido explícito
          (2026-08-24: "vamos retirar os balões superiores") — a
          contagem/valor de canteiro e sem área que eles mostravam
          continua calculada (`canteiro`/`semArea`) e disponível se
          precisar voltar, só não é mais exibida. */}
      <div style={{ display:'flex', gap:14, flex:1, minHeight:420 }}>
        <div className="card" style={{ flex:1, minWidth:320, borderRadius:14, overflow:'hidden', display:'flex', flexDirection:'column', padding:0 }}>
          <div className="table-scroll-x" style={{ overflow:'auto', flex:1 }}>
            <table style={{ width:'100%', minWidth:680, textAlign:'left', borderCollapse:'collapse', whiteSpace:'nowrap' }}>
              <thead style={{ position:'sticky', top:0, zIndex:2, background:'#fafbfc' }}>
                <tr className="mono" style={{ fontSize:10, textTransform:'uppercase', letterSpacing:'0.08em', color:T.mut, fontWeight:600 }}>
                  <th style={{ padding:'10px 14px', borderBottom:'2px solid var(--line)' }}>Área / Disciplina / Material</th>
                  <th style={{ padding:'10px 14px', textAlign:'right', borderBottom:'2px solid var(--line)' }}>Farol Financeiro</th>
                  <th style={{ padding:'10px 14px', textAlign:'right', borderBottom:'2px solid var(--line)' }}>Data da Necessidade de Compra</th>
                  <th style={{ padding:'10px 14px', textAlign:'right', borderBottom:'2px solid var(--line)' }}>Prazo de Entrega</th>
                  <th style={{ padding:'10px 14px', textAlign:'right', borderBottom:'2px solid var(--line)' }}>Data Limite em Obra</th>
                  <th style={{ padding:'10px 14px', textAlign:'center', borderBottom:'2px solid var(--line)' }}>Status</th>
                </tr>
              </thead>
              <tbody>
                {arvore.map(grupoArea => {
                  const areaFechada = fechados.has(grupoArea.area);
                  return (
                  <React.Fragment key={grupoArea.area}>
                    <tr className="hoverable" onClick={() => alternarFechado(grupoArea.area)} style={{ background:'#eef2f8', borderBottom:'1px solid var(--line)', cursor:'pointer' }}>
                      <td className="mono" style={{ padding:'8px 14px', fontSize:11.5, fontWeight:700, color:T.ink, textTransform:'uppercase', letterSpacing:'0.03em' }}>
                        <span style={{ display:'inline-block', width:14, color:T.blue }}>{areaFechada ? '▸' : '▾'}</span>
                        {grupoArea.area}
                      </td>
                      <td style={{ padding:'8px 14px', textAlign:'right' }}>
                        <FarolFinanceiroRmi desvio={grupoArea.desvio} onClick={e => { e.stopPropagation(); setFarolDetalhe({ titulo: grupoArea.area, valor: grupoArea.valor, totalConsumido: grupoArea.totalConsumido, saldo: grupoArea.saldoOrcamentario, desvio: grupoArea.desvio }); }} />
                      </td>
                      <td colSpan={4}></td>
                    </tr>
                    {!areaFechada && grupoArea.disciplinas.map(grupoDisc => {
                      const chaveDisc = `${grupoArea.area}::${grupoDisc.disciplina}`;
                      const discFechada = fechados.has(chaveDisc);
                      return (
                      <React.Fragment key={chaveDisc}>
                        <tr className="hoverable" onClick={() => alternarFechado(chaveDisc)} style={{ background:'#f7f8fa', borderBottom:'1px solid var(--line)', cursor:'pointer' }}>
                          <td className="mono" style={{ padding:'7px 14px 7px 30px', fontSize:11, fontWeight:600, color:T.body }}>
                            <span style={{ display:'inline-block', width:14, color:T.blue }}>{discFechada ? '▸' : '▾'}</span>
                            {grupoDisc.disciplina}
                          </td>
                          <td style={{ padding:'7px 14px', textAlign:'right' }}>
                            <FarolFinanceiroRmi desvio={grupoDisc.desvio} onClick={e => { e.stopPropagation(); setFarolDetalhe({ titulo: grupoDisc.disciplina, valor: grupoDisc.valor, totalConsumido: grupoDisc.totalConsumido, saldo: grupoDisc.saldoOrcamentario, desvio: grupoDisc.desvio }); }} />
                          </td>
                          <td colSpan={4}></td>
                        </tr>
                        {!discFechada && grupoDisc.materiais.map(it => {
                          const temAninhados = it.qtdConsolidada > 1;
                          return (
                            <tr key={it.id} className="hoverable" onClick={temAninhados ? () => setMaterialAberto(it) : undefined}
                              style={{ borderBottom:'1px solid var(--line)', cursor: temAninhados ? 'pointer' : 'default' }}>
                              <td style={{ padding:'9px 14px 9px 46px', fontSize:12.5, color:T.ink, fontWeight:600, maxWidth:320, whiteSpace:'normal', lineHeight:1.35 }}>
                                {it.descricao || '—'}
                                {temAninhados && <span style={{ marginLeft:6, fontSize:11, color:T.mut, fontWeight:400 }}>›</span>}
                              </td>
                              <td style={{ padding:'9px 14px', textAlign:'right' }}>
                                <FarolFinanceiroRmi desvio={it.desvio_saldo_orcamentario} onClick={e => { e.stopPropagation(); setFarolDetalhe({ titulo: it.descricao, valor: it.valor, totalConsumido: it.totalConsumido, saldo: it.saldo_orcamentario, desvio: it.desvio_saldo_orcamentario }); }} />
                              </td>
                              <td className="mono" style={{ padding:'9px 14px', textAlign:'right', fontSize:12, color:T.body, fontVariantNumeric:'tabular-nums' }}>{it.dataNecessidadeCompra ? fmtDataCompleta(it.dataNecessidadeCompra) : '—'}</td>
                              <td className="mono" style={{ padding:'9px 14px', textAlign:'right', fontSize:12, color:T.body, fontVariantNumeric:'tabular-nums' }}>{it.prazoEntregaDias != null ? `${it.prazoEntregaDias} dias` : '—'}</td>
                              <td className="mono" style={{ padding:'9px 14px', textAlign:'right', fontSize:12, color:T.body, fontVariantNumeric:'tabular-nums' }}>{fmtDataObjRmi(it.materialEmObra)}</td>
                              <td style={{ padding:'9px 14px', textAlign:'center' }}>
                                <StatusBadgeRmi qtdFinalizados={it.qtdFinalizados} qtdTotal={it.qtdConsolidada} />
                              </td>
                            </tr>
                          );
                        })}
                      </React.Fragment>
                      );
                    })}
                  </React.Fragment>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      </div>

      {materialAberto && (
        <div onClick={() => setMaterialAberto(null)} className="modal-overlay-in" style={{ position:'fixed', inset:0, zIndex:10001, background:'rgba(16,24,40,0.45)', backdropFilter:'blur(3px)', display:'flex', alignItems:'center', justifyContent:'center', padding:24 }}>
          <div onClick={e => e.stopPropagation()} className="modal-card-in" style={{ background:'#fff', border:'1px solid #e4e7ec', borderRadius:16, width:'100%', maxWidth:640, maxHeight:'78vh', display:'flex', flexDirection:'column', overflow:'hidden', boxShadow:'0 24px 60px -12px rgba(16,24,40,0.25)' }}>
            <div style={{ padding:'14px 20px', borderBottom:'1px solid #eef0f3', display:'flex', alignItems:'center', gap:12, flexShrink:0 }}>
              <div style={{ flex:1, minWidth:0 }}>
                <div className="mono" style={{ fontSize:10, letterSpacing:'0.16em', color:T.mut2, textTransform:'uppercase', fontWeight:600, marginBottom:4 }}>{materialAberto.area} — {materialAberto.disciplina}</div>
                <div style={{ fontSize:15, fontWeight:700, color:T.ink }}>{materialAberto.descricao} <span className="mono" style={{ fontSize:11, fontWeight:600, color:T.mut }}>({materialAberto.qtdConsolidada} itens)</span></div>
              </div>
              <button onClick={() => setMaterialAberto(null)} style={{ background:'#eef0f3', border:'none', color:T.mut, borderRadius:10, padding:'7px 12px', cursor:'pointer', fontSize:15, lineHeight:1, flexShrink:0 }}>✕</button>
            </div>
            <div style={{ overflowY:'auto', flex:1, minHeight:0, padding:'6px 20px 20px' }}>
              <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12 }}>
                <tbody>
                  {(materialAberto.itensOriginais || []).map((it, i) => {

                    return (
