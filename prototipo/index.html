    svg += `<line x1="${X(L)}" x2="${X(EW - R)}" y1="${Y(TT2 + EplotH)}" y2="${Y(TT2 + EplotH)}" stroke="#e4e7ec" stroke-width="1"/>`;
    dadosComPrevisto.forEach((d, i) => {
      const cx = X(xForE(i));
      const mostrarReal = !ocultarReal;
      const mostrarPrevisto = !ocultarPrevisto && d.previsto != null;
      const ambos = mostrarReal && mostrarPrevisto;
      const largura = ambos ? Math.max(1, EBw / 2 - 1.5) : EBw;
      const xPrev = ambos ? cx - largura - 1.5 : cx - largura / 2;
      const xReal = ambos ? cx + 1.5 : cx - largura / 2;
      if (mostrarReal) {
        const yReal = Y(yForE(d.qtd)), hReal = Y(TT2 + EplotH) - yReal;
        svg += `<rect x="${xReal.toFixed(1)}" y="${yReal.toFixed(1)}" width="${largura.toFixed(1)}" height="${Math.max(1, hReal).toFixed(1)}" rx="3" fill="#38761d"/>`;
        svg += `<text x="${(xReal + largura / 2).toFixed(1)}" y="${(yReal - 8).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="700" fill="#4d5868">${d.qtd}</text>`;
      }
      if (mostrarPrevisto) {
        const yPrev = Y(yForE(d.previsto)), hPrev = Y(TT2 + EplotH) - yPrev;
        svg += `<rect x="${xPrev.toFixed(1)}" y="${yPrev.toFixed(1)}" width="${largura.toFixed(1)}" height="${Math.max(1, hPrev).toFixed(1)}" rx="3" fill="#366092"/>`;
        svg += `<text x="${(xPrev + largura / 2).toFixed(1)}" y="${(yPrev - 8).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="700" fill="#4d5868">${d.previsto}</text>`;
      }
      if (i % skipLabel === 0) {
        svg += `<text x="${cx.toFixed(1)}" y="${(Y(TT2 + EplotH) + 24).toFixed(1)}" text-anchor="middle" font-size="12" fill="#98a1b0">${fmtPeriodo(d.periodo)}</text>`;
      }
    });
    svg += `</svg>`;

    const ESCALA = 3;
    const nomeArq = (obraNome || 'efetivo').toLowerCase().replace(/[^a-z0-9]+/g, '_');
    const svgBlob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = larguraTotal * ESCALA;
      canvas.height = alturaTotal * ESCALA;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.scale(ESCALA, ESCALA);
      ctx.drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      canvas.toBlob((blob) => {
        const pngUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = pngUrl;
        a.download = `efetivo_${nomeArq}_${granularidade}${moiModFiltro !== 'TOTAL' ? '_' + moiModFiltro.toLowerCase() : ''}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(pngUrl);
      }, 'image/png');
    };
    img.src = url;
  };

  const pctMoi = resumo === null ? '···' : (resumo.total ? `${(resumo.moi / resumo.total * 100).toFixed(1)}%` : '—');
  const pctMod = resumo === null ? '···' : (resumo.total ? `${(resumo.mod / resumo.total * 100).toFixed(1)}%` : '—');
  const totalTxt = resumo === null ? '···' : (resumo.total != null ? String(resumo.total) : '—');
  const corteResumo = resumo && resumo.periodo ? fmtDataCurta(parseDataFlexivel(resumo.periodo)) : null;

  return (
    <div className="painel-gutter" style={{ flex:1, minHeight:0, display:'flex', flexDirection:'column', gap:10 }}>

      <div className="kpi-row cols-3">
        <Balao titulo="Efetivo Total Disponível" cor={T.ink} bg="rgba(25,34,49,0.05)" borda="rgba(25,34,49,0.12)"
          corte={corteResumo} valor={resumoErro ? '—' : totalTxt}
          onClick={(resumo && resumo.periodo && !resumoErro) ? () => setResumoPopupAberto(true) : undefined} />
        <Balao titulo="% MOI" cor={T.blue} bg="rgba(37,99,235,0.08)" borda="rgba(37,99,235,0.15)"
          valor={resumoErro ? '—' : pctMoi} />
        <Balao titulo="% MOD" cor={T.amber} bg="rgba(217,145,26,0.08)" borda="rgba(217,145,26,0.15)"
          valor={resumoErro ? '—' : pctMod} />
      </div>

      <div className="toolbar-wrap" style={{ flexShrink: 0, padding: '8px 14px', background: 'rgba(37,99,235,0.08)', border: '1px solid rgba(37,99,235,0.18)', borderRadius: 12 }}>
        <svg xmlns="http://www.w3.org/2000/svg" width={16} height={16} viewBox="0 0 24 24" fill="none" stroke="#2563eb" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M3 3v18h18M7 16v-5M12 16V8M17 16v-9" />
        </svg>
        <div className="mono" style={{ fontSize: 13, fontWeight: 700, letterSpacing: '0.12em', color: '#98a1b0', textTransform: 'uppercase' }}>
          Efetivo
        </div>
        {temPrevisto && (
          <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
            <div onClick={() => setOcultarPrevisto(v => !v)} title={ocultarPrevisto ? 'Clique para exibir o Previsto' : 'Clique para ocultar o Previsto'}
              style={{ display: 'flex', alignItems: 'center', gap: 5, cursor: 'pointer', opacity: ocultarPrevisto ? 0.4 : 1, transition: 'opacity 0.15s' }}>
              <div style={{ width: 10, height: 10, borderRadius: 3, background: '#366092' }} />
              <span style={{ fontSize: 11, fontWeight: 600, color: '#4d5868', textDecoration: ocultarPrevisto ? 'line-through' : 'none' }}>Previsto</span>
            </div>
            <div onClick={() => setOcultarReal(v => !v)} title={ocultarReal ? 'Clique para exibir o Real' : 'Clique para ocultar o Real'}
              style={{ display: 'flex', alignItems: 'center', gap: 5, cursor: 'pointer', opacity: ocultarReal ? 0.4 : 1, transition: 'opacity 0.15s' }}>
              <div style={{ width: 10, height: 10, borderRadius: 3, background: '#38761d' }} />
              <span style={{ fontSize: 11, fontWeight: 600, color: '#4d5868', textDecoration: ocultarReal ? 'line-through' : 'none' }}>Real</span>
            </div>
          </div>
        )}
        {(granularidade === 'semana' || granularidade === 'dia') && (
          <div title="Filtrar por intervalo de datas (vazio = período padrão)" style={{ display: 'inline-flex', alignItems: 'center', gap: 4, background: '#eef0f3', borderRadius: 8, padding: '3px 8px' }}>
            <input type="date" value={filtroDataDe} onChange={e => setFiltroDataDe(e.target.value)}
              style={{ border: 'none', background: 'transparent', fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12, color: '#4d5868', width: 112 }} />
            <span style={{ color: '#98a1b0', fontSize: 12 }}>–</span>
            <input type="date" value={filtroDataAte} onChange={e => setFiltroDataAte(e.target.value)}
              style={{ border: 'none', background: 'transparent', fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12, color: '#4d5868', width: 112 }} />
            {(filtroDataDe || filtroDataAte) && (
              <button onClick={() => { setFiltroDataDe(''); setFiltroDataAte(''); }} title="Limpar filtro e voltar ao período padrão"
                style={{ border: 'none', background: 'transparent', color: '#98a1b0', cursor: 'pointer', padding: '2px 4px', fontSize: 13, fontWeight: 700, lineHeight: 1 }}>×</button>
            )}
          </div>
        )}
        <div className="margin-left-auto" style={{ marginLeft: 'auto', display: 'flex', gap: 6, flexWrap: 'wrap' }}>
          <div style={{ display: 'inline-flex', background: '#eef0f3', borderRadius: 8, padding: 3 }}>
            {[{ key: 'TOTAL', label: 'Total' }, { key: 'MOI', label: 'MOI' }, { key: 'MOD', label: 'MOD' }].map(m => (
              <button key={m.key} onClick={() => setMoiModFiltro(m.key)}
                style={{ border: 'none', background: moiModFiltro === m.key ? '#192231' : 'transparent', color: moiModFiltro === m.key ? '#fff' : '#4d5868',
                         fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12, fontWeight: 600, padding: '6px 12px', borderRadius: 6, cursor: 'pointer', transition: 'all 0.15s' }}>
                {m.label}
              </button>
            ))}
          </div>
          <div style={{ display: 'inline-flex', background: '#eef0f3', borderRadius: 8, padding: 3 }}>
            {GRAN_EFETIVO.map(g => (
              <button key={g.key} onClick={() => { setGranularidade(g.key); setPopup(null); }}
                style={{ border: 'none', background: granularidade === g.key ? '#2563eb' : 'transparent', color: granularidade === g.key ? '#fff' : '#4d5868',
                         fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12, fontWeight: 600, padding: '6px 14px', borderRadius: 6, cursor: 'pointer', transition: 'all 0.15s' }}>
                {g.label}
              </button>
            ))}
          </div>
          <button className="desktop-only" onClick={exportarPNG} title="Exportar gráfico como PNG (para slides)" style={{ display: 'flex', alignItems: 'center', gap: 6, background: '#eef0f3', border: 'none', color: '#4d5868', padding: '6px 12px', borderRadius: 8, cursor: 'pointer', fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12, fontWeight: 600 }}>
            <svg width={14} height={14} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" />
            </svg>
            Exportar PNG
          </button>
        </div>
      </div>

      <div key={`${granularidade}-${moiModFiltro}`} className="chart-zoom-in chart-fill-mobile" style={{ flex: 1, minHeight: 0, borderRadius: 14, overflow: 'hidden', display: 'flex', alignItems: 'center', justifyContent: 'center', background: '#fbfcfd', border: '1px solid #eef0f3', padding: 16 }}>
        {loading ? (
          <div className="skel" style={{ width: '90%', height: '80%' }} />
        ) : dadosComPrevisto.length === 0 ? (
          <div className="empty-box" style={{ width: '90%' }}>SEM DADOS DE EFETIVO PARA ESTA OBRA</div>
        ) : (
          <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: '100%' }} preserveAspectRatio="none">
            {[0, 0.25, 0.5, 0.75, 1].map(f => (
              <line key={f} x1={L} x2={W - R} y1={TT2 + plotH * (1 - f)} y2={TT2 + plotH * (1 - f)} stroke="#eef0f3" strokeWidth="1" />
            ))}
            {[0, 0.5, 1].map(f => (
              <text key={f} x={L - 8} y={TT2 + plotH * (1 - f)} textAnchor="end" dominantBaseline="middle" fontFamily="'IBM Plex Mono', monospace" fontSize="10" fill="#98a1b0">
                {Math.round(niceMax * f)}
              </text>
            ))}
            <line x1={L} x2={W - R} y1={TT2 + plotH} y2={TT2 + plotH} stroke="#e4e7ec" strokeWidth="1" />
            {dadosComPrevisto.map((d, i) => {
              const cx = xFor(i);
              const ativoReal = popup?.tipo === 'real' && popup.periodo === d.periodo;
              const ativoPrevisto = popup?.tipo === 'previsto' && popup.periodo === mesDoPeriodo(d.periodo);
              const mostrarReal = !ocultarReal;
              const mostrarPrevisto = !ocultarPrevisto && d.previsto != null;
              const ambos = mostrarReal && mostrarPrevisto;
              const largura = ambos ? Math.max(1, bw / 2 - 1.5) : bw;
              const xPrev = ambos ? cx - largura - 1.5 : cx - largura / 2;
              const xReal = ambos ? cx + 1.5 : cx - largura / 2;
              const yReal = yFor(d.qtd), hReal = (TT2 + plotH) - yReal;
              const yPrev = mostrarPrevisto ? yFor(d.previsto) : null;
              const hPrev = mostrarPrevisto ? (TT2 + plotH) - yPrev : 0;
              return (
                <g key={d.periodo} className={semHistoricoAviso === d.periodo ? 'bar-sem-historico' : ''}>
                  {mostrarReal && (
                    <rect x={xReal} y={yReal} width={largura} height={Math.max(1, hReal)} rx="3"
                      style={{ cursor: 'pointer', transition: 'fill 0.15s ease, filter 0.15s ease' }}
                      fill={ativoReal ? '#2c5c16' : '#38761d'}
                      onClick={() => d.semHistorico ? avisarSemHistorico(d.periodo) : setPopup({ tipo: 'real', periodo: d.periodo })}
                      onMouseEnter={e => { e.currentTarget.style.filter = 'drop-shadow(0 0 6px rgba(56,118,29,0.6))'; }}
                      onMouseLeave={e => { e.currentTarget.style.filter = ''; }} />
                  )}
                  {mostrarPrevisto && (
                    <rect x={xPrev} y={yPrev} width={largura} height={Math.max(1, hPrev)} rx="3"
                      style={{ cursor: 'pointer', transition: 'fill 0.15s ease, filter 0.15s ease' }}
                      fill={ativoPrevisto ? '#254a6e' : '#366092'}
                      onClick={() => setPopup({ tipo: 'previsto', periodo: mesDoPeriodo(d.periodo) })}
                      onMouseEnter={e => { e.currentTarget.style.filter = 'drop-shadow(0 0 6px rgba(54,96,146,0.6))'; }}
                      onMouseLeave={e => { e.currentTarget.style.filter = ''; }} />
                  )}
                  {mostrarReal && (
                    <text x={xReal + largura / 2} y={yReal - 6} textAnchor="middle" fontFamily="'IBM Plex Sans', sans-serif" fontSize="11" fontWeight="700" fill="#4d5868" style={{ pointerEvents: 'none' }}>{d.qtd}</text>
                  )}
                  {mostrarPrevisto && (
                    <text x={xPrev + largura / 2} y={yPrev - 6} textAnchor="middle" fontFamily="'IBM Plex Sans', sans-serif" fontSize="11" fontWeight="700" fill="#4d5868" style={{ pointerEvents: 'none' }}>{d.previsto}</text>
                  )}
                  {i % skipLabel === 0 && (
                    <text x={cx} y={TT2 + plotH + 20} textAnchor="middle" fontFamily="'IBM Plex Mono', monospace" fontSize="10" fill="#98a1b0" style={{ pointerEvents: 'none' }}>{fmtPeriodo(d.periodo)}</text>
                  )}
                  {semHistoricoAviso === d.periodo && (
                    <g className="label-sem-historico" style={{ pointerEvents: 'none' }}>
                      <rect x={cx - 62} y={yReal - 32} width={124} height={20} rx="5" fill="#192231" />
                      <text x={cx} y={yReal - 18} textAnchor="middle" fontFamily="'IBM Plex Sans', sans-serif" fontSize="10" fontWeight="600" fill="#fff">Sem histórico</text>
                    </g>
                  )}
                </g>
              );
            })}
          </svg>
        )}
      </div>

      {popup?.tipo === 'real' && (
        <div onClick={() => setPopup(null)} className="modal-overlay-in" style={{ position: 'fixed', inset: 0, zIndex: 9999, background: 'rgba(16,24,40,0.45)', backdropFilter: 'blur(3px)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
          <div onClick={e => e.stopPropagation()} className="modal-card-in" style={{ background: '#fff', border: '1px solid #e4e7ec', borderRadius: 14, width: '100%', maxWidth: 620, maxHeight: '64vh', display: 'flex', flexDirection: 'column', overflow: 'hidden', boxShadow: '0 24px 60px -12px rgba(16,24,40,0.25)' }}>
            <div style={{ padding: '13px 18px', borderBottom: '1px solid #eef0f3', display: 'flex', alignItems: 'center', gap: 10, flexShrink: 0 }}>
              <div style={{ width: 12, height: 12, borderRadius: 4, background: '#38761d', flexShrink: 0 }} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div className="mono" style={{ fontSize: 9, letterSpacing: '0.14em', color: '#aab2bf', textTransform: 'uppercase', fontWeight: 600, marginBottom: 2 }}>Efetivo Real — Detalhamento</div>
                <div style={{ fontSize: 16, fontWeight: 700, color: '#192231' }}>{fmtPeriodo(popup.periodo)}</div>
              </div>
              {!detalheLoading && (
                <div style={{ fontSize: 22, fontWeight: 700, color: '#38761d', flexShrink: 0 }}>
                  {(dados.find(d => d.periodo === popup.periodo) || {}).qtd ?? 0}
                </div>
              )}
              <button onClick={() => setPopup(null)} style={{ background: '#eef0f3', border: 'none', color: '#98a1b0', borderRadius: 9, padding: '6px 11px', cursor: 'pointer', fontSize: 14, lineHeight: 1, flexShrink: 0 }}>✕</button>
            </div>
            {!detalheLoading && detalhe.length > 0 && (
              <div style={{ padding: '10px 18px 0', flexShrink: 0 }}>
                <input type="text" value={buscaDetalhe} onChange={e => setBuscaDetalhe(e.target.value)}
                  placeholder="Buscar por nome, função ou empresa..."
                  style={{ width: '100%', boxSizing: 'border-box', fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12, padding: '7px 10px', border: '1px solid #e4e7ec', borderRadius: 8, outline: 'none', color: '#192231' }} />
              </div>
            )}
            <div style={{ overflowY: 'auto', flex: 1, minHeight: 0, padding: '0 18px 12px' }}>
              {detalheLoading && (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 8, paddingTop: 14 }}>
                  <div className="skel" style={{ height: 32 }} />
                  <div className="skel" style={{ height: 32, animationDelay: '0.15s' }} />
                  <div className="skel" style={{ height: 32, animationDelay: '0.3s' }} />
                </div>
              )}
              {!detalheLoading && detalhe.length === 0 && (
                <div className="empty-box" style={{ marginTop: 14 }}>NENHUM REGISTRO PARA ESTE PERÍODO</div>
              )}
              {!detalheLoading && detalhe.length > 0 && (
                <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                  <thead>
                    <tr style={{ position: 'sticky', top: 0, background: '#fff' }}>
                      {[
                        { campo: 'nome', label: 'Nome', align: 'left' },
                        { campo: 'nome_funcao', label: 'Função', align: 'left' },
                        { campo: 'razao_social', label: 'Empresa', align: 'left' },
                        { campo: 'moi_mod', label: 'MOI/MOD', align: 'center' },
                        ...(granularidade !== 'dia' ? [{ campo: 'dias_presentes', label: 'Dias', align: 'right' }] : []),
                      ].map(col => (
                        <th key={col.campo} onClick={() => alternarOrdenacao(col.campo)}
                          style={{ textAlign: col.align, fontSize: 9, letterSpacing: '0.07em', textTransform: 'uppercase', color: ordenarCampo === col.campo ? '#38761d' : '#98a1b0', fontWeight: 700, padding: '7px 6px', borderBottom: '1px solid #eef0f3', cursor: 'pointer', userSelect: 'none', whiteSpace: 'nowrap' }}>
                          {col.label}{ordenarCampo === col.campo && (ordenarDir === 'asc' ? ' ▲' : ' ▼')}
                        </th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {detalheVisivel.length === 0 && (
                      <tr><td colSpan={granularidade !== 'dia' ? 5 : 4} style={{ padding: '16px 6px', textAlign: 'center', fontSize: 11, color: '#98a1b0' }}>Nenhum resultado para a busca</td></tr>
                    )}
                    {detalheVisivel.map((r, i) => (
                      <tr key={i} style={{ borderBottom: '1px solid #f4f5f7' }}>
                        <td style={{ fontSize: 12, fontWeight: 600, color: '#192231', padding: '6px 6px' }}>{r.nome}</td>
                        <td style={{ fontSize: 11, color: '#4d5868', padding: '6px 6px' }}>{r.nome_funcao}</td>
                        <td style={{ fontSize: 11, color: '#4d5868', padding: '6px 6px' }}>{r.razao_social}</td>
                        <td className="mono" style={{ fontSize: 10, color: '#98a1b0', textAlign: 'center', padding: '6px 6px' }}>{r.moi_mod}</td>
                        {granularidade !== 'dia' && (
                          <td style={{ fontSize: 12, fontWeight: 700, color: '#38761d', textAlign: 'right', padding: '6px 6px' }}>{r.dias_presentes}</td>
                        )}
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
          </div>
        </div>
      )}

      {popup?.tipo === 'previsto' && (
        <div onClick={() => setPopup(null)} className="modal-overlay-in" style={{ position: 'fixed', inset: 0, zIndex: 9999, background: 'rgba(16,24,40,0.45)', backdropFilter: 'blur(3px)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
          <div onClick={e => e.stopPropagation()} className="modal-card-in" style={{ background: '#fff', border: '1px solid #e4e7ec', borderRadius: 14, width: '100%', maxWidth: 460, maxHeight: '60vh', display: 'flex', flexDirection: 'column', overflow: 'hidden', boxShadow: '0 24px 60px -12px rgba(16,24,40,0.25)' }}>
            <div style={{ padding: '13px 18px', borderBottom: '1px solid #eef0f3', display: 'flex', alignItems: 'center', gap: 10, flexShrink: 0 }}>
              <div style={{ width: 12, height: 12, borderRadius: 4, background: '#366092', flexShrink: 0 }} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div className="mono" style={{ fontSize: 9, letterSpacing: '0.14em', color: '#aab2bf', textTransform: 'uppercase', fontWeight: 600, marginBottom: 2 }}>Previsto — Detalhamento</div>
                <div style={{ fontSize: 16, fontWeight: 700, color: '#192231' }}>{fmtMes(popup.periodo)}</div>
              </div>

// ── Setor 6 — Desvios, direto da EAP (local × disciplina) ───────────────────
// Sem ponderação por custo contra o total do projeto (em hold — ver
// [[projeto-painel-mse]], a reconciliação com a Curva S não fechou): mostra
// valor absoluto por tarefa, média simples (aritmética) e — a partir de
// 2026-08-06 — também a média PONDERADA por `ponderacao_reais`, mas restrita
// aos próprios itens de cada grupo (peso = ponderacao_reais do item ÷ soma
// de ponderacao_reais só dos itens daquele local/disciplina, nunca contra o
// total da obra) — ver `mediaPonderada`. "Folha" = linha da EAP cujo `edt`
// não é prefixo de nenhuma outra linha da mesma obra — evita contar junto o
// resumo/macro (ex.: "SISTEMAS") e suas tarefas-filha, que duplicaria a
// mesma tarefa em dois níveis (algumas obras, como CNPEM, preenchem
// `ponderacao_reais` em todo nível da hierarquia, não só na folha — então
// esse filtro não pode depender dela).
// Hierarquia tipográfica dos 3 níveis (padronizada — mesmo tamanho/peso/cor
// em toda coluna do mesmo nível, só o "Desvio Ponderado" quebra o padrão de
// cor pra chamar o olho pro número que importa). Local é o mais forte (âncora
// do grupo), Tarefa é o mais leve (folha, densidade de dado alta).
// Cor de identidade por nível (2026-08-10, pedido explícito "tons diferentes
// nos níveis... como um navy e derivados"): mesma família de navy do
// cabeçalho (`.header-glow`, rgba(19,34,59)/rgba(31,58,99)) — Local no navy
// mais escuro/presente, Disciplina num navy mais claro, Tarefa neutro (fica
// só a cor de severidade ali, a linha já é densa demais pra levar mais uma
// camada de tom). É um eixo de cor DIFERENTE do `corDesvioTom` da faixa
// lateral/pill (aquele é severidade; este é profundidade da árvore) — os
// dois convivem de propósito, sinais diferentes.
const ESTILO_NIVEL = {
  local:      { fontSize:13.5, fontWeight:700, padV:11, cor:'#0f1e33', corSecundaria:T.body, bg:'rgba(15,30,51,0.11)' },
  disciplina: { fontSize:13,   fontWeight:600, padV:9,  cor:'#28466f', corSecundaria:T.body, bg:'rgba(40,70,111,0.07)' },
  tarefa:     { fontSize:12,   fontWeight:400, padV:7,  cor:T.body,   corSecundaria:T.body, bg:'transparent' },
};

function CelulaPonderado({ valor, nivel, destaque }){
  const s = ESTILO_NIVEL[nivel];
  const texto = valor != null ? `${destaque && valor > 0 ? '+' : ''}${valor.toFixed(nivel === 'tarefa' ? 2 : 1)}%` : '—';
  if (!destaque) {
    return (
      <td className="mono" style={{ padding:`${s.padV}px 14px`, textAlign:'right', fontSize:s.fontSize, fontWeight:400, color:s.corSecundaria, fontVariantNumeric:'tabular-nums' }}>
        {texto}
      </td>
    );
  }
  const tom = valor != null ? corDesvioTom(valor) : { cor:T.mut, bg:'#eef0f3', borda:'transparent' };
  return (
    <td style={{ padding:`${s.padV - 3}px 14px`, textAlign:'right' }}>
      <span className="mono" style={{ display:'inline-block', minWidth:56, padding:'3px 9px', borderRadius:7, fontSize:s.fontSize, fontWeight:700,
        color:tom.cor, background:tom.bg, fontVariantNumeric:'tabular-nums' }}>
        {texto}
      </span>
    </td>
  );
}

              <CelulaPonderado valor={d.avancoPonderado} nivel="disciplina" />
              <CelulaPonderado valor={d.desvioPonderado} nivel="disciplina" destaque />
              <td></td>

            {discAberta && d.tarefasVisiveis.map(t => {

              return (

                  <td className="mono" style={{ padding:`${st.padV}px 14px ${st.padV}px 54px`, fontSize:st.fontSize, color:st.cor }}>{t.tarefa}</td>
                  <td className="mono" style={{ padding:`${st.padV}px 14px`, textAlign:'right', fontSize:st.fontSize, color:st.corSecundaria, fontVariantNumeric:'tabular-nums' }}>{t.avanco_atual != null ? `${t.avanco_atual.toFixed(1)}%` : '—'}</td>

                  <td style={{ padding:`${st.padV}px 14px`, fontSize:st.fontSize, color:t.encarregado_nome ? st.corSecundaria : T.mut2 }}>{t.encarregado_nome || '—'}</td>
                  <CelulaPonderado valor={t.previstoPonderado} nivel="tarefa" />

                  <td className="mono" style={{ padding:`${st.padV}px 14px`, textAlign:'right', fontSize:st.fontSize, color:st.corSecundaria, fontVariantNumeric:'tabular-nums' }}>{fmtDataLonga(t.data_inicio)}</td>
                  <td className="mono" style={{ padding:`${st.padV}px 14px`, textAlign:'right', fontSize:st.fontSize, color:st.corSecundaria, fontVariantNumeric:'tabular-nums' }}>{fmtDataLonga(t.data_termino)}</td>

function ModuloDesvios({ obraId, obraNome }){
  const [eapRaw, setEapRaw] = useState(null);
  const [eapErro, setEapErro] = useState(false);
  const [locaisAbertos, setLocaisAbertos] = useState(() => new Set());
  const [disciplinasAbertas, setDisciplinasAbertas] = useState(() => new Set());
  const [busca, setBusca] = useState('');
  const [ordenarPor, setOrdenarPor] = useState('edt');
  const [ordenarDir, setOrdenarDir] = useState('asc');

  useEffect(() => {
    setEapRaw(null); setEapErro(false); setLocaisAbertos(new Set()); setDisciplinasAbertas(new Set());
    setBusca(''); setOrdenarPor('edt'); setOrdenarDir('asc');
    const headers = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };
    fetchPaginado(`${SUPABASE_URL}/rest/v1/EAP?id_obra=eq.${obraId}&select=id,edt,tarefa,disciplina,local,avanco_atual,desvio,data_inicio,data_termino,ponderacao_reais,encarregado_nome`, headers)
      .then(rows => {
        if (rows === null) { setEapErro(true); setEapRaw([]); }
        else setEapRaw(rows);
      })
      .catch(() => { setEapErro(true); setEapRaw([]); });
  }, [obraId]);

  const folhas = useMemo(() => {
    if (!eapRaw) return null;
    const edts = new Set(eapRaw.map(r => r.edt).filter(Boolean));
    const temFilho = (edt) => {
      const pref = edt + '.';
      for (const e of edts) if (e.startsWith(pref)) return true;
      return false;
    };
    return eapRaw.filter(r => !r.edt || !temFilho(r.edt));
  }, [eapRaw]);

  // Total do projeto pra base do peso — soma da `ponderacao_reais` das linhas
  // RAIZ (edt sem pai no dataset), não da soma das folhas: confirmado ao vivo
  // (2026-08-06) que bate exato com o total do cronograma do Portal (CNPEM:
  // R$51.629.338,60, contra R$51.629.340,30 do CSV) — a soma das folhas dá
  // R$49,68M por causa de uns EDTs malformados na fonte (ver
  // [[projeto-painel-mse]]), enquanto a raiz já carrega o rollup completo,
  // sem depender de nenhuma folha individual estar bem formada.
  const pesoTotalProjeto = useMemo(() => {
    if (!eapRaw) return null;
    const edts = new Set(eapRaw.map(r => r.edt).filter(Boolean));
    const pai = (edt) => {
      const partes = edt.split('.');
      return partes.length > 1 ? partes.slice(0, -1).join('.') : null;
    };
    const raizes = eapRaw.filter(r => r.edt && (!pai(r.edt) || !edts.has(pai(r.edt))));
    return raizes.reduce((s, r) => s + (r.ponderacao_reais || 0), 0);
  }, [eapRaw]);

  // Só o que interessa nesta tela: tarefas atrasadas (desvio < 0). Tarefa sem
  // `desvio` (null) também sai — sem sinal, não dá pra afirmar que está
  // negativa. `previsto` é derivado aqui (mesma fórmula confirmada com o
  // usuário — ver [[projeto-painel-mse]]: previsto = avanco_atual - desvio).
  // Peso de cada tarefa = `ponderacao_reais` ÷ `pesoTotalProjeto` (peso fixo
  // contra o projeto inteiro, não contra a soma só destas tarefas atrasadas
  // — corrigido a partir de um exemplo numérico do usuário). O ponderado de
  // previsto/avanço é o valor absoluto × esse peso (fração pequena, não uma
  // média) — a agregação em qualquer nível (disciplina, local, geral) é a
  // SOMA dos ponderados das tarefas daquele grupo, nunca uma nova média.
  const folhasAtrasadas = useMemo(() => {
    if (!folhas || pesoTotalProjeto == null) return null;
    const atrasadas = folhas.filter(t => t.desvio < 0).map(t => ({
      ...t,
      previsto: (t.avanco_atual != null && t.desvio != null) ? t.avanco_atual - t.desvio : null,
    }));
    return atrasadas.map(t => {
      const peso = pesoTotalProjeto ? (t.ponderacao_reais || 0) / pesoTotalProjeto : 0;
      return {
        ...t,
        peso: peso * 100,
        avancoPonderado: t.avanco_atual != null ? t.avanco_atual * peso : null,
        previstoPonderado: t.previsto != null ? t.previsto * peso : null,
      };
    });
  }, [folhas, pesoTotalProjeto]);

  const grupos = useMemo(() => {
    if (!folhasAtrasadas) return null;
    const dir = ordenarDir === 'asc' ? 1 : -1;
    const comPonderado = (tarefas) => {
      const peso = soma(tarefas, 'peso');
      const avancoPonderado = soma(tarefas, 'avancoPonderado');
      const previstoPonderado = soma(tarefas, 'previstoPonderado');
      const desvioPonderado = (avancoPonderado != null && previstoPonderado != null) ? avancoPonderado - previstoPonderado : null;
      return { peso, avancoPonderado, previstoPonderado, desvioPonderado };
    };
    // Busca textual (pedido explícito) — mesmo normalizador já usado em
    // Encarregados/Restrições, aplicado a EDT/tarefa/disciplina/local/
    // responsável de cada folha.
    const alvoBusca = normalizarNomeParaMatch(busca);
    const bateBusca = (t) => !alvoBusca || [t.edt, t.tarefa, t.disciplina, t.local, t.encarregado_nome]
      .some(campo => normalizarNomeParaMatch(campo).includes(alvoBusca));
    // Impacto na Curva S abaixo do limiar não aparece na listagem (ver
    // LIMIAR_IMPACTO_CURVA_S) — os totais de `comPonderado` acima continuam
    // somando TODAS as tarefas do grupo, só a lista de itens é filtrada.
    // Disciplina/Local que ficam sem NENHUM item visível depois do filtro
    // (impacto OU busca) desaparecem também (macro vazio não ajuda ninguém).
    // Ordenação por coluna (pedido explícito) — EDT usa o comparador
    // segmentado de sempre (`compararEdt`); qualquer outra coluna usa
    // `valorItemDesvio`. Continua só dentro de cada disciplina, não muda a
    // ordem de Local/Disciplina (ver comentário de `COLUNAS_DESVIOS`).
    const visiveis = (tarefas) => {
      const filtradas = tarefas.filter(t =>
        (t.avancoPonderado != null && t.previstoPonderado != null) &&
        Math.abs(t.avancoPonderado - t.previstoPonderado) >= LIMIAR_IMPACTO_CURVA_S &&
        bateBusca(t));
      if (ordenarPor === 'edt') return filtradas.sort((a, b) => compararEdt(a.edt, b.edt) * dir);
      return filtradas.sort((a, b) => {
        const va = valorItemDesvio(a, ordenarPor), vb = valorItemDesvio(b, ordenarPor);
        return va < vb ? -1 * dir : va > vb ? 1 * dir : 0;
      });
    };
    // Local/Disciplina continuam ordenados por severidade (desvioPonderado,
    // pior primeiro) por padrão — só reordenam pela coluna clicada quando
    // ela existe em nível de GRUPO (as 4 agregadas); nas colunas só-de-item
    // não tem o que reordenar aqui, cairia tudo empatado em 0.
    const ordenarGrupos = (arr) => CAMPOS_AGREGADOS_DESVIOS.has(ordenarPor)
      ? arr.sort((a, b) => ((a[ordenarPor] ?? 0) - (b[ordenarPor] ?? 0)) * dir)
      : arr.sort((a, b) => (a.desvioPonderado ?? 0) - (b.desvioPonderado ?? 0));
    const porLocal = {};
    folhasAtrasadas.forEach(t => {
      const loc = grupoLocal(t.local);
      const disc = nomeOuFallback(t.disciplina, '(Sem disciplina)');
      const g = (porLocal[loc] = porLocal[loc] || { tarefas: [], porDisciplina: {} });
      g.tarefas.push(t);
      (g.porDisciplina[disc] = g.porDisciplina[disc] || []).push(t);
    });
    return ordenarGrupos(Object.entries(porLocal).map(([local, v]) => {
      const disciplinas = ordenarGrupos(Object.entries(v.porDisciplina)
        .map(([disciplina, tarefas]) => ({
          disciplina,
          tarefasVisiveis: visiveis(tarefas),
          ...comPonderado(tarefas),
        }))
        .filter(d => d.tarefasVisiveis.length > 0));
      return { local, disciplinas, ...comPonderado(v.tarefas) };
    })
      .filter(g => g.disciplinas.length > 0));
  }, [folhasAtrasadas, busca, ordenarPor, ordenarDir]);

  if (eapRaw === null) return <CartaoEstado texto="Carregando desvios…" maxHeight={620} />;
  if (eapErro) return <CartaoEstado texto="Erro ao carregar EAP" maxHeight={620} tom={T.red} />;
  // Sem NENHUMA tarefa com desvio negativo (independente de busca) — estado
  // vazio de verdade. "Busca não achou nada" é um caso DIFERENTE, tratado
  // mais abaixo (dentro do return, com a busca ainda visível pra editar).
  if (!folhasAtrasadas || folhasAtrasadas.length === 0) return <CartaoEstado texto="Nenhuma tarefa com desvio negativo nesta obra" maxHeight={620} />;
  if (!grupos) return <CartaoEstado texto="Carregando desvios…" maxHeight={620} />;
  const tarefasVisiveisTotal = grupos.reduce((s, g) => s + g.disciplinas.reduce((s2, d) => s2 + d.tarefasVisiveis.length, 0), 0);

  const previstoPonderadoGeral = soma(folhasAtrasadas, 'previstoPonderado');
  const avancoPonderadoGeral = soma(folhasAtrasadas, 'avancoPonderado');
  const desvioPonderadoGeral = (avancoPonderadoGeral != null && previstoPonderadoGeral != null) ? avancoPonderadoGeral - previstoPonderadoGeral : null;
  const tomImpacto = desvioPonderadoGeral != null ? corDesvioTom(desvioPonderadoGeral) : { cor:T.mut, bg:'#eef0f3', borda:'var(--line)' };

  const alternarLocal = (local) => setLocaisAbertos(prev => {
    const next = new Set(prev);
    next.has(local) ? next.delete(local) : next.add(local);
    return next;
  });
  const alternarDisciplina = (chave) => setDisciplinasAbertas(prev => {
    const next = new Set(prev);
    next.has(chave) ? next.delete(chave) : next.add(chave);
    return next;
  });
  // Botões "Nível 1/2/3" — ação em lote (não é um toggle persistente): abre
  // todo mundo até a profundidade escolhida, sem tentar acompanhar cliques
  // manuais depois. Nível 1 = só Local; 2 = Local+Disciplina; 3 = tudo.
  const abrirNivel = (nivel) => {
    if (nivel === 1) { setLocaisAbertos(new Set()); setDisciplinasAbertas(new Set()); return; }
    const todosLocais = new Set(grupos.map(g => g.local));
    if (nivel === 2) { setLocaisAbertos(todosLocais); setDisciplinasAbertas(new Set()); return; }
    const todasDisciplinas = new Set(grupos.flatMap(g => g.disciplinas.map(d => `${g.local}::${d.disciplina}`)));
    setLocaisAbertos(todosLocais); setDisciplinasAbertas(todasDisciplinas);
  };
  // Direção padrão por tipo de coluna, mesma convenção já usada em
  // Encarregados/Medições: texto começa ascendente, número/data desceente
  // (maior/mais recente primeiro) — exceto Desvio Ponderado, que começa
  // ascendente de propósito (é negativo; ascendente = pior primeiro, a
  // mesma leitura "pior no topo" que a tela já usava antes de existir
  // ordenação por coluna).
  const alternarOrdenacao = (campo) => {
    if (ordenarPor === campo) { setOrdenarDir(d => d === 'asc' ? 'desc' : 'asc'); return; }
    setOrdenarPor(campo);
    setOrdenarDir(campo === 'tarefa' || campo === 'responsavel' || campo === 'edt' || campo === 'desvioPonderado' ? 'asc' : 'desc');
  };

  return (
    <div className="painel-gutter" style={{ flex:1, minHeight:0, display:'flex', flexDirection:'column', gap:14 }}>
      <div className="kpi-row cols-2">
        <Balao titulo="Tarefas com Desvio Negativo" cor={T.ink} bg="rgba(37,99,235,0.05)" borda="rgba(37,99,235,0.1)" valor={folhasAtrasadas.length} />
        <Balao titulo="Impacto Negativo (Curva S)" cor={tomImpacto.cor} bg={tomImpacto.bg} borda={tomImpacto.borda}
          valor={desvioPonderadoGeral != null ? `${desvioPonderadoGeral > 0 ? '+' : ''}${desvioPonderadoGeral.toFixed(1)}%` : '—'} />
      </div>

      <div className="desvios-filtros toolbar-wrap" style={{ display:'flex', alignItems:'center', gap:10, flexShrink:0 }}>
        <input type="text" value={busca} onChange={e => setBusca(e.target.value)}
          placeholder="Buscar por EDT, tarefa, disciplina, local, responsável..."
          style={{ flex:1, boxSizing:'border-box', fontFamily:"'IBM Plex Sans', sans-serif", fontSize:12.5, padding:'9px 12px', border:'1px solid var(--line)', borderRadius:8, outline:'none', color:T.ink, background:'#fff' }} />
        {busca && (
          <span className="mono" style={{ fontSize:11, color:T.mut, whiteSpace:'nowrap' }}>{tarefasVisiveisTotal} de {folhasAtrasadas.length}</span>
        )}
        <span className="mono" style={{ fontSize:11, letterSpacing:'0.08em', color:T.mut, textTransform:'uppercase', whiteSpace:'nowrap' }}>Abrir até o nível</span>
        <div style={{ display:'flex', gap:6, flexShrink:0 }}>
          {[1, 2, 3].map(n => (
            <button key={n} className="btn-nivel" onClick={() => abrirNivel(n)} title={`Abrir Local${n >= 2 ? ' + Disciplina' : ''}${n >= 3 ? ' + Tarefa' : ''}`}
              style={{ background:'#eef0f3', border:'none', color:T.body, padding:'6px 14px', borderRadius:8, cursor:'pointer', fontSize:12, fontWeight:600 }}>
              {n}
            </button>
          ))}
        </div>
      </div>

      {grupos.length === 0 && (
        <CartaoEstado texto={busca ? `Nenhuma tarefa encontrada para "${busca}"` : 'Nenhuma tarefa acima do limiar de impacto'} maxHeight={620} />
      )}
      {grupos.length > 0 && (
      <div className="card" style={{ flex:1, minHeight:0, borderRadius:14, overflow:'hidden', display:'flex', flexDirection:'column', padding:0 }}>
        <div className="table-scroll-x" style={{ overflow:'auto', flex:1 }}>
          <table style={{ width:'100%', tableLayout:'fixed', textAlign:'left', borderCollapse:'collapse' }}>
            <colgroup>
              {COLUNAS_DESVIOS.map(col => <col key={col.campo} style={{ width:col.largura }} />)}
            </colgroup>
            <thead style={{ position:'sticky', top:0, zIndex:2, background:'#fff' }}>
              <tr className="mono" style={{ fontSize:10, textTransform:'uppercase', letterSpacing:'0.1em', color:T.mut, fontWeight:600 }}>
                {COLUNAS_DESVIOS.map(col => {
                  const ativo = ordenarPor === col.campo;
                  return (
                    <th key={col.campo} onClick={() => alternarOrdenacao(col.campo)} title="Ordenar por esta coluna"
                      style={{ padding:'10px 14px', textAlign:col.align || 'left', cursor:'pointer', userSelect:'none', color: ativo ? T.blue : undefined, borderBottom:'1px solid var(--line)' }}>
                      {col.label}{ativo ? (ordenarDir === 'asc' ? ' ▲' : ' ▼') : ''}
                    </th>
                  );
                })}
              </tr>
            </thead>
            <tbody>
              {grupos.map(g => (
                <LinhaLocalDesvio key={g.local} grupo={g}
                  aberto={locaisAbertos.has(g.local)}
                  onToggle={() => alternarLocal(g.local)}
                  disciplinasAbertas={disciplinasAbertas}
                  onToggleDisciplina={alternarDisciplina} />
              ))}
            </tbody>
          </table>
        </div>
      </div>
      )}
    </div>
  );
}

// ── Setor 7 — Restrições, direto de `restricoes_obra` ───────────────────────
// 1 linha por obra, `id_obra` bate direto com `OBRAS[].id` (sem mapa, mesmo
// padrão de `curvas_s`/`curva_avanco_historico`) — o que importa mora dentro
// de `restricoes` (jsonb, array de restrições), sincronizado do PortalMSE.
// Tabela só tinha policy de RLS para `service_role` (2026-08-07); criada
// policy de leitura pra `anon`/`authenticated` — sem ela a tela sempre viria
// vazia (mesma armadilha 2 do vault: `Content-Range: */0`, sem erro).
function corCriticidade(c){
  const s = (c || '').trim().toLowerCase();
  if (s === 'alta') return { cor:T.red, bg:'rgba(210,59,59,0.13)' };
  if (s === 'média' || s === 'media') return { cor:T.amber, bg:'rgba(217,145,26,0.13)' };
  if (s === 'baixa') return { cor:T.green, bg:'rgba(31,157,87,0.13)' };
  return { cor:T.mut, bg:'#eef0f3' };
}
// Domínio de status não é conhecido por inteiro (só "Aberto" apareceu até
// agora nos dados reais) — casa por substring em vez de lista fechada, pra
// não deixar um status novo do Portal cair no "—" por engano.
function corStatusRestricao(label){
  const s = (label || '').trim().toLowerCase();
  if (s.includes('conclu')) return { cor:T.green, bg:'rgba(31,157,87,0.13)' };
  if (s.includes('cancel')) return { cor:T.mut, bg:'#eef0f3' };
  if (s.includes('abert')) return { cor:T.amber, bg:'rgba(217,145,26,0.13)' };
  return { cor:T.mut, bg:'#eef0f3' };
}
// `onClick`/`ativo` são opcionais — sem eles, continua o mesmo badge
// estático de sempre (Restrições usa assim). Com `onClick`, vira um botão
// disfarçado de badge (cursor pointer + anel de destaque quando `ativo`).
function BadgePill({ texto, cor, bg, onClick, ativo }){
  return (
    <span onClick={onClick} className="mono" style={{
      display:'inline-block', padding:'3px 10px', borderRadius:8, fontSize:11.5, fontWeight:700,
      letterSpacing:'0.04em', textTransform:'uppercase', background:bg, color:cor,
      cursor: onClick ? 'pointer' : 'default',
      boxShadow: ativo ? `0 0 0 2px ${cor}` : 'none',
    }}>{texto || '—'}</span>
  );
}

// `usuario_cadastro` vem como "089.093.626-93 (ELIVAN BARBOSA)" — só o nome
// entre parênteses interessa na tabela, sem o CPF.
function nomeUsuarioCadastro(usuario){
  const s = (usuario || '').trim();
  if (!s) return null;
  const m = s.match(/\(([^)]+)\)\s*$/);
  return m ? m[1].trim() : s;
}

const RANK_CRITICIDADE = { alta: 0, média: 1, media: 1, baixa: 2 };
const COLUNAS_RESTRICOES = [
  { label:'Criticidade', campo:'criticidade' },
  { label:'Status',      campo:'status' },
  { label:'Tarefa',      campo:'tarefa' },
  { label:'Descrição',   campo:'descricao' },
  { label:'Tipo',        campo:'tipo' },
  { label:'Responsável', campo:'responsavel' },
  { label:'Cadastrado por', campo:'usuario' },
  { label:'Início',      campo:'inicio',    align:'right' },
  { label:'Conclusão',   campo:'conclusao', align:'right' },
];

function ModuloRestricoes({ obraId, obraNome }){
  const [dado, setDado] = useState(null);
  const [erro, setErro] = useState(false);
  const [busca, setBusca] = useState('');
  const [ordenarPor, setOrdenarPor] = useState('prioridade');
  const [ordenarDir, setOrdenarDir] = useState('asc');

  useEffect(() => {
    setDado(null); setErro(false); setBusca(''); setOrdenarPor('prioridade'); setOrdenarDir('asc');
    const headers = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };
    fetch(`${SUPABASE_URL}/rest/v1/restricoes_obra?id_obra=eq.${obraId}&select=restricoes,atualizado_em`, { headers })
      .then(r => r.ok ? r.json() : null)
      .then(rows => {
        if (rows === null) { setErro(true); setDado([]); return; }
        setDado(Array.isArray(rows[0]?.restricoes) ? rows[0].restricoes : []);
      })
      .catch(() => { setErro(true); setDado([]); });
  }, [obraId]);

  const alternarOrdenacao = (campo) => {
    if (ordenarPor === campo) setOrdenarDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setOrdenarPor(campo); setOrdenarDir('asc'); }
  };

  const rankStatusAberto = r => (r.status_cadastro_label || '').toLowerCase().includes('abert') ? 0 : 1;
  const rankCriticidade = r => RANK_CRITICIDADE[(r.criticidade || '').trim().toLowerCase()] ?? 3;

  // Busca textual — mesmo normalizador de nome já usado em Encarregados
  // (maiúsculo, sem acento), aplicado aqui a qualquer campo visível na linha.
  const filtradas = useMemo(() => {
    if (!dado) return null;
    const alvo = normalizarNomeParaMatch(busca);
    if (!alvo) return dado;
    return dado.filter(r => [r.descricao, r.nome_eap, r.responsabilidade, r.nome_tipo_restricao, r.usuario_cadastro, r.criticidade, r.status_cadastro_label]
      .some(campo => normalizarNomeParaMatch(campo).includes(alvo)));
  }, [dado, busca]);

  const restricoes = useMemo(() => {
    if (!filtradas) return null;
    const arr = filtradas.slice();
    const dir = ordenarDir === 'asc' ? 1 : -1;
    if (ordenarPor === 'prioridade') {
      arr.sort((a, b) =>
        rankStatusAberto(a) - rankStatusAberto(b) ||
        rankCriticidade(a) - rankCriticidade(b) ||
        (a.data_inicio || '').localeCompare(b.data_inicio || ''));
      if (dir === -1) arr.reverse();
      return arr;
    }
    const valor = (r) => {
      switch (ordenarPor) {
        case 'criticidade': return rankCriticidade(r);
        case 'status': return rankStatusAberto(r);
        case 'tarefa': return (r.nome_eap || '').toLowerCase();
        case 'descricao': return (r.descricao || '').toLowerCase();
        case 'tipo': return (r.nome_tipo_restricao || '').toLowerCase();
        case 'responsavel': return (r.responsabilidade || '').toLowerCase();
        case 'usuario': return (nomeUsuarioCadastro(r.usuario_cadastro) || '').toLowerCase();
        case 'inicio': return r.data_inicio || '';
        case 'conclusao': return r.data_conclusao || '';
        default: return 0;
      }
    };
    arr.sort((a, b) => {
      const va = valor(a), vb = valor(b);
      return va < vb ? -1 * dir : va > vb ? 1 * dir : 0;
    });
    return arr;
  }, [filtradas, ordenarPor, ordenarDir]);

  if (dado === null) return <CartaoEstado texto="Carregando restrições…" maxHeight={620} />;
  if (erro) return <CartaoEstado texto="Erro ao carregar restricoes_obra" maxHeight={620} tom={T.red} />;
  if (dado.length === 0) return <CartaoEstado texto="Nenhuma restrição cadastrada para esta obra" maxHeight={620} />;

  const abertas = dado.filter(r => (r.status_cadastro_label || '').toLowerCase().includes('abert')).length;
  const altas = dado.filter(r => (r.criticidade || '').trim().toLowerCase() === 'alta').length;

  return (
    <div className="painel-gutter" style={{ flex:1, minHeight:0, display:'flex', flexDirection:'column', gap:14 }}>
      <div className="kpi-row cols-3">
        <Balao titulo="Restrições" cor={T.ink} bg="rgba(37,99,235,0.05)" borda="rgba(37,99,235,0.1)" valor={dado.length} />
        <Balao titulo="Abertas" cor={T.amber} bg="rgba(217,145,26,0.06)" borda="rgba(217,145,26,0.12)" valor={abertas} />
        <Balao titulo="Criticidade Alta" cor={T.red} bg="rgba(210,59,59,0.06)" borda="rgba(210,59,59,0.12)" valor={altas} />
      </div>

      <div style={{ display:'flex', alignItems:'center', gap:10, flexShrink:0 }}>
        <input type="text" value={busca} onChange={e => setBusca(e.target.value)}
          placeholder="Buscar por descrição, tarefa, responsável, tipo..."
          style={{ flex:1, boxSizing:'border-box', fontFamily:"'IBM Plex Sans', sans-serif", fontSize:12.5, padding:'9px 12px', border:'1px solid var(--line)', borderRadius:8, outline:'none', color:T.ink, background:'#fff' }} />
        {busca && (
          <span className="mono" style={{ fontSize:11, color:T.mut, whiteSpace:'nowrap' }}>{restricoes.length} de {dado.length}</span>
        )}
      </div>

      <div className="card" style={{ flex:1, minHeight:0, borderRadius:14, overflow:'hidden', display:'flex', flexDirection:'column', padding:0 }}>
        <div className="table-scroll-x" style={{ overflow:'auto', flex:1 }}>
          <table style={{ width:'100%', textAlign:'left', borderCollapse:'collapse' }}>
            <thead style={{ position:'sticky', top:0, zIndex:2, background:'#fff' }}>
              <tr className="mono" style={{ fontSize:10, textTransform:'uppercase', letterSpacing:'0.1em', color:T.mut, fontWeight:600 }}>
                {COLUNAS_RESTRICOES.map(col => {
                  const ativo = ordenarPor === col.campo;
                  return (
                    <th key={col.campo} onClick={() => alternarOrdenacao(col.campo)} title="Ordenar por esta coluna"
                      style={{ padding:'10px 14px', textAlign:col.align || 'left', cursor:'pointer', userSelect:'none', color: ativo ? T.blue : undefined, borderBottom:'1px solid var(--line)' }}>
                      {col.label}{ativo ? (ordenarDir === 'asc' ? ' ▲' : ' ▼') : ''}
                    </th>
                  );
                })}
              </tr>
            </thead>
            <tbody>
              {restricoes.length === 0 && (
                <tr><td colSpan={COLUNAS_RESTRICOES.length} style={{ padding:24, textAlign:'center', fontSize:12, color:T.mut }}>Nenhuma restrição encontrada para a busca</td></tr>
              )}
              {restricoes.map(r => {
                const cc = corCriticidade(r.criticidade);
                const cs = corStatusRestricao(r.status_cadastro_label);
                return (
                  <tr key={r.id} style={{ borderBottom:'1px solid var(--line)' }}>
                    <td style={{ padding:'10px 14px' }}><BadgePill texto={r.criticidade} cor={cc.cor} bg={cc.bg} /></td>
                    <td style={{ padding:'10px 14px' }}><BadgePill texto={r.status_cadastro_label} cor={cs.cor} bg={cs.bg} /></td>
                    <td style={{ padding:'10px 14px', fontSize:12.5, color:T.body, maxWidth:220 }}>{r.nome_eap || '—'}</td>
                    <td style={{ padding:'10px 14px', fontSize:12.5, color:T.ink, maxWidth:380, lineHeight:1.4 }}>{r.descricao || '—'}</td>
                    <td style={{ padding:'10px 14px', fontSize:12, color:T.body }}>{r.nome_tipo_restricao || '—'}</td>
                    <td style={{ padding:'10px 14px', fontSize:12, color:T.body }}>{r.responsabilidade || '—'}</td>
                    <td style={{ padding:'10px 14px', fontSize:12, color:T.body }}>{nomeUsuarioCadastro(r.usuario_cadastro) || '—'}</td>
                    <td className="mono" style={{ padding:'10px 14px', textAlign:'right', fontSize:12, color:T.body }}>{r.data_inicio_formatada || '—'}</td>
                    <td className="mono" style={{ padding:'10px 14px', textAlign:'right', fontSize:12, color:T.body }}>{r.data_conclusao_formatada || '—'}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ── Setor 5 — OC/CO, direto de `orcamentos_complementares_obra` ────────────
// 1 linha por obra (`id_obra`), mesmo padrão de `restricoes_obra` — `ocs`
// (jsonb, array de Ordens de Compra/Orçamentos Complementares — no domínio
// da MSE são a MESMA coisa, confirmado pelo usuário 2026-08-11, não 2 fontes
// separadas) e `resumo` (jsonb, totais financeiros vindos prontos da API do
// PortalMSE, embrulhados em `{time,obra_id,data:{...}}` — ver
// `painel-mse\n8n\README.md`). Ingestão pode gravar obras fora do array
// `OBRAS` (ex.: CNPEM - Auditório, id 103) — o filtro por `id_obra=eq.` já
// resolve isso aqui, nunca aparece nada de outra obra.
function corStatusOc(status){
  const s = (status || '').trim().toLowerCase();
  if (s.includes('aprovad')) return { cor:T.green, bg:'rgba(31,157,87,0.13)' };
  if (s.includes('reprovad') || s.includes('cancelad')) return { cor:T.red, bg:'rgba(210,59,59,0.13)' };
  if (s.includes('análise') || s.includes('analise') || s.includes('elaboraç') || s.includes('elaborac') || s.includes('stand-by') || s.includes('standby')) return { cor:T.amber, bg:'rgba(217,145,26,0.13)' };
  return { cor:T.mut, bg:'#eef0f3' };
}
// Domínio de `status_execucao` também não é fechado (mesmo raciocínio de
// `corStatusOc`/`corStatusRestricao`) — casa por substring.
function corExecucaoOc(exec){
  const s = (exec || '').trim().toLowerCase();
  if (s === 'executado') return { cor:T.green, bg:'rgba(31,157,87,0.13)' };
  if (s.includes('em execu')) return { cor:T.amber, bg:'rgba(217,145,26,0.13)' };
  if (s.includes('não') || s.includes('nao')) return { cor:T.mut, bg:'#eef0f3' };
  return { cor:T.mut, bg:'#eef0f3' };
}
// "0000-00-00" é o placeholder de "sem data" que vem de alguns registros
// antigos dessa API (não é ISO válido) — sem esse guard, `parseDataFlexivel`
// não retorna null pra ele (o quirk de "ano 2 dígitos" do JS Date faz
// `new Date(0,-1,0)` virar uma data de 1899 válida, não NaN) e a tela
// mostraria uma data fabricada em vez de "—".
function fmtDataOc(raw){
  if (!raw || /^0{4}-0{2}-0{2}/.test(String(raw))) return '—';
  return fmtDataLonga(raw);
}
const COLUNAS_OC = [
  { label:'Nº',          campo:'numero' },
  { label:'Descrição',   campo:'descricao' },
  { label:'Status',      campo:'status' },
  { label:'Valor Final', campo:'valor',      align:'right' },
  { label:'Responsável', campo:'responsavel' },
  { label:'Execução',    campo:'execucao' },
];

function ModuloOcCo({ obraId, obraNome }){
  const [dado, setDado] = useState(null);
  const [resumo, setResumo] = useState(null);
  const [erro, setErro] = useState(false);
  const [busca, setBusca] = useState('');
  const [ordenarPor, setOrdenarPor] = useState('valor');
  const [ordenarDir, setOrdenarDir] = useState('desc');
  const [detalhe, setDetalhe] = useState(null);
  const [aprovadoAberto, setAprovadoAberto] = useState(false);
  // Filtro por status (pedido explícito: "ao clicar no botão do status,
  // poderia filtrar pelo status correspondente") — clique no badge da
  // tabela liga/desliga (clicar de novo no mesmo status limpa). Só 1 valor
  // ativo por vez, mais simples que os chips removidos antes nesta mesma
  // sessão (o usuário pediu pra tirar aquela UI de facetas) — aqui o
  // "controle" é o próprio dado já visível na tabela, sem fileira extra.
  const [filtroStatus, setFiltroStatus] = useState(null);
  const toggleFiltroStatus = (status) => setFiltroStatus(prev => prev === status ? null : status);

  useEffect(() => {
    setDado(null); setResumo(null); setErro(false); setBusca('');
    setOrdenarPor('valor'); setOrdenarDir('desc'); setDetalhe(null); setAprovadoAberto(false);
    setFiltroStatus(null);
    const headers = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };
    fetch(`${SUPABASE_URL}/rest/v1/orcamentos_complementares_obra?id_obra=eq.${obraId}&select=ocs,resumo,total,atualizado_em`, { headers })
      .then(r => r.ok ? r.json() : null)
      .then(rows => {
        if (rows === null) { setErro(true); setDado([]); return; }
        setDado(Array.isArray(rows[0]?.ocs) ? rows[0].ocs : []);
        setResumo(rows[0]?.resumo?.data ?? null);
      })
      .catch(() => { setErro(true); setDado([]); });
  }, [obraId]);

  const alternarOrdenacao = (campo) => {
    if (ordenarPor === campo) setOrdenarDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setOrdenarPor(campo); setOrdenarDir(campo === 'descricao' || campo === 'responsavel' ? 'asc' : 'desc'); }
  };

  const filtradas = useMemo(() => {
    if (!dado) return null;
    const alvo = normalizarNomeParaMatch(busca);
    return dado.filter(oc => {
      // Suprimir OCs com status "Cancelada" ou "Cancelado"
      const statusNormalizado = (oc.status_oc || '').toLowerCase().trim();
      if (statusNormalizado === 'cancelada' || statusNormalizado === 'cancelado') return false;
      if (filtroStatus && (oc.status_oc || '—') !== filtroStatus) return false;
      if (!alvo) return true;
      return [oc.descricao, oc.numero_oc_formatado, oc.responsavel_mse, oc.status_oc, oc.observacao]
        .some(campo => normalizarNomeParaMatch(campo).includes(alvo));
    });
  }, [dado, busca, filtroStatus]);

  const ocsOrdenadas = useMemo(() => {
    if (!filtradas) return null;
    const arr = filtradas.slice();
    const dir = ordenarDir === 'asc' ? 1 : -1;
    const valorDe = (oc) => {
      switch (ordenarPor) {
        case 'numero': return Number(oc.numero_oc) || 0;
        case 'descricao': return (oc.descricao || '').toLowerCase();
        case 'status': return (oc.status_oc || '').toLowerCase();
        case 'valor': { const v = parseValNum(oc.valor_final); return v == null ? -Infinity : v; }
        case 'responsavel': return (oc.responsavel_mse || '').toLowerCase();
        case 'execucao': return (oc.status_execucao || '').toLowerCase();
        default: return 0;
      }
    };
    arr.sort((a, b) => {
      const va = valorDe(a), vb = valorDe(b);
      return va < vb ? -1 * dir : va > vb ? 1 * dir : 0;
    });
    return arr;
  }, [filtradas, ordenarPor, ordenarDir]);

  // `credito`/`debito` do resumo podem vir negativos (dado real: obra com
  // muita OC "crédito" pode zerar/inverter o saldo) — `fmtReais` cru deixa
  // o toLocaleString por conta própria, que às vezes quebra o "-" isolado
  // numa linha (achado no teste: balão "Crédito" com "-" sozinho em cima
  // de "R$ 19.692.303,38"). Formato contábil (parênteses) evita esse ponto
  // de quebra e é convenção padrão pra negativo em valor financeiro.
  const fmtReaisResumo = (v) => v == null ? 'sem dado' : (v < 0 ? `(${fmtReais(-v)})` : fmtReais(v));

  if (dado === null) return <CartaoEstado texto="Carregando Orçamentos Complementares…" maxHeight={620} />;
  if (erro) return <CartaoEstado texto="Erro ao carregar orcamentos_complementares_obra" maxHeight={620} tom={T.red} />;
  if (dado.length === 0) return <CartaoEstado texto="Nenhuma OC/Orçamento Complementar cadastrado para esta obra" maxHeight={620} />;

  return (
    <div className="painel-gutter" style={{ flex:1, minHeight:0, display:'flex', flexDirection:'column', gap:14 }}>
      <div className="kpi-row cols-4">
        <Balao titulo="Total de OCs" cor={T.ink} bg="rgba(37,99,235,0.05)" borda="rgba(37,99,235,0.1)" valor={resumo?.total_ocs ?? dado.length} />
        <Balao titulo="Aprovado" cor={T.green} bg="rgba(31,157,87,0.06)" borda="rgba(31,157,87,0.15)" valor={fmtReaisResumo(resumo?.aprovado)}
          onClick={resumo ? () => setAprovadoAberto(true) : undefined} />
        <Balao titulo="Em Elaboração" cor={T.amber} bg="rgba(217,145,26,0.06)" borda="rgba(217,145,26,0.12)" valor={fmtReaisResumo(resumo?.elaboracao)} />
        <Balao titulo="Em Análise" cor={T.amber} bg="rgba(217,145,26,0.06)" borda="rgba(217,145,26,0.12)" valor={fmtReaisResumo(resumo?.analise)} />
      </div>

      <div style={{ display:'flex', alignItems:'center', gap:10, flexShrink:0 }}>
        <input type="text" value={busca} onChange={e => setBusca(e.target.value)}
          placeholder="Buscar por descrição, número, responsável, status..."
          style={{ flex:1, boxSizing:'border-box', fontFamily:"'IBM Plex Sans', sans-serif", fontSize:12.5, padding:'9px 12px', border:'1px solid var(--line)', borderRadius:8, outline:'none', color:T.ink, background:'#fff' }} />
        {(busca || filtroStatus) && (
          <span className="mono" style={{ fontSize:11, color:T.mut, whiteSpace:'nowrap' }}>{ocsOrdenadas.length} de {dado.length}</span>
        )}
        {filtroStatus && (
          <button onClick={() => setFiltroStatus(null)} className="mono"
            style={{ fontSize:11, color:T.blue, background:'none', border:'none', cursor:'pointer', whiteSpace:'nowrap', padding:0 }}>
            Status: {filtroStatus} ✕
          </button>
        )}
      </div>

      <div className="card" style={{ flex:1, minHeight:0, borderRadius:14, overflow:'hidden', display:'flex', flexDirection:'column', padding:0 }}>
        <div className="table-scroll-x" style={{ overflow:'auto', flex:1 }}>
          <table style={{ width:'100%', textAlign:'left', borderCollapse:'collapse' }}>
            <thead style={{ position:'sticky', top:0, zIndex:2, background:'#fff' }}>
              <tr className="mono" style={{ fontSize:10, textTransform:'uppercase', letterSpacing:'0.1em', color:T.mut, fontWeight:600 }}>
                {COLUNAS_OC.map(col => {
                  const ativo = ordenarPor === col.campo;
                  return (
                    <th key={col.campo} onClick={() => alternarOrdenacao(col.campo)} title="Ordenar por esta coluna"
                      style={{ padding:'10px 14px', textAlign:col.align || 'left', cursor:'pointer', userSelect:'none', color: ativo ? T.blue : undefined, borderBottom:'1px solid var(--line)' }}>
                      {col.label}{ativo ? (ordenarDir === 'asc' ? ' ▲' : ' ▼') : ''}
                    </th>
                  );
                })}
              </tr>
            </thead>
            <tbody>
              {ocsOrdenadas.length === 0 && (
                <tr><td colSpan={COLUNAS_OC.length} style={{ padding:24, textAlign:'center', fontSize:12, color:T.mut }}>Nenhuma OC encontrada com a busca/filtro atuais</td></tr>
              )}
              {ocsOrdenadas.map(oc => {
                const cs = corStatusOc(oc.status_oc);
                return (
                  <tr key={oc.id} className="hoverable" onClick={() => setDetalhe(oc)} style={{ borderBottom:'1px solid var(--line)', cursor:'pointer' }}>
                    <td className="mono" style={{ padding:'10px 14px', fontSize:12, color:T.ink }}>{oc.numero_oc_formatado || '—'}</td>
                    <td style={{ padding:'10px 14px', fontSize:12.5, color:T.ink, maxWidth:380, lineHeight:1.4 }}>{oc.descricao || '—'}</td>
                    <td style={{ padding:'10px 14px' }}>
                      <BadgePill texto={oc.status_oc} cor={cs.cor} bg={cs.bg}
                        ativo={filtroStatus === (oc.status_oc || '—')}
                        onClick={e => { e.stopPropagation(); toggleFiltroStatus(oc.status_oc || '—'); }} />
                    </td>
                    <td className="mono" style={{ padding:'10px 14px', textAlign:'right', fontSize:12, color:T.ink, fontVariantNumeric:'tabular-nums' }}>{fmtReais(parseValNum(oc.valor_final))}</td>
                    <td style={{ padding:'10px 14px', fontSize:12, color:T.body }}>{oc.responsavel_mse || '—'}</td>
                    <td style={{ padding:'10px 14px', fontSize:12, fontWeight:600, color: corExecucaoOc(oc.status_execucao).cor }}>{oc.status_execucao || '—'}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      {aprovadoAberto && resumo && (
        <div onClick={() => setAprovadoAberto(false)} className="modal-overlay-in" style={{ position:'fixed', inset:0, zIndex:10001, background:'rgba(16,24,40,0.45)', backdropFilter:'blur(3px)', display:'flex', alignItems:'center', justifyContent:'center', padding:24 }}>
          <div onClick={e => e.stopPropagation()} className="modal-card-in" style={{ background:'#fff', border:'1px solid #e4e7ec', borderRadius:16, width:'100%', maxWidth:440, maxHeight:'68vh', display:'flex', flexDirection:'column', overflow:'hidden', boxShadow:'0 24px 60px -12px rgba(16,24,40,0.25)' }}>
            <div style={{ padding:'14px 20px', borderBottom:'1px solid #eef0f3', display:'flex', alignItems:'center', gap:12, flexShrink:0 }}>
              <div style={{ flex:1, minWidth:0 }}>
                <div className="mono" style={{ fontSize:10, letterSpacing:'0.16em', color:T.mut2, textTransform:'uppercase', fontWeight:600, marginBottom:4 }}>Detalhamento</div>
                <div style={{ fontSize:15, fontWeight:700, color:T.ink }}>Aprovado — {obraNome}</div>
              </div>
              <button onClick={() => setAprovadoAberto(false)} style={{ background:'#eef0f3', border:'none', color:T.mut, borderRadius:10, padding:'7px 12px', cursor:'pointer', fontSize:15, lineHeight:1, flexShrink:0 }}>✕</button>
            </div>
            <div style={{ overflowY:'auto', flex:1, minHeight:0, padding:'6px 20px 20px' }}>
              {/* Diferente do popup "Valor Contrato"/"Valor Medido" de
                  Medições, aqui NÃO existe uma linha de total somando
                  Débito+Crédito no fim — conferi nos dados reais das 7
                  obras e Débito+Crédito bate exato é com "Saldo" (que foi
                  suprimido da tela a pedido), não com "Aprovado". Mostrar
                  os 2 como se somassem ao valor do balão seria inventar
                  uma relação que os dados não confirmam (ADR-005) — ficam
                  só como contexto adicional do mesmo resumo financeiro. */}
              <div style={{ display:'flex', justifyContent:'space-between', padding:'9px 0', borderBottom:'1px solid #eef0f3', fontSize:13, color:T.body }}>
                <span>Débito</span>
                <span className="mono" style={{ fontWeight:600, color:T.ink }}>{fmtReaisResumo(resumo?.debito)}</span>
              </div>
              <div style={{ display:'flex', justifyContent:'space-between', padding:'9px 0', borderBottom:'1px solid #eef0f3', fontSize:13, color:T.body }}>
                <span>Crédito</span>
                <span className="mono" style={{ fontWeight:600, color:T.ink }}>{fmtReaisResumo(resumo?.credito)}</span>
              </div>
              <div style={{ display:'flex', justifyContent:'space-between', padding:'12px 0 0', fontSize:14, color:T.ink, fontWeight:700 }}>
                <span>Aprovado</span>
                <span className="mono">{fmtReaisResumo(resumo?.aprovado)}</span>
              </div>
              <div className="mono" style={{ marginTop:14, fontSize:10.5, color:T.mut2, lineHeight:1.5 }}>
                Débito e Crédito vêm prontos da API do PortalMSE — não são
                necessariamente a composição exata do valor Aprovado acima.
              </div>
            </div>
          </div>
        </div>
      )}

      {detalhe && (
        <div onClick={() => setDetalhe(null)} className="modal-overlay-in" style={{ position:'fixed', inset:0, zIndex:10001, background:'rgba(16,24,40,0.45)', backdropFilter:'blur(3px)', display:'flex', alignItems:'center', justifyContent:'center', padding:24 }}>
          <div onClick={e => e.stopPropagation()} className="modal-card-in" style={{ background:'#fff', border:'1px solid #e4e7ec', borderRadius:16, width:'100%', maxWidth:520, maxHeight:'78vh', display:'flex', flexDirection:'column', overflow:'hidden', boxShadow:'0 24px 60px -12px rgba(16,24,40,0.25)' }}>
            <div style={{ padding:'14px 20px', borderBottom:'1px solid #eef0f3', display:'flex', alignItems:'center', gap:12, flexShrink:0 }}>
              <div style={{ flex:1, minWidth:0 }}>
                <div className="mono" style={{ fontSize:10, letterSpacing:'0.16em', color:T.mut2, textTransform:'uppercase', fontWeight:600, marginBottom:4 }}>{detalhe.numero_oc_formatado || '—'} — {obraNome}</div>
                <div style={{ fontSize:15, fontWeight:700, color:T.ink }}>{detalhe.descricao || '—'}</div>
              </div>
              <button onClick={() => setDetalhe(null)} style={{ background:'#eef0f3', border:'none', color:T.mut, borderRadius:10, padding:'7px 12px', cursor:'pointer', fontSize:15, lineHeight:1, flexShrink:0 }}>✕</button>
            </div>
            <div style={{ overflowY:'auto', flex:1, minHeight:0, padding:'6px 20px 20px' }}>
              {[
                ['Status', <BadgePill texto={detalhe.status_oc} cor={corStatusOc(detalhe.status_oc).cor} bg={corStatusOc(detalhe.status_oc).bg} />],
                ['Execução', detalhe.status_execucao || '—'],
                ['Material', detalhe.material_comprado || '—'],
                ['Responsável MSE', detalhe.responsavel_mse || '—'],
                ['Crédito/Débito', detalhe.credito_debito || '—'],
                ['Solicitado pelo cliente', detalhe.solicitado_cliente || '—'],
                ['Interesse no contrato original', detalhe.interesse_contrato_original || '—'],
                ['Data início', fmtDataOc(detalhe.data_inicio)],
                ['Validade da OC', fmtDataOc(detalhe.validade_oc)],
                ['Data revisão', fmtDataOc(detalhe.data_revisao)],
                ['Enviado à medição', detalhe.enviado_medicao || '—'],
              ].map(([label, valor], i) => (
                <div key={i} style={{ display:'flex', justifyContent:'space-between', gap:16, padding:'9px 0', borderBottom:'1px solid #eef0f3', fontSize:13, color:T.body }}>
                  <span>{label}</span>
                  <span className="mono" style={{ fontWeight:600, color:T.ink, textAlign:'right' }}>{valor}</span>
                </div>
              ))}
              {['Valor Material', 'Valor Serviços', 'Valor FD'].map((label, i) => {
                const campo = ['valor_material', 'valor_servicos', 'valor_fd'][i];
                const v = parseValNum(detalhe[campo]);
                return v != null ? (
                  <div key={campo} style={{ display:'flex', justifyContent:'space-between', padding:'9px 0', borderBottom:'1px solid #eef0f3', fontSize:13, color:T.body }}>
                    <span>{label}</span>
                    <span className="mono" style={{ fontWeight:600, color:T.ink }}>{fmtReais(v)}</span>
                  </div>
                ) : null;
              })}
              <div style={{ display:'flex', justifyContent:'space-between', padding:'12px 0 0', fontSize:14, color:T.ink, fontWeight:700 }}>
                <span>Valor Final</span>
                <span className="mono">{fmtReais(parseValNum(detalhe.valor_final))}</span>
              </div>
              {detalhe.observacao && (
                <div style={{ marginTop:14, padding:'10px 12px', borderRadius:8, background:'#f7f8fa', fontSize:12.5, color:T.body, lineHeight:1.5 }}>
                  {detalhe.observacao}
                </div>
              )}
              <div className="mono" style={{ marginTop:12, fontSize:10.5, color:T.mut2 }}>
                Cadastrado por {detalhe.usuario_cadastro || '—'} em {fmtDataOc(detalhe.data_cadastro)}
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Setor 4 — Suprimentos, direto de `itens_rmi` (fonte: `rmi_api` do
// PortalMSE, ver [[07 - Modelo de Dados]] e `n8n/rmi-suprimentos.README.md`)
// — pedido explícito (2026-08-21): "a partir da table itens RMI iremos
// basear a tela de suprimentos... a ideia é fazer um acompanhamento
// gerencial dos itens críticos, os críticos serão, por hora, os itens
// Curva A". Refinado no mesmo dia: "no CNPEM o item de custo com efetivo
// não precisa aparecer... observe no nível de material, é isso que
// precisamos exibir, os materiais críticos, orientados por área e
// disciplina" — o crítico deixou de ser a DISCIPLINA inteira (Estrutura
// Metálica, HVAC...) e passou a ser o MATERIAL (item-folha de verdade),
// com disciplina/área como colunas de contexto, não mais o próprio grão
// da Curva A.
//
// **Disciplina** — mesmo conceito de "item macro" já validado (ver
// baixo): o ramo mais raso da árvore que já representa uma categoria de
// verdade, resolvido por RAMO (não por nível fixo, varia por RMI).
//
// **Área** — física/zona (UB, SP, "Instalações Nível 614"...). Pedido
// em 2026-08-21 (mesmo dia): "precisa estar organizado em níveis, Área
// -> Disciplina -> Material" — área virou um CAMPO PRÓPRIO em todo
// material (não mais sufixo no nome da disciplina, como na versão
// anterior). Ela pode vir de 2 lugares na árvore, dependendo do RMI
// (achado comparando obra 91 × CNPEM Faseado):
//   - ABAIXO da disciplina (CNPEM: disciplina "HVAC", área "Instalações
//     Nível 614") — pega o nome do nó exatamente 1 nível abaixo da
//     disciplina, não importa quantas camadas existam depois disso
//     (sistema/circuito etc.).
//   - ACIMA da disciplina (obra 91: "MATERIAIS - UB"/"MATERIAIS - SP" é
//     o nível que a resolução de disciplina descarta como "balde" pra
//     achar a disciplina real) — extrai o texto depois de "MATERIAIS -"
//     (`AREA_HERDADA_MATERIAIS_RMI`) como área herdada de todos os
//     materiais daquele ramo.
// Se nenhuma das duas existir, área fica `null` (material é filho
// direto da disciplina, sem camada de zona identificável).
//
// **Material** — não é um nível fixo (varia até dentro do mesmo ramo,
// ex. RMI 41/obra 91 tem material genuíno tanto em nível 3 quanto 4).
// `ehMaterialRmi` usa 2 sinais, não nível:
//   1. `unidade` populada e não é `SERV` (mão de obra) nem `VB`/`VERBA`
//      (verba/lump-sum, geralmente RH) — cobre a maioria dos casos.
//   2. Descrição não bate um item que É serviço/administrativo mas
//      escapou do filtro de unidade (ex. "TESTES E MEDIÇÕES", "OMISSOS",
//      "Comissionamento e testes" vêm com unidade "UN", igual material
//      de verdade) — `PALAVRAS_NAO_MATERIAL_RMI`.
// Evita contar 2x quando um nó com valor real (ex. "Estrutura média",
// 2,46M) tem um filho-complemento zerado com a mesma unidade (visto na
// obra 91): só desce pro filho se ELE também tiver valor > 0; senão o
// próprio nó de valor real já é o material.
//
// **Consolidação** — pedido no mesmo dia: "necessidade de compilar
// materiais similares em uma coisa só". A mesma descrição de material
// pode aparecer em mais de 1 ramo dentro da MESMA área+disciplina (ex.
// "Bullet AXIS P1465-LE" 3x no CNPEM, cada ocorrência uma câmera
// física diferente do mesmo modelo). `consolidarMateriaisSemelhantes`
// soma o valor (e saldo orçamentário) de materiais com a mesma
// descrição normalizada DENTRO do mesmo par área+disciplina — não
// consolida entre áreas/disciplinas diferentes (perderia a orientação
// que é o objetivo da tela) nem tenta casar descrições parecidas-mas-
// diferentes (ex. tubulação DN 14" e DN 12" continuam linhas
// separadas — são especificações diferentes, não duplicata).
//
// Curva A = ordena os MATERIAIS (já consolidados) por valor decrescente,
// acumula, marca crítico todo item até o acumulado (antes de somar
// aquele item) ainda não ter cruzado 80% do total. A tabela exibe o
// resultado agrupado em árvore Área → Disciplina → Material (não mais
// lista plana) — cada nível ordenado pelo próprio valor total
// decrescente, preservando a noção de "o que pesa mais primeiro"
// mesmo dentro do agrupamento.
const EH_BALDE_ADMINISTRATIVO_RMI = /^(MATERIAIS\s*-|CHANGE ORDER\b|OC\s*-|CO\s+\d)/;
const AREA_HERDADA_MATERIAIS_RMI = /^MATERIAIS\s*-\s*(.+)$/;
const PALAVRAS_NAO_MATERIAL_RMI = [
  'TESTES', 'COMISSIONAMENTO', 'OMISSOS', 'ENSAIO', 'GERENCIAMENTO',
  'SUPERVISAO', 'ADMINISTRACAO', 'TREINAMENTO',
];
function codigoPaiRmi(codigoSeq){
  if (!codigoSeq) return null;
  const partes = String(codigoSeq).split('.');
  if (partes.length < 2) return null; // já é raiz, sem pai
  return partes.slice(0, -1).join('.');
}
// Resolve a disciplina de cada ramo (nível 0 ou nível 1, ver comentário
// acima) e devolve também a área HERDADA de cima, quando o pai
// descartado como "balde" for reconhecidamente um código de área
// (`MATERIAIS - X`) — outros baldes (CHANGE ORDER, OC -, CO N) não
// carregam informação de área, ficam sem área herdada mesmo.
function resolverDisciplinasRmi(itensNivel0, itensNivel1){
  const porChaveNivel0 = new Map();
  itensNivel0.forEach(r => porChaveNivel0.set(`${r.raw.id_rmi}::${r.raw.codigo_seq}`, r));

  const nivel0Resolvidos = new Set();

  filhosPorPai.forEach((filhos, chave) => {
    const pai = porChaveNivel0.get(chave);

    const chave = `${r.raw.id_rmi}::${r.raw.codigo_seq}`;
    if (!nivel0Resolvidos.has(chave)) disciplinas.push({ item: r, nome: r.raw.descricao, areaHerdada: null }); // nível 0 sem filho — fica ele mesmo

}

// ganharem uma descrição mais curta em vez da ficha técnica inteira).
//

//   1. `" - "` (espaço-traço-espaço) — nome-base × especificação

//      acima, mas o corte continua valendo pra quem não bate).
//   2. `,` que NÃO esteja colada a dígito nos 2 lados — nome-base ×

//      Schindler, com capacidade..." → "Elevador Linha 3300 Atlas

// SEM espaço ao redor (`380-220V`, `CS 600X250`, `W310X38.7`) e vírgula

function agruparPorAreaDisciplina(materiaisCriticos){
  const porArea = new Map();
  materiaisCriticos.forEach(m => {
    if (!porArea.has(m.area)) porArea.set(m.area, new Map());
    const porDisciplina = porArea.get(m.area);
    if (!porDisciplina.has(m.disciplina)) porDisciplina.set(m.disciplina, []);
    porDisciplina.get(m.disciplina).push(m);
  });
  const areas = Array.from(porArea.entries()).map(([area, porDisciplina]) => {
    const disciplinas = Array.from(porDisciplina.entries()).map(([disciplina, materiais]) => {
      const materiaisOrdenados = [...materiais].sort((a, b) => b.valor - a.valor);
      return { disciplina, valor: soma(materiaisOrdenados, 'valor') || 0, ...farolAgregado(materiaisOrdenados), materiais: materiaisOrdenados };

    const valorArea = disciplinas.reduce((s, d) => s + d.valor, 0);

    return { area, valor: valorArea, ...farolAgregado(todosMateriaisArea), disciplinas };
