  /* Grid de widgets do setor Medições (react-grid-layout). A folha de
     estilo da lib NÃO é carregada — estas regras são a versão enxuta
     equivalente, no visual do painel. As essenciais são: `position:
     relative` no container (os itens são absolutos, posicionados por
     `transform` inline pela própria lib) e uma área clicável nas alças
     de resize (sem tamanho, não há o que agarrar). */
  .react-grid-layout { position: relative; transition: height 200ms ease; }
  .react-grid-item { transition: transform 200ms ease, width 200ms ease, height 200ms ease; }
  .react-grid-item.resizing,
  .react-grid-item.react-draggable-dragging { transition: none; z-index: 4; }
  .react-grid-item.react-draggable-dragging > .card { box-shadow: 0 20px 44px -10px rgba(16,24,40,.34); }
  /* Sombra do "slot" de destino durante o arrasto — é o feedback que faz
     o grid parecer vivo (a peça abre espaço antes de você soltar). */
  .react-grid-item.react-grid-placeholder {
    background: var(--blue); opacity: .14; border-radius: 14px;
    transition-duration: 110ms; z-index: 2; user-select: none;
  }
  .react-grid-item > .react-resizable-handle {
    position: absolute; opacity: 0; transition: opacity .15s ease; z-index: 3;
  }
  .react-grid-item:hover > .react-resizable-handle,
  .react-grid-item.resizing > .react-resizable-handle { opacity: 1; }
  /* As 8 alças (pedido explícito, 2026-08-19: "só consigo ajustar o
     tamanho para baixo ou para o lado direito"). Cantos = "L" desenhado
     com 2 bordas apontando pra fora; laterais = barrinha no meio do lado.
     Os cantos são 12px e recuados 3px de propósito: o "✕" do cabeçalho
     começa depois disso (padding-right 18px), senão a alça do canto
     nordeste roubaria o clique do botão de ocultar. */
  .react-grid-item > .react-resizable-handle-se {
    right: 3px; bottom: 3px; width: 12px; height: 12px; cursor: nwse-resize;
    border-right: 2px solid var(--mut); border-bottom: 2px solid var(--mut);
    border-bottom-right-radius: 5px;
  }
  .react-grid-item > .react-resizable-handle-sw {
    left: 3px; bottom: 3px; width: 12px; height: 12px; cursor: nesw-resize;
    border-left: 2px solid var(--mut); border-bottom: 2px solid var(--mut);
    border-bottom-left-radius: 5px;
  }
  .react-grid-item > .react-resizable-handle-ne {
    right: 3px; top: 3px; width: 12px; height: 12px; cursor: nesw-resize;
    border-right: 2px solid var(--mut); border-top: 2px solid var(--mut);
    border-top-right-radius: 5px;

  .react-grid-item > .react-resizable-handle-nw {

    border-left: 2px solid var(--mut); border-top: 2px solid var(--mut);
    border-top-left-radius: 5px;
  }
  .react-grid-item > .react-resizable-handle-e {
    right: 1px; top: 50%; margin-top: -20px; width: 9px; height: 40px; cursor: ew-resize;
    border-right: 3px solid var(--mut2); border-radius: 3px;
  }
  .react-grid-item > .react-resizable-handle-w {
    left: 1px; top: 50%; margin-top: -20px; width: 9px; height: 40px; cursor: ew-resize;
    border-left: 3px solid var(--mut2); border-radius: 3px;
  }
  .react-grid-item > .react-resizable-handle-s {
    bottom: 1px; left: 50%; margin-left: -20px; width: 40px; height: 9px; cursor: ns-resize;

  }

    top: 1px; left: 50%; margin-left: -20px; width: 40px; height: 9px; cursor: ns-resize;

function parseValNum(v){

function soma(lista, campo){

// Agrupa variações do mesmo local (ex.: "614,00"/"614cx"/"614cx - 12-13"/
// "614 - 9-36" → "614"; "NÍVEL 2 - ÁREA DE PRODUÇÃO"/"NÍVEL 2 - PISO
// INTERMEDIÁRIO" → "NÍVEL 2") — pedido do usuário depois de ver a tela de
// Desvios com locais demais no CNPEM. Regra: começa com dígito → pega só a
// sequência de dígitos (ignora sufixo "cx"/",00"/faixa de eixo); senão, corta
// no primeiro " - " (cobre o padrão "NÍVEL N - <detalhe>"); sem nenhum dos
// dois, usa a string inteira (item fica no próprio grupo).
// Ordena por EDT "de verdade" (numérico por segmento — "1.5.7.2.3.10" depois
// de "1.5.7.2.3.9", não antes, como daria a ordenação alfabética de string).
// Segmento não numérico (EDT malformado na fonte, já catalogado em
// [[projeto-painel-mse]]) cai pro fim, sem travar a ordenação dos demais.
function compararEdt(a, b){
  const pa = (a || '').split('.').map(Number);
  const pb = (b || '').split('.').map(Number);
  const len = Math.max(pa.length, pb.length);
  for (let i = 0; i < len; i++) {
    let va = pa[i]; let vb = pb[i];
    if (va === undefined) va = -1;
    if (vb === undefined) vb = -1;
    if (Number.isNaN(va)) va = Infinity;
    if (Number.isNaN(vb)) vb = Infinity;
    if (va !== vb) return va - vb;
  }
  return 0;
}

function grupoLocal(local){
  const s = (local ?? '').toString().trim();
  if (!s) return '(Sem local)';
  const digitos = s.match(/^(\d+)/);
  if (digitos) return digitos[1];
  const i = s.indexOf(' - ');
  return i > 0 ? s.slice(0, i).trim() : s;
}

function parseDataFlexivel(s){
  if (!s) return null;
  const str = String(s).slice(0, 10);
  if (str.includes('/')) {
    const [d, m, a] = str.split('/');
    const ano = a.length === 2 ? '20' + a : a;
    return new Date(Number(ano), Number(m) - 1, Number(d));
  }
  if (str.includes('-')) {
    const [a, m, d] = str.split('-');
    return new Date(Number(a), Number(m) - 1, Number(d));
  }
  return null;
}

function fmtDataCurta(d){

  return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`;
}

// curva_avanco_historico mantém linhas futuras repetindo o último realizado
// observado, com o previsto seguindo em frente (a curva ficou "parada" mas a
// tabela não para de crescer) — pegar a última linha por data daria um desvio
// calculado contra uma semana que nunca foi de fato medida. Este helper acha
// a última linha em que `campo` realmente mudou de valor: é aí que a medição
// real parou, mesmo que a tabela continue depois disso.
function ultimaLinhaComMudanca(rows, campo){
  let ultima = null;
  let anterior;
  for (const r of rows) {
    const v = r[campo];
    if (v == null) continue;
    if (anterior === undefined || v !== anterior) ultima = r;
    anterior = v;
  }
  return ultima;
}

// Pagina por Range (mesma correção do cap de 1000 linhas do dashboard atual).
// Retorna null quando a 1ª página falha (sinal de erro real, não "sem dado").
async function fetchPaginado(url, headers, tamanhoPagina = 1000){
  const todas = [];
  let inicio = 0;
  while (true) {
    const resp = await fetch(url, { headers: { ...headers, 'Range-Unit': 'items', 'Range': `${inicio}-${inicio + tamanhoPagina - 1}` } });
    if (!resp.ok) return inicio === 0 ? null : todas;
    const pagina = await resp.json();
    todas.push(...pagina);
    if (pagina.length < tamanhoPagina) break;
    inicio += tamanhoPagina;
  }
  return todas;
}

// ── Helpers portados verbatim do dashboard atual (LoopEncSection e afins) —
// usados pelo módulo de Encarregados. Funções puras, sem dependência de
// estado/obra — dá pra colar sem tradução.
function normalizarNomeParaMatch(s){
  return String(s || '').trim().toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
}
function parsePTNumero(str){
  if (str === null || str === undefined || str === '') return 0;
  if (typeof str === 'number') return isNaN(str) ? 0 : str;
  const s = String(str).trim();
  if (!s.includes(',') && !s.includes('.')) return parseFloat(s) || 0;
  if (s.includes(',')) return parseFloat(s.replace(/[R$\s%]/g, '').replace(/\./g, '').replace(',', '.')) || 0;
  return parseFloat(s.replace(/[R$\s%]/g, '').replace(/,/g, '')) || 0;
}
function parseBRDateParaYMD(dateStr){
  if (!dateStr) return null;
  const parts = String(dateStr).split('/');
  if (parts.length === 3) return `${parts[2]}-${parts[1]}-${parts[0]}`;
  if (String(dateStr).includes('-')) return dateStr;
  return null;
}
function getFeriadosNacionais(year){
  // Algoritmo de Gauss para o cálculo da Páscoa.
  const a = year % 19, b = Math.floor(year / 100), c = year % 100;
  const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const easterMonth = Math.floor((h + l - 7 * m + 114) / 31) - 1;
  const easterDay = ((h + l - 7 * m + 114) % 31) + 1;
  const easter = new Date(year, easterMonth, easterDay);
  const shift = (date, days) => { const dt = new Date(date); dt.setDate(dt.getDate() + days); return dt; };
  const ymd = d2 => d2.toISOString().slice(0, 10);
  return new Set([
    `${year}-01-01`, `${year}-04-21`, `${year}-05-01`,
    `${year}-09-07`, `${year}-10-12`, `${year}-11-02`,
    `${year}-11-15`, `${year}-11-20`, `${year}-12-25`,
    ymd(shift(easter, -2)),  // Sexta-feira Santa
    ymd(shift(easter, 60)),  // Corpus Christi
  ]);
}
// Dia de referência da aderência: sempre o dia anterior; se for fim de
// semana ou feriado nacional, recua até o último dia útil.
function getDiaAderencia(){
  const ymdLocal = dt => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
  const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - 1);
  while (d.getDay() === 0 || d.getDay() === 6 || getFeriadosNacionais(d.getFullYear()).has(ymdLocal(d))) d.setDate(d.getDate() - 1);
  return ymdLocal(d);
}
// Variante: recua dia a dia a partir de ontem. Em fim de semana só aceita se
// HOUVER apontamento nele (domingo checado antes de sábado); dia de semana é
// aceito direto (feriado é pulado sem checagem). `temDadosNoDia(ymd)` decide
// a checagem de cada fim de semana.
function getDiaAderenciaComFallback(temDadosNoDia){
  const ymdLocal = dt => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
  const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - 1);
  while (true) {
    const isFimDeSemana = d.getDay() === 0 || d.getDay() === 6;
    if (isFimDeSemana) {
      if (temDadosNoDia(ymdLocal(d))) return ymdLocal(d);
    } else if (!getFeriadosNacionais(d.getFullYear()).has(ymdLocal(d))) {
      return ymdLocal(d);
    }
    d.setDate(d.getDate() - 1);
  }
}

      {/* Desktop: abas dividem o espaço. Mobile (@media 768): flex 0 0 auto
          + scroll-x no .tabs-scroll para todas serem alcançáveis no dedo. */}
      <div ref={scrollRef} className="card tabs-scroll">
        {SETORES.map(s => {
          const ativo = s.slug === atual.slug;
          return (
            <button key={s.slug} className={`tab-btn${ativo ? ' ativo' : ''}`} onClick={() => onIr(s)}
              style={{
                display:'flex', alignItems:'center', gap:8, flex:'1 1 0', minWidth:0, minHeight:44,
                padding:'8px 12px', borderRadius:8, border:'none',
                background: ativo ? T.blue : 'transparent',
                color: ativo ? '#fff' : T.body,
              }}>
              <span className="mono" style={{
                fontSize:11, width:18, height:18, borderRadius:5, display:'flex', alignItems:'center', justifyContent:'center',
                background: ativo ? 'rgba(255,255,255,0.25)' : '#eef0f3',
                color: ativo ? '#fff' : T.mut, flexShrink:0, transition:'all .18s ease'
              }}>{s.num}</span>
              <span style={{ fontSize:13, fontWeight:600, flex:1, minWidth:0, whiteSpace:'normal', lineHeight:1.25, textAlign:'left', overflowWrap:'break-word', wordBreak:'break-word', hyphens:'auto' }}>{s.label}</span>
              {s.estado === 'placeholder' && (
                <span style={{ marginLeft:'auto', width:6, height:6, borderRadius:'50%', background: ativo ? '#fff' : T.mut2, flexShrink:0 }} />
              )}
            </button>
          );
        })}
      </div>

      <button className="nav-arrow" onClick={() => irPara(1)} title="Próximo setor"
        style={{ width:32, height:32, borderRadius:8, border:'1px solid var(--line)', background:'#fff', color:T.body, fontSize:16, flexShrink:0 }}>›</button>
    </div>
  );
}

// ── Cartão de estado (carregando / erro / sem dado) ─────────────────────────
function CartaoEstado({ texto, maxHeight, tom }){
  return (
    <div className="card painel-gutter" style={{ padding:20, flex:1, minHeight:0, maxHeight, display:'flex', alignItems:'center', justifyContent:'center' }}>
      <div className="mono" style={{ fontSize:12, letterSpacing:'0.08em', color: tom || T.mut, textTransform:'uppercase' }}>{texto}</div>
    </div>
  );
}

// ── Setor 1, página 1 — módulo de Curva S (portado do dashboard atual) ──────
// Mesma LineSVG/CurvaChart do dashboard-main\index.html (previsto tracejado,
// tendência, realizado com pontos e rótulos, barras semanais previsto×real,
// linha "HOJE"), mais os 3 "balões" de resumo (Previsto/Realizado/Desvio) e
// uma legenda com clique para esconder/mostrar cada série. Deliberadamente
// SEM o "modo cliente" do atual (reescreve o previsto para maquiar desvio
// negativo) nem o filtro de período — fora do pedido, e o primeiro conflita
// com a regra de não fabricar dado (ADR-005).
function LineSVG({ data, width, height, idxHoje, idxHojeFloat, realColor, hiddenLines, forceAllTicks, mostrarRotulos = true, zoomViewBox = null, zoomScale = 1, setZoom = null, containerRef = null }) {
  const [dragOffsets, setDragOffsets] = useState({});
  const dragRef = useRef(null);
  // Refs pro loop de auto-pan (abaixo) sempre ler o valor mais recente, já
  // que o efeito que registra os listeners de mousemove/mouseup roda uma
  // vez só (deps []) — sem isso, `zoomScale`/`setZoom` ficariam presos no
  // valor de quando o componente montou.
  const zoomScaleRef = useRef(zoomScale);
  const setZoomRef = useRef(setZoom);
  const lastClientRef = useRef({ x: 0, y: 0 });
  const panRafRef = useRef(null);
  useEffect(() => { zoomScaleRef.current = zoomScale; }, [zoomScale]);
  useEffect(() => { setZoomRef.current = setZoom; }, [setZoom]);

  // Arrastar um rótulo no modo zoom NÃO deve mover a câmera — só perto da
  // BORDA da área visível é que a tela acompanha (auto-pan), igual ao
  // "arrastar-e-soltar" comum em outras interfaces. `EDGE_MARGIN` é a faixa
  // (em px de tela) a partir da borda que dispara o pan; a velocidade é em
  // px de TELA por frame (dividida pelo zoom na hora de aplicar), pra não
  // ficar mais rápido só porque a imagem está mais ampliada.
  const EDGE_MARGIN = 36;
  const PAN_PX_POR_FRAME = 10;

  // Offset incremental (soma um `delta` em cima do offset atual) em vez de
  // recalcular "do zero" a partir do ponto inicial do arrasto — necessário
  // porque o auto-pan (abaixo) TAMBÉM precisa somar nesse mesmo offset a
  // cada frame (pra o rótulo continuar "grudado" no cursor enquanto a
  // câmera anda sozinha), e as duas fontes (mousemove e o loop de pan)
  // precisam concordar sobre qual é o valor "atual", não um congelado no
  // início do arrasto.
  const somarOffset = (id, deltaX, deltaY) => {
    setDragOffsets(prev => {
      const atual = prev[id] || { dx: 0, dy: 0 };
      return { ...prev, [id]: { dx: atual.dx + deltaX, dy: atual.dy + deltaY } };
    });
  };

  const pararAutoPan = () => {
    if (panRafRef.current) { cancelAnimationFrame(panRafRef.current); panRafRef.current = null; }
  };
  const loopAutoPan = () => {
    if (!dragRef.current || !setZoomRef.current || !containerRef?.current) { panRafRef.current = null; return; }
    const scale = zoomScaleRef.current;
    if (scale > 1) {
      const rect = containerRef.current.getBoundingClientRect();
      const { x, y } = lastClientRef.current;
      let dxScreen = 0, dyScreen = 0;
      if (x - rect.left < EDGE_MARGIN) dxScreen = -PAN_PX_POR_FRAME;
      else if (rect.right - x < EDGE_MARGIN) dxScreen = PAN_PX_POR_FRAME;
      if (y - rect.top < EDGE_MARGIN) dyScreen = -PAN_PX_POR_FRAME;
      else if (rect.bottom - y < EDGE_MARGIN) dyScreen = PAN_PX_POR_FRAME;
      if (dxScreen !== 0 || dyScreen !== 0) {
        const stepX = dxScreen / scale, stepY = dyScreen / scale;
        setZoomRef.current(prev => ({
          ...prev,
          ox: Math.max(0, Math.min(width  * (1 - 1 / prev.scale), prev.ox + stepX)),
          oy: Math.max(0, Math.min(height * (1 - 1 / prev.scale), prev.oy + stepY)),
        }));
        // Compensa o pan no offset do rótulo (mesmo sinal/tamanho) — sem
        // isso o rótulo "ficaria pra trás" conforme a câmera anda sozinha,
        // já que só o mousemove (que não está disparando, o cursor está
        // parado na borda) atualizava o offset antes.
        somarOffset(dragRef.current.id, stepX, stepY);
      }
    }
    panRafRef.current = requestAnimationFrame(loopAutoPan);
  };

  useEffect(() => {
    const onMouseMove = (e) => {
      const ultimo = lastClientRef.current;
      lastClientRef.current = { x: e.clientX, y: e.clientY };
      if (!dragRef.current) return;
      // Distância percorrida em px de TELA convertida pra espaço do SVG —
      // ampliado 2x, 100px de mouse = 50 unidades de SVG (senão o rótulo
      // "foge" do cursor, andando mais rápido que ele, quando ampliado).
      const escala = zoomScaleRef.current || 1;
      somarOffset(dragRef.current.id, (e.clientX - ultimo.x) / escala, (e.clientY - ultimo.y) / escala);
    };
    const onMouseUp = () => {
      if (dragRef.current) {
        document.body.style.userSelect = '';
        dragRef.current = null;
        pararAutoPan();
      }
    };
    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('mouseup', onMouseUp);
    return () => {
      window.removeEventListener('mousemove', onMouseMove);
      window.removeEventListener('mouseup', onMouseUp);
    };
  }, []);

  const handleDragStart = (e, id) => {
    e.preventDefault();
    e.stopPropagation(); // não deixa o mousedown "vazar" pro pan do CurvaChart
    document.body.style.userSelect = 'none';
    lastClientRef.current = { x: e.clientX, y: e.clientY };
    dragRef.current = { id };
    pararAutoPan();
    panRafRef.current = requestAnimationFrame(loopAutoPan);
  };

  const hl = hiddenLines || new Set();
  if (!data || data.length < 2) return null;

  const BAR_H = 48;
  const pad = { top: 24, right: 24, bottom: 70 + BAR_H, left: 58 };
  const W = width  - pad.left - pad.right;
  const H = height - pad.top  - pad.bottom;

  const allVals = data.flatMap(d => [d.Previsto, d.Realizado, d.Tendencia]).filter(v => v !== null && v > 0);
  const minV = 0;
  const maxV = Math.max(...allVals) * 1.06 || 1;

  const xScale    = i  => (i / (data.length - 1)) * W;
  const yScale    = v  => H - ((v - minV) / (maxV - minV)) * H;

  const pathFiltered = (key, upToIdxFloat) => {
    const limit = upToIdxFloat !== undefined ? upToIdxFloat : Infinity;
    const pts = data.map((d, i) => ({ v: d[key], i })).filter(p => p.v !== null && p.v > 0 && p.i <= Math.ceil(limit));
    if (pts.length === 0) return '';
    const last = pts[pts.length - 1];
    const prev = pts.length > 1 ? pts[pts.length - 2] : null;
    let finalPts = pts;
    if (upToIdxFloat !== undefined && last.i > limit && prev) {
      const frac = (limit - prev.i) / (last.i - prev.i);
      const vInterp = prev.v + frac * (last.v - prev.v);
      finalPts = [...pts.slice(0, -1), { v: vInterp, i: limit }];
    }
    return finalPts.map((p, j) => `${j === 0 ? 'M' : 'L'} ${xScale(p.i).toFixed(1)} ${yScale(p.v).toFixed(1)}`).join(' ');
  };
  const pathAll = (key) => pathFiltered(key, undefined);

  const yTicks = Array.from({ length: 6 }, (_, i) => maxV * (i / 5));
  let xDisplayIndices;
  let niceStep;
  if (forceAllTicks) {
    niceStep = 1;
    xDisplayIndices = Array.from({ length: data.length }, (_, i) => i);
  } else {
    const minSpacingPx = 52;
    const maxTicks = Math.max(2, Math.floor(W / minSpacingPx));
    const rawStep = Math.max(1, Math.ceil(data.length / maxTicks));
    const niceSteps = [1, 2, 3, 4, 6, 8, 12, 16, 24, 52];
    niceStep = niceSteps.find(s => s >= rawStep) || rawStep;
    const pivot = idxHoje >= 0 ? idxHoje : Math.floor(data.length / 2);

    const tickSet = new Set();
    for (let i = pivot; i >= 0; i -= niceStep) tickSet.add(i);
    for (let i = pivot; i < data.length; i += niceStep) tickSet.add(i);
    const naturalArr = [...tickSet].sort((a, b) => a - b);
    const minGap = Math.round(niceStep * 0.6);
    if (naturalArr[0] > minGap) tickSet.add(0);
    if (data.length - 1 - naturalArr[naturalArr.length - 1] > minGap) tickSet.add(data.length - 1);
    xDisplayIndices = [...tickSet].sort((a, b) => a - b);
  }
  const displaySet = new Set(xDisplayIndices);

  const xHojeF = (idxHojeFloat !== undefined && idxHojeFloat >= 0)
    ? xScale(idxHojeFloat)
    : (idxHoje >= 0 ? xScale(idxHoje) : null);

  const tickSpacingPx = data.length > 1 ? (W / (data.length - 1)) * niceStep : W;
  const barW = Math.max(3, Math.min(14, tickSpacingPx * 0.28));
  const showBarLabels = barW >= 7;
  const maxSem = Math.max(...data.map(d => Math.max(d.SemPrevisto || 0, d.SemRealizado || 0)));
  const semScale = v => maxSem > 0 ? (v / maxSem) * BAR_H : 0;

  const parseDataRaw = (raw) => {
    if (!raw) return null;
    const s = String(raw).trim().split(' ')[0].split('T')[0];
    if (s.includes('/')) {
      const parts = s.split('/');
      if (parts.length === 3) {
        let [a, b, c] = parts.map(Number);
        if (c >= 100) {
          const d = a > 12 ? a : (b > 12 ? b : a);
          const m = a > 12 ? b : (b > 12 ? a : b);
          return new Date(c, m - 1, d);
        } else { return new Date(2000 + c, b - 1, a); }
      }
    }
    if (s.includes('-')) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
    return null;
  };
  const fmtDate = (raw) => {
    const dt = parseDataRaw(raw);
    if (!dt || isNaN(dt)) return String(raw || '').split(' ')[0];
    return String(dt.getDate()).padStart(2,'0') + '/' + String(dt.getMonth() + 1).padStart(2,'0') + '/' + String(dt.getFullYear()).slice(-2);
  };

  const lineColor     = realColor || '#1f9d57';
  const barZoneY      = H + 8;

  return (
    <svg width={width} height={height} style={{ overflow: 'visible' }} viewBox={zoomViewBox || undefined}>
      <defs>
        <linearGradient id="gradReal" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={lineColor} stopOpacity="0.18" />
          <stop offset="100%" stopColor={lineColor} stopOpacity="0" />
        </linearGradient>
        <linearGradient id="gradTend" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#98a1b0" stopOpacity="0.10" />
          <stop offset="100%" stopColor="#98a1b0" stopOpacity="0" />
        </linearGradient>
        <clipPath id="clipLines"><rect x={0} y={0} width={W} height={H} /></clipPath>
      </defs>
      <g transform={`translate(${pad.left},${pad.top})`}>

        {yTicks.map((v, i) => (
          <g key={i}>
            <line x1={0} y1={yScale(v)} x2={W} y2={yScale(v)} stroke="#eef0f3" strokeWidth={1} />
            <text x={-10} y={yScale(v) + 4} textAnchor="end" fill="#aab2bf" fontSize={11} fontFamily="IBM Plex Sans, sans-serif">{(v * 100).toFixed(0)}%</text>
          </g>
        ))}

        {xDisplayIndices.map((xi, i) => (
          <line key={i} x1={xScale(xi)} y1={0} x2={xScale(xi)} y2={H} stroke="#eef0f3" strokeWidth={1} />
        ))}

        {!hl.has('Realizado') && pathFiltered('Realizado', idxHojeFloat !== undefined ? idxHojeFloat : idxHoje) && (
          <path clipPath="url(#clipLines)"
            d={pathFiltered('Realizado', idxHojeFloat !== undefined ? idxHojeFloat : idxHoje) + ' L ' + xScale(idxHojeFloat !== undefined ? idxHojeFloat : idxHoje) + ' ' + H + ' L 0 ' + H + ' Z'}
            fill="url(#gradReal)" />
        )}

        {!hl.has('Tendencia') && pathAll('Tendencia') && (
          <path clipPath="url(#clipLines)"
            d={pathAll('Tendencia') + ' L ' + xScale(data.length-1) + ' ' + H + ' L ' + xScale(idxHoje >= 0 ? idxHoje : 0) + ' ' + H + ' Z'}
            fill="url(#gradTend)" />
        )}

        {!hl.has('Previsto') && <path clipPath="url(#clipLines)" d={pathAll('Previsto')} fill="none" stroke="#2563eb" strokeWidth={2} strokeDasharray="8 4" strokeLinecap="round" opacity={0.7} />}

        {!hl.has('Realizado') && <path clipPath="url(#clipLines)"
          d={pathFiltered('Realizado', idxHojeFloat !== undefined ? idxHojeFloat : idxHoje)}
          fill="none" stroke={lineColor} strokeWidth={3} strokeLinecap="round"
          />}

        {!hl.has('Realizado') && (() => {
          const pts = data.map((d, i) => ({ v: d.Realizado, i }))
            .filter(p => p.v != null && p.v > 0 && p.i >= idxHoje);
          if (pts.length < 2 || pts[pts.length - 1].i <= idxHoje) return null;
          const dPath = pts.map((p, j) => `${j === 0 ? 'M' : 'L'} ${xScale(p.i).toFixed(1)} ${yScale(p.v).toFixed(1)}`).join(' ');
          return <path clipPath="url(#clipLines)" d={dPath} fill="none" stroke={lineColor} strokeWidth={2} strokeDasharray="5 4" strokeLinecap="round" opacity={0.55} />;
        })()}

        {!hl.has('Tendencia') && <path clipPath="url(#clipLines)" d={pathAll('Tendencia')} fill="none" stroke="#98a1b0" strokeWidth={2} strokeDasharray="5 3" strokeLinecap="round" opacity={0.7} />}

        {xHojeF !== null && (
          <g>
            <line x1={xHojeF} y1={0} x2={xHojeF} y2={H} stroke="#aab2bf" strokeWidth={1.5} strokeDasharray="4 3" />
            <text x={xHojeF + 5} y={14} fill="#98a1b0" fontSize={10} fontFamily="IBM Plex Sans, sans-serif" fontWeight={600}>HOJE</text>
          </g>
        )}

        {!hl.has('Realizado') && idxHoje >= 0 && data[idxHoje]?.Realizado > 0 && (
          <circle cx={xScale(idxHoje)} cy={yScale(data[idxHoje].Realizado)} r={5} fill={lineColor} />
        )}

        {!hl.has('Realizado') && data.map((d, xi) => {
          if (!d.Realizado || d.Realizado <= 0 || xi > idxHoje) return null;
          const isLast = xi === idxHoje;
          const isTick = displaySet.has(xi);
          const x = xScale(xi), y = yScale(d.Realizado);
          const pct = (d.Realizado * 100).toFixed(1) + '%';
          const labelY = y < 18 ? y + 16 : y - 8;
          const anchor = x < 30 ? 'start' : x > W - 30 ? 'end' : 'middle';
          return (
            <g key={'rl-' + xi}>
              {!isLast && <circle cx={x} cy={y} r={forceAllTicks ? 3.5 : 2.5} fill={lineColor} opacity={forceAllTicks ? 0.9 : 0.65} />}
              {mostrarRotulos && isTick && (() => {
                const id = 'rl-' + xi;
                const offset = dragOffsets[id] || { dx: 0, dy: 0 };
                const isMoved = offset.dx !== 0 || offset.dy !== 0;
                return (
                  <g>
                    {isMoved && <line x1={x} y1={y} x2={x + offset.dx} y2={labelY + offset.dy} stroke={lineColor} strokeWidth={1} strokeDasharray="3 2" opacity={0.5} />}
                    <text x={x + offset.dx} y={labelY + offset.dy} textAnchor={anchor}
                      fill={isLast ? lineColor : (forceAllTicks ? lineColor : '#4d5868')}
                      fontSize={isLast ? 12 : (forceAllTicks ? 11 : 9.5)}
                      fontFamily="IBM Plex Sans, IBM Plex Sans, sans-serif"
                      fontWeight={isLast || forceAllTicks ? 700 : 500}
                      style={{ cursor: 'grab' }}
                      onMouseDown={(e) => handleDragStart(e, id)}
                      >
                      {pct}
                    </text>
                  </g>
                );
              })()}
            </g>
          );
        })}

        {!hl.has('Realizado') && (() => {
          const idxLastProx = data.reduce((l, d, i) =>
            (i > idxHoje && d.Realizado != null && d.Realizado > 0 ? i : l), -1);
          if (idxLastProx < 0) return null;
          return data.map((d, xi) => {
            if (!d.Realizado || d.Realizado <= 0 || xi <= idxHoje) return null;
            const isLast = xi === idxLastProx;
            const isTick = displaySet.has(xi);
            if (!isLast && !isTick) return null;
            const x = xScale(xi), y = yScale(d.Realizado);
            const pct = (d.Realizado * 100).toFixed(1) + '%';
            const labelY = y < 18 ? y + 16 : y - 8;
            const anchor = x < 30 ? 'start' : x > W - 30 ? 'end' : 'middle';
            return (
              <g key={'prox-' + xi}>
                <circle cx={x} cy={y} r={isLast ? 5 : 3.5} fill="none" stroke={lineColor} strokeWidth={2} opacity={isLast ? 0.9 : 0.65} />
                {mostrarRotulos && (isLast || isTick) && (() => {
                  const id = 'prox-' + xi;
                  const offset = dragOffsets[id] || { dx: 0, dy: 0 };
                  const isMoved = offset.dx !== 0 || offset.dy !== 0;
                  return (
                    <g>
                      {isMoved && <line x1={x} y1={y} x2={x + offset.dx} y2={labelY + offset.dy} stroke={lineColor} strokeWidth={1} strokeDasharray="3 2" opacity={0.4} />}
                      <text x={x + offset.dx} y={labelY + offset.dy} textAnchor={anchor}
                        fill={isLast ? lineColor : '#98a1b0'}
                        fontSize={isLast ? 11 : 9.5}
                        fontFamily="IBM Plex Sans, IBM Plex Sans, sans-serif"
                        fontWeight={isLast ? 700 : 500}
                        opacity={isLast ? 0.88 : 0.6}
                        style={{ cursor: 'grab' }}
                        onMouseDown={(e) => handleDragStart(e, id)}
                        >
                        {pct}
                      </text>
                    </g>
                  );
                })()}
              </g>
            );
          });
        })()}

        {!hl.has('Previsto') && data.map((d, xi) => {
          if (!d.Previsto || d.Previsto <= 0 || xi <= idxHoje) return null;
          const isTick = displaySet.has(xi);
          const x = xScale(xi), y = yScale(d.Previsto);
          const pct = (d.Previsto * 100).toFixed(1) + '%';
          const labelY = y > H - 18 ? y - 8 : y + 16;
          const anchor = x < 30 ? 'start' : x > W - 30 ? 'end' : 'middle';
          return (
            <g key={'pl-' + xi}>
              <circle cx={x} cy={y} r={forceAllTicks ? 3 : 2} fill="#2563eb" opacity={forceAllTicks ? 0.8 : 0.5} />
              {mostrarRotulos && isTick && (() => {
                const id = 'pl-' + xi;
                const offset = dragOffsets[id] || { dx: 0, dy: 0 };
                const isMoved = offset.dx !== 0 || offset.dy !== 0;
                return (
                  <g>
                    {isMoved && <line x1={x} y1={y} x2={x + offset.dx} y2={labelY + offset.dy} stroke="#2563eb" strokeWidth={1} strokeDasharray="3 2" opacity={0.4} />}
                    <text x={x + offset.dx} y={labelY + offset.dy} textAnchor={anchor}
                      fill={forceAllTicks ? '#4d82ef' : 'rgba(37,99,235,0.6)'}
                      fontSize={forceAllTicks ? 11 : 9.5}
                      fontFamily="IBM Plex Sans, IBM Plex Sans, sans-serif"
                      fontWeight={forceAllTicks ? 700 : 500}
                      style={{ cursor: 'grab' }}
                      onMouseDown={(e) => handleDragStart(e, id)}
                      >
                      {pct}
                    </text>
                  </g>
                );
              })()}
            </g>
          );
        })}

        <line x1={0} y1={barZoneY} x2={W} y2={barZoneY} stroke="#eef0f3" strokeWidth={1} />
        <text x={-10} y={barZoneY + BAR_H / 2 + 4} textAnchor="end" fill="#aab2bf" fontSize={9} fontFamily="IBM Plex Sans, sans-serif">sem.</text>

        {xDisplayIndices.map((xi, i) => {
          const d = data[xi], x = xScale(xi), isPast = xi <= idxHoje;
          const semP = d.SemPrevisto || 0, semR = d.SemRealizado || 0;
          if (semP <= 0 && semR <= 0) return null;
          const hP = semScale(semP), hR = semScale(semR), offset = barW * 0.55;
          return (
            <g key={'bar-' + i}>
              {semP > 0 && !hl.has('SemPrevisto') && (
                <g>
                  <rect x={x - offset - barW / 2} y={barZoneY + BAR_H - hP} width={barW} height={hP} fill="#2563eb" opacity={0.35} rx={2} />
                  {mostrarRotulos && (showBarLabels || forceAllTicks) && <text x={x - offset} y={barZoneY + BAR_H - hP - 3} textAnchor="middle" fill={forceAllTicks ? '#4d82ef' : 'rgba(37,99,235,0.6)'} fontSize={forceAllTicks ? 9 : 8} fontWeight={forceAllTicks ? 700 : 400} fontFamily="IBM Plex Sans, IBM Plex Sans, sans-serif">{(semP * 100).toFixed(1)}%</text>}
                </g>
              )}
              {semR > 0 && !hl.has('SemRealizado') && (
                <g>
                  <rect x={x + offset - barW / 2} y={barZoneY + BAR_H - hR} width={barW} height={hR} fill={lineColor} opacity={isPast ? 0.6 : 0.35} rx={2} strokeDasharray={isPast ? undefined : '2 2'} stroke={isPast ? undefined : lineColor} strokeWidth={isPast ? 0 : 1} />
                  {mostrarRotulos && (showBarLabels || forceAllTicks) && <text x={x + offset} y={barZoneY + BAR_H - hR - 3} textAnchor="middle" fill={lineColor} fontSize={forceAllTicks ? 9 : 8} fontFamily="IBM Plex Sans, IBM Plex Sans, sans-serif" fontWeight={700} opacity={isPast ? 1 : 0.6}>{(semR * 100).toFixed(1)}%</text>}
                </g>
              )}
            </g>
          );
        })}

        {xDisplayIndices.map((xi, i) => {
          const d = data[xi], label = fmtDate(d.data) || ('S' + d.semana);
          const x = xScale(xi), yLabel = barZoneY + BAR_H + 6;
          return (
            <g key={i}>
              <line x1={x} y1={barZoneY + BAR_H} x2={x} y2={barZoneY + BAR_H + 4} stroke="#aab2bf" strokeWidth={1} />

            </g>
          );
        })}

        <line x1={0} y1={0} x2={0} y2={H} stroke="#eef0f3" />
        <line x1={0} y1={H} x2={W} y2={H} stroke="#eef0f3" />
      </g>
    </svg>
  );
}

function CurvaChart({ chartData, idxHoje, idxHojeFloat, realColor, hiddenLines, forceAllTicks, mostrarRotulos, modoZoom }) {
  const ref = useRef(null);
  const [size, setSize] = useState({ w: 0, h: 0 });
  const [zoom, setZoom] = useState({ scale: 1, ox: 0, oy: 0 });
  const sizeRef = useRef(size);
  const modoZoomRef = useRef(modoZoom);

  useEffect(() => { sizeRef.current = size; }, [size]);
  useEffect(() => { modoZoomRef.current = modoZoom; }, [modoZoom]);

  useEffect(() => {
    if (!ref.current) return;
    const rect = ref.current.getBoundingClientRect();
    if (rect.width > 0) setSize({ w: rect.width, h: rect.height });
    const ro = new ResizeObserver(entries => {
      const { width, height } = entries[0].contentRect;
      if (width > 0) setSize({ w: width, h: height });
    });
    ro.observe(ref.current);
    return () => ro.disconnect();
  }, []);

  useEffect(() => { if (!modoZoom) setZoom({ scale: 1, ox: 0, oy: 0 }); }, [modoZoom]);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const onWheel = (e) => {
      if (!modoZoomRef.current) return;
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
      const { w, h } = sizeRef.current;
      if (!w || !h) return;
      const rect = el.getBoundingClientRect();
      const mx = ((e.clientX - rect.left) / rect.width)  * w;
      const my = ((e.clientY - rect.top)  / rect.height) * h;
      setZoom(prev => {
        const newScale = Math.min(8, Math.max(1, prev.scale * factor));
        const svgX = prev.ox + mx / prev.scale;
        const svgY = prev.oy + my / prev.scale;
        const ox = Math.max(0, Math.min(w * (1 - 1 / newScale), svgX - mx / newScale));
        const oy = Math.max(0, Math.min(h * (1 - 1 / newScale), svgY - my / newScale));
        return { scale: newScale, ox: isFinite(ox) ? ox : 0, oy: isFinite(oy) ? oy : 0 };
      });
    };
    el.addEventListener('wheel', onWheel, { passive: false });
    return () => el.removeEventListener('wheel', onWheel);
  }, []);

  const handleMouseDown = (e) => {
    if (!modoZoom || zoom.scale <= 1) return;
    e.preventDefault();
    const startX = e.clientX, startY = e.clientY;
    const startOx = zoom.ox, startOy = zoom.oy;
    const onMove = (ev) => {
      const { w, h } = sizeRef.current;
      if (!w || !h) return;
      setZoom(prev => {
        const dx = (ev.clientX - startX) / prev.scale;
        const dy = (ev.clientY - startY) / prev.scale;
        const ox = Math.max(0, Math.min(w * (1 - 1 / prev.scale), startOx - dx));
        const oy = Math.max(0, Math.min(h * (1 - 1 / prev.scale), startOy - dy));
        return { ...prev, ox: isFinite(ox) ? ox : prev.ox, oy: isFinite(oy) ? oy : prev.oy };
      });
    };
    const onUp = () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  };

  const vbW = size.w > 0 && zoom.scale > 0 ? size.w / zoom.scale : size.w;
  const vbH = size.h > 0 && zoom.scale > 0 ? size.h / zoom.scale : size.h;
  const safeViewBox = (modoZoom && isFinite(zoom.ox) && isFinite(zoom.oy) && vbW > 0 && vbH > 0)
    ? `${zoom.ox} ${zoom.oy} ${vbW} ${vbH}`
    : null;

  return (
    <div ref={ref} style={{ width: '100%', height: '100%', cursor: modoZoom ? (zoom.scale > 1 ? 'grab' : 'zoom-in') : 'default' }}
      onMouseDown={handleMouseDown}>
      {size.w > 0
        ? <LineSVG data={chartData} width={size.w} height={size.h || 400} idxHoje={idxHoje} idxHojeFloat={idxHojeFloat} realColor={realColor} hiddenLines={hiddenLines} forceAllTicks={forceAllTicks} mostrarRotulos={mostrarRotulos}
            zoomViewBox={safeViewBox} zoomScale={zoom.scale} setZoom={modoZoom ? setZoom : null} containerRef={ref} />
        : null}
    </div>
  );
}

// Mesma % usada na planilha de controle (aderência = semanal realizado /
// semanal previsto) — quando os dois são 0 (nada previsto, nada feito),
// convenção da planilha é considerar 100% (em dia).
function aderenciaSemanal(r){
  const p = r.SemPrevisto, rl = r.SemRealizado;
  if (p == null && rl == null) return null;
  if (!p) return (!rl) ? 100 : null;
  return (rl || 0) / p * 100;
}
function corAderencia(v){
  if (v == null) return T.mut;
  if (v >= 100) return T.green;
  if (v >= 80) return T.amber;
  return T.red;
}
function fmtDataLonga(raw){
  const dt = parseDataCorte(raw);
  if (!dt) return String(raw || '—');
  return `${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getFullYear()).slice(-2)}`;
}
function fmtDataCompleta(raw){
  const dt = parseDataCorte(raw);
  if (!dt) return String(raw || '—');
  return `${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`;
}
function fmtReais(v){
  if (v == null || isNaN(v)) return '—';
  return v.toLocaleString('pt-BR', { style:'currency', currency:'BRL', minimumFractionDigits:2, maximumFractionDigits:2 });
}
// Versão curta pra caber no eixo/rótulo de gráfico (ex.: "R$ 17,4 mi") —
// valores de NF chegam na casa das dezenas/centenas de milhões, não cabe
// por extenso como no balão de resumo.
function fmtReaisCompacto(v){
  if (v == null || isNaN(v)) return '—';
  return v.toLocaleString('pt-BR', { style:'currency', currency:'BRL', notation:'compact', maximumFractionDigits:1 });
}
// `nfs.bm` às vezes vem com texto extra colado ao número do Boletim de
// Medição (ex.: "01 - 8002160923", "01 Tubulação") — só o número líder
// importa pra contagem/ordenação/exibição; o resto é ruído da origem.
function bmCurto(bm){
  if (!bm) return bm;
  const m = String(bm).trim().match(/^(\d+)/);
  return m ? m[1] : bm;
}

// Linhas da tabela numérica — mesmo layout da planilha de controle do usuário
// (semana em coluna, métrica em linha, agrupada em SEMANAL/ACUMULADO).
const LINHAS_TABELA_CURVA = [
  { grupo: 'SEMANAL',    label: 'Desvio',     campo: 'SemDesvio',   cor: v => v != null ? corDesvio(v * 100) : T.mut, forte: true },
  { grupo: 'SEMANAL',    label: 'Realizado',  campo: 'SemRealizado',cor: () => T.body },
  { grupo: 'SEMANAL',    label: 'Previsto',   campo: 'SemPrevisto', cor: () => T.body },
  { grupo: 'SEMANAL',    label: 'Tendência',  campo: 'SemTendencia',cor: () => T.mut },
  { grupo: 'SEMANAL',    label: 'Aderência',  especial: 'aderencia' },
  { grupo: 'ACUMULADO',  label: 'Desvio',     campo: 'Desvio',      cor: v => v != null ? corDesvio(v * 100) : T.mut, forte: true },
  { grupo: 'ACUMULADO',  label: 'Realizado',  campo: 'Realizado',   cor: () => T.body },
  { grupo: 'ACUMULADO',  label: 'Previsto',   campo: 'Previsto',    cor: () => T.blue },
  { grupo: 'ACUMULADO',  label: 'Tendência',  campo: 'Tendencia',   cor: () => T.mut },
];
const GRUPO_COL_W = 32, LABEL_COL_W = 128;

// Mesma regra de agrupamento do app de relatórios (gerar_relatorio.py): Novo
// Nordisk fecha a semana de sexta a quinta, as demais de segunda a sábado
// (domingo não recebe apontamento em nenhum dos dois grupos). A tabela
// relatorio_produtividade_semanal grava sempre pela segunda-feira do
// calendário (`periodo_inicio`), mesmo para a NN — só a janela da meta muda.
const NN_IDS_PORTAL = new Set([91, 107, 108]);
// Rótulo curto igual ao das colunas do PNG (ORDEM_PADRAO/ORDEM_NN do
// gerar_relatorio.py) — exceção deliberada à regra geral de "sem abreviação"
// deste projeto: aqui o pedido explícito foi ficar parecido com o PNG
// exportado, que já usa esses rótulos por limite de espaço. O nome por
// extenso continua acessível via `title` (tooltip) no cabeçalho da coluna.
const ORDEM_DIAS_PADRAO = [
  ['prod_seg', 'Seg'], ['prod_ter', 'Ter'], ['prod_qua', 'Qua'],
  ['prod_qui', 'Qui'], ['prod_sex', 'Sex'], ['prod_sab', 'Sáb'],
];
const ORDEM_DIAS_NN = [
  ['prod_sex', 'Sex'], ['prod_sab', 'Sáb'], ['prod_seg', 'Seg'],
  ['prod_ter', 'Ter'], ['prod_qua', 'Qua'], ['prod_qui', 'Qui'],
];
const DIA_LABEL_LONGO = { Seg: 'Segunda', Ter: 'Terça', Qua: 'Quarta', Qui: 'Quinta', Sex: 'Sexta', Sáb: 'Sábado' };
const FATOR_META_PROD = 1.15;

function addDias(d, n){
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}
function fmtDataISO(d){
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

// Mesmo cálculo de calcular_metricas() do gerar_relatorio.py: acumulado é o
// último corte JÁ REALIZADO antes do início da janela da semana (nunca um
// corte dentro/no fim da própria janela — a meta não pode depender de um
// resultado que só existe no fim da semana que ela deveria medir).
function calcularMetaSemana(linhasCurva, janelaInicio){
  if (!linhasCurva || linhasCurva.length === 0) return { acumulado: null, metaSemanal: null, metaDiaria: null };
  const comReal = linhasCurva.filter(r => (r.Realizado || 0) > 0);
  const antes = comReal.filter(r => { const dt = parseDataCorte(r.data); return dt && dt < janelaInicio; });
  const corte = antes.length ? antes[antes.length - 1] : (comReal[0] || null);
  if (!corte) return { acumulado: null, metaSemanal: null, metaDiaria: null };
  const acumulado = corte.Realizado * 100;
  const prev100 = linhasCurva.find(r => (r.Previsto || 0) >= 0.999) || linhasCurva[linhasCurva.length - 1];
  const semanasFaltantes = Math.max(0, (prev100.semana || 0) - (corte.semana || 0));
  if (acumulado >= 100) return { acumulado, metaSemanal: 0, metaDiaria: 0 };
  const saldo = 100 - acumulado;
  let metaSemanal = semanasFaltantes <= 0 ? saldo * FATOR_META_PROD : (saldo / semanasFaltantes) * FATOR_META_PROD;
  metaSemanal = Math.min(metaSemanal, saldo);
  return { acumulado, metaSemanal, metaDiaria: metaSemanal / 5 };
}

function ModuloCurvaS({ linhas, info, carregando, erro, obraId, obraNome, curvas, curvaAtual, onTrocarCurva }){
  const [hiddenLines, setHiddenLines] = useState(new Set());
  const [tabelaAberta, setTabelaAberta] = useState(false);
  const [todasColunas, setTodasColunas] = useState(false);
  const [mostrarRotulos, setMostrarRotulos] = useState(true);
  const [modoZoom, setModoZoom] = useState(false);
  // Corte (linha da tabela) cujo popup "Diário" está aberto — null = fechado.
  // Cada corte (a semana em andamento E as semanas já fechadas) abre o
  // popup da SUA PRÓPRIA semana, não um histórico agregado dentro do popup
  // da próxima ("as semanas anteriores devem ser exibidas num pop-up da
  // sua semana específica, não no pop-up da próxima").
  const [diarioCorte, setDiarioCorte] = useState(null);
  const [diarioLinha, setDiarioLinha] = useState(null);
  const [diarioCarregando, setDiarioCarregando] = useState(false);
  const [diarioErro, setDiarioErro] = useState(false);
  const tabelaScrollRef = useRef(null);

  // Produtividade diária (relatorio_produtividade_semanal) — mesma tabela que
  // alimenta o PNG semanal, só que aqui já filtrada para esta obra e pro
  // corte clicado. A janela é sempre derivada da DATA do próprio corte
  // (diarioCorte.data), nunca de "new Date()" direto — a janela sexta→
  // quinta da NN não bate com a semana-calendário (segunda→domingo), então
  // ancorar em "hoje" fazia a busca cair numa chave errada sempre que o dia
  // da semana virava (bug: "o diário mais recente não cai no corte certo").
  useEffect(() => {
    if (!diarioCorte || !obraId) return;
    setDiarioCarregando(true); setDiarioErro(false); setDiarioLinha(null);
    const sbHeaders = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };
    const ehNN = NN_IDS_PORTAL.has(Number(obraId));
    const janelaFim = parseDataCorte(diarioCorte.data);
    const janelaInicio = addDias(janelaFim, -6);
    const periodoInicioChave = ehNN ? addDias(janelaInicio, 3) : janelaInicio;
    const periodoISO = fmtDataISO(periodoInicioChave);
    fetch(`${SUPABASE_URL}/rest/v1/relatorio_produtividade_semanal?id_obra=eq.${obraId}&periodo_inicio=eq.${periodoISO}&select=*`, { headers: sbHeaders })
      .then(r => { if (!r.ok) throw new Error('falha'); return r.json(); })
      .then(rows => setDiarioLinha(rows[0] || null))
      .catch(() => setDiarioErro(true))
      .finally(() => setDiarioCarregando(false));
  }, [diarioCorte, obraId]);

  // Ao abrir, a rolagem horizontal já começa na coluna do corte de
  // referência (HOJE), centralizada — é o ponto que mais importa analisar,
  // não a semana 1.
  useEffect(() => {
    if (!tabelaAberta) return;
    const idx = info?.idxHoje;
    if (idx == null || idx < 0) return;
    const raf = requestAnimationFrame(() => {
      const el = tabelaScrollRef.current;
      const th = el && el.querySelector(`[data-col-idx="${idx}"]`);
      if (!el || !th) return;
      const alvo = th.offsetLeft + th.offsetWidth / 2 - el.clientWidth / 2;
      el.scrollLeft = Math.max(0, alvo);
    });
    return () => cancelAnimationFrame(raf);
  }, [tabelaAberta, info]);

  // Seletor de curva (só obras com mais de 1, hoje NN - AP) — calculado antes
  // dos early-return de "sem dados" pra continuar visível mesmo quando a
  // curva escolhida ainda não tem linha nenhuma no Supabase (senão o
  // usuário clica em PPU/C.O. sem dado e fica preso na tela de "sem dados",
  // sem nenhum controle na UI pra voltar pra "PPU + C.O.").
  const seletorCurva = curvas && curvas.length > 1 && (
    <>
      <div style={{ width:1, height:14, background:T.line, alignSelf:'center' }} />
      <span className="mono" style={{ fontSize:10, letterSpacing:'0.1em', color:'#aab2bf', textTransform:'uppercase', fontWeight:600 }}>Curva</span>
      {curvas.map(c => {
        const ativa = c.chave === curvaAtual;
        return (
          <button key={c.chave} onClick={() => onTrocarCurva(c.chave)} title={c.label}
            style={{ background: ativa ? T.ink : '#eef0f3', border:'none', color: ativa ? '#fff' : T.body,
              padding:'6px 14px', borderRadius:8, cursor:'pointer', fontSize:12, fontWeight:600 }}>
            {c.label}
          </button>
        );
      })}
    </>
  );

  if (carregando) return <CartaoEstado texto="Carregando curva S…" maxHeight={620} />;
  if (erro) return <CartaoEstado texto="Erro ao carregar curvas_s" maxHeight={620} tom={T.red} />;
  if (!linhas || linhas.length < 2) return (
    <div className="painel-gutter" style={{ flex:1, minHeight:0, display:'flex', flexDirection:'column', gap:14 }}>
      {seletorCurva && <div className="toolbar-wrap">{seletorCurva}</div>}
      <CartaoEstado texto="Sem dados de curva para esta obra" maxHeight={620} />
    </div>
  );

  const toggle = (key) => setHiddenLines(prev => {
    const next = new Set(prev);
    next.has(key) ? next.delete(key) : next.add(key);
    return next;
  });

  const pct = (v) => v == null ? '—' : `${(v * 100).toFixed(2)}%`;

  const exportarCSV = () => {
    // Mesmo formato da planilha de referência: semana em coluna, métrica em linha.
    const linhasMeta = [
      { label: 'Semana',        get: r => r.semana },
      { label: 'Data',          get: r => fmtDataLonga(r.data) },
      ...LINHAS_TABELA_CURVA.map(row => ({
        label: `${row.grupo === 'SEMANAL' ? 'Sem.' : 'Acum.'} ${row.label}`,
        get: r => row.especial === 'aderencia'
          ? (aderenciaSemanal(r) != null ? `${aderenciaSemanal(r).toFixed(2)}%` : '—')
          : pct(r[row.campo]),
      })),
    ];
    const linhasTxt = linhasMeta.map(m => [m.label, ...linhas.map(m.get)].join(';'));
    const csv = '﻿' + linhasTxt.join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `curva_s_${(obraNome || 'obra').toLowerCase().replace(/[^a-z0-9]+/g, '_')}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const { ultimoReal, idxHoje, idxHojeFloat, desvioAtual, desvioColor, dataCorteLabel } = info;
  const bgDesvio = desvioAtual == null ? '#f3f4f6' : desvioAtual >= 0 ? 'rgba(31,157,87,0.08)' : desvioAtual > -0.05 ? 'rgba(217,145,26,0.08)' : 'rgba(210,59,59,0.08)';

  return (
    <div className="card hoverable painel-gutter" style={{ padding:20, flex:1, minHeight:0, display:'flex', flexDirection:'column', gap:14 }}>

      <div className="kpi-row cols-3">
        <Balao titulo="Previsto Acum." cor={T.blue} bg="rgba(37,99,235,0.08)" borda="rgba(37,99,235,0.15)"
          corte={dataCorteLabel} valor={ultimoReal ? (ultimoReal.Previsto * 100).toFixed(2) + '%' : '—'} />
        <Balao titulo="Realizado Acum." cor={T.green} bg="rgba(31,157,87,0.08)" borda="rgba(31,157,87,0.15)"
          valor={ultimoReal ? (ultimoReal.Realizado * 100).toFixed(2) + '%' : '—'} />
        <Balao titulo="Desvio" cor={desvioColor} bg={bgDesvio} borda={`${desvioColor}40`}
          valor={ultimoReal && desvioAtual != null ? (desvioAtual > 0 ? '+' : '') + (desvioAtual * 100).toFixed(2) + '%' : '—'} />
      </div>

      <div className="chart-area">
        <CurvaChart chartData={linhas} idxHoje={idxHoje} idxHojeFloat={idxHojeFloat} realColor={desvioColor} hiddenLines={hiddenLines} forceAllTicks={todasColunas} mostrarRotulos={mostrarRotulos} modoZoom={modoZoom} />
        {modoZoom && (
          <div style={{ position:'absolute', bottom:8, right:8, background:'rgba(16,24,40,0.72)', backdropFilter:'blur(4px)', borderRadius:8, padding:'5px 10px', display:'flex', alignItems:'center', gap:8, pointerEvents:'none' }}>
            <svg width={13} height={13} viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
            <span style={{ fontSize:11, color:'rgba(255,255,255,0.85)', fontWeight:500, letterSpacing:'0.01em' }}>Scroll para zoom · Arraste para navegar</span>
          </div>
        )}
      </div>

      <div className="toolbar-wrap" style={{ gap:16 }}>
        <LegendItem ativo={!hiddenLines.has('Previsto')} onClick={() => toggle('Previsto')}>
          <svg width="20" height="10"><line x1="0" y1="5" x2="20" y2="5" stroke={T.blue} strokeWidth="2" strokeDasharray="6 3" opacity="0.7" /></svg>
          <span style={{ fontSize:12, color:T.mut, fontWeight:600 }}>Previsto</span>
        </LegendItem>
        <LegendItem ativo={!hiddenLines.has('Realizado')} onClick={() => toggle('Realizado')}>
          <svg width="20" height="10"><line x1="0" y1="5" x2="20" y2="5" stroke={desvioColor} strokeWidth="2.5" /></svg>
          <span style={{ fontSize:12, color:desvioColor, fontWeight:600 }}>Realizado</span>
        </LegendItem>
        <LegendItem ativo={!hiddenLines.has('Tendencia')} onClick={() => toggle('Tendencia')}>
          <svg width="20" height="10"><line x1="0" y1="5" x2="20" y2="5" stroke={T.mut2} strokeWidth="2" strokeDasharray="4 3" /></svg>
          <span style={{ fontSize:12, color:T.mut, fontWeight:600 }}>Tendência</span>
        </LegendItem>
        <div style={{ width:1, height:14, background:T.line, alignSelf:'center' }} />
        <LegendItem ativo={!hiddenLines.has('SemPrevisto')} onClick={() => toggle('SemPrevisto')}>
          <svg width="10" height="10"><rect x="0" y="1" width="10" height="8" fill={T.blue} opacity="0.35" rx="1" /></svg>
          <span style={{ fontSize:11, color:T.mut }}>Sem. Previsto</span>
        </LegendItem>
        <LegendItem ativo={!hiddenLines.has('SemRealizado')} onClick={() => toggle('SemRealizado')}>
          <svg width="10" height="10"><rect x="0" y="1" width="10" height="8" fill={desvioColor} opacity="0.6" rx="1" /></svg>
          <span style={{ fontSize:11, color:T.mut }}>Sem. Realizado</span>
        </LegendItem>

        <button onClick={() => setMostrarRotulos(v => !v)} title={mostrarRotulos ? 'Ocultar os valores percentuais sobre a curva' : 'Mostrar os valores percentuais sobre a curva'}
          className="margin-left-auto"
          style={{ marginLeft:'auto', display:'flex', alignItems:'center', gap:6, background: mostrarRotulos ? '#eef0f3' : T.ink, border:'none',
            color: mostrarRotulos ? T.body : '#fff', padding:'6px 12px', borderRadius:8, cursor:'pointer', fontSize:12, fontWeight:600 }}>
          <svg width={13} height={13} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            {mostrarRotulos
              ? <><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" /><circle cx="12" cy="12" r="3" /></>
              : <><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" /><circle cx="12" cy="12" r="3" /><line x1="3" y1="21" x2="21" y2="3" /></>}
          </svg>
          Rótulos
        </button>
        <button onClick={() => setModoZoom(v => !v)} title={modoZoom ? 'Sair do modo zoom' : 'Entrar no modo zoom — scroll para ampliar, arraste para navegar'}
          style={{ display:'flex', alignItems:'center', gap:6, background: modoZoom ? T.ink : '#eef0f3', border:'none',
            color: modoZoom ? '#fff' : T.body, padding:'6px 12px', borderRadius:8, cursor:'pointer', fontSize:12, fontWeight:600 }}>
          <svg width={13} height={13} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            {modoZoom ? <><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></> : <line x1="11" y1="8" x2="11" y2="14"/>}
          </svg>
          {modoZoom ? 'Sair do zoom' : 'Zoom'}
        </button>
        <button onClick={() => setTodasColunas(v => !v)} title={todasColunas ? 'Voltar à amostragem de semanas no gráfico' : 'Mostrar todas as semanas no eixo do gráfico'}
          style={{ display:'flex', alignItems:'center', gap:6, background: todasColunas ? T.ink : '#eef0f3', border:'none',
            color: todasColunas ? '#fff' : T.body, padding:'6px 12px', borderRadius:8, cursor:'pointer', fontSize:12, fontWeight:600 }}>
          <svg width={13} height={13} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <rect x="3" y="4" width="4" height="16" rx="1" /><rect x="10" y="4" width="4" height="16" rx="1" /><rect x="17" y="4" width="4" height="16" rx="1" />
          </svg>
          {todasColunas ? 'Semanas amostradas' : 'Ver todas as colunas'}
        </button>
        <button onClick={() => setTabelaAberta(true)} title="Ver todos os cortes em tabela numérica"
          style={{ display:'flex', alignItems:'center', gap:6, background:'#eef0f3', border:'none',
            color:T.body, padding:'6px 12px', borderRadius:8, cursor:'pointer', fontSize:12, fontWeight:600 }}>
          <svg width={14} height={14} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" /><line x1="3" y1="9" x2="21" y2="9" /><line x1="3" y1="15" x2="21" y2="15" /><line x1="12" y1="3" x2="12" y2="21" />
          </svg>
          Ver Tabela
        </button>
        {seletorCurva}
      </div>

      {tabelaAberta && (
        <div onClick={() => setTabelaAberta(false)} className="modal-overlay-in" style={{ position:'fixed', inset:0, zIndex:9999, background:'rgba(16,24,40,0.45)', backdropFilter:'blur(3px)', display:'flex', alignItems:'center', justifyContent:'center', padding:24 }}>
          <div onClick={e => e.stopPropagation()} className="modal-card-in" style={{ background:'#fff', border:'1px solid #e4e7ec', borderRadius:14, width:'100%', maxWidth:'min(1320px, 96vw)', maxHeight:'76vh', display:'flex', flexDirection:'column', overflow:'hidden', boxShadow:'0 24px 60px -12px rgba(16,24,40,0.25)' }}>
            <div style={{ padding:'13px 18px', borderBottom:'1px solid #eef0f3', display:'flex', alignItems:'center', gap:10, flexShrink:0 }}>
              <div style={{ flex:1, minWidth:0 }}>
                <div className="mono" style={{ fontSize:9, letterSpacing:'0.14em', color:'#aab2bf', textTransform:'uppercase', fontWeight:600, marginBottom:2 }}>Curva S — Análise Numérica</div>
                <div style={{ fontSize:16, fontWeight:700, color:'#192231' }}>{obraNome || ''}</div>
              </div>
              <button onClick={exportarCSV} title="Exportar como CSV"
                style={{ display:'flex', alignItems:'center', gap:6, background:'#eef0f3', border:'none', color:T.body, padding:'7px 12px', borderRadius:8, cursor:'pointer', fontSize:12, fontWeight:600, flexShrink:0 }}>
                <svg width={13} height={13} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" />
                </svg>
                CSV
              </button>
              <button onClick={() => setTabelaAberta(false)} style={{ background:'#eef0f3', border:'none', color:'#98a1b0', borderRadius:9, padding:'6px 11px', cursor:'pointer', fontSize:14, lineHeight:1, flexShrink:0 }}>✕</button>
            </div>
            <div ref={tabelaScrollRef} className="table-scroll-x" style={{ overflow:'auto', flex:1, minHeight:0 }}>
              <table style={{ borderCollapse:'separate', borderSpacing:0, whiteSpace:'nowrap' }}>
                <thead>
                  <tr>
                    <th colSpan={2} className="mono" style={{
                      position:'sticky', left:0, top:0, zIndex:4, background:'#dbe6f7',
                      fontSize:11, letterSpacing:'0.08em', textTransform:'uppercase', color:'#4d5868', fontWeight:700,
                      padding:'9px 10px', borderBottom:'1px solid #cbd6ea', borderRight:'1px solid #cbd6ea',
                      width: GRUPO_COL_W + LABEL_COL_W, minWidth: GRUPO_COL_W + LABEL_COL_W, textAlign:'left',
                    }}>Semana</th>
                    {linhas.map((r, i) => {
                      const ehHoje = i === idxHoje;
                      const ehProxCorte = info.proxCorte && r.semana === info.proxCorte.semana;
                      // Semanas já fechadas (até e incluindo "hoje") também têm
                      // produtividade diária lançada — cada uma abre o popup da
                      // SUA PRÓPRIA semana, não um histórico dentro do popup da
                      // próxima. Só a semana em andamento (próximo corte) ganha
                      // a pastilha visível; as fechadas só ficam clicáveis
                      // (cursor + tooltip), pra não poluir a tabela com uma
                      // pastilha em toda coluna.
                      const temDiario = i <= idxHoje || ehProxCorte;
                      return (
                        <th key={r.semana} data-col-idx={i}
                          onClick={temDiario ? () => setDiarioCorte(r) : undefined}
                          title={temDiario ? (ehProxCorte ? 'Ver produtividade diária da semana em andamento (parcial deste corte)' : 'Ver produtividade diária desta semana') : undefined}
                          style={{
                          position:'sticky', top:0, zIndex:1, background: ehHoje ? 'rgba(37,99,235,0.1)' : ehProxCorte ? 'rgba(37,99,235,0.06)' : '#dbe6f7',
                          padding:'7px 9px', borderBottom:'1px solid #cbd6ea', textAlign:'center',
                          minWidth:72, cursor: temDiario ? 'pointer' : 'default',
                          boxShadow: ehProxCorte ? 'inset 0 -2px 0 ' + T.blue : 'none',
                        }}>
                          <div style={{ fontSize:13.5, fontWeight:700, color: ehHoje ? T.blue : '#192231' }}>{String(r.semana).padStart(2,'0')}</div>
                          <div className="mono" style={{ fontSize:10.5, color:'#7c8aa5', marginTop:1 }}>{fmtDataLonga(r.data)}</div>
                          {ehProxCorte && (
                            <div style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:2, marginTop:2, color:T.blue }}>
                              <svg width={10} height={10} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                <rect x="3" y="4" width="18" height="18" rx="2" /><line x1="3" y1="10" x2="21" y2="10" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="16" y1="2" x2="16" y2="6" />
                              </svg>
                              <span style={{ fontSize:9, fontWeight:700, textTransform:'uppercase', letterSpacing:'0.04em' }}>Diário</span>
                            </div>
                          )}
                        </th>
                      );
                    })}
                  </tr>
                </thead>
                <tbody>
                  {LINHAS_TABELA_CURVA.map((linha, li) => {
                    const primeiraDoGrupo = li === 0 || LINHAS_TABELA_CURVA[li - 1].grupo !== linha.grupo;
                    const tamanhoGrupo = LINHAS_TABELA_CURVA.filter(l => l.grupo === linha.grupo).length;
                    const separador = linha.grupo === 'ACUMULADO' && primeiraDoGrupo;
                    return (
                      <tr key={`${linha.grupo}-${linha.label}`}>
                        {primeiraDoGrupo && (
                          <td rowSpan={tamanhoGrupo} className="mono" style={{
                            position:'sticky', left:0, zIndex:3, background:'#eef2fa', color:'#4d5868',
                            fontSize:11, fontWeight:700, letterSpacing:'0.08em', textAlign:'center',
                            borderRight:'1px solid #e4e7ec', borderTop: separador ? '2px solid var(--line)' : 'none',
                            writingMode:'vertical-rl', transform:'rotate(180deg)', padding:'10px 4px', width:GRUPO_COL_W, minWidth:GRUPO_COL_W,
                          }}>{linha.grupo}</td>
                        )}
                        <td style={{
                          position:'sticky', left:GRUPO_COL_W, zIndex:2, background:'#fff', color:T.body,
                          fontSize:13, fontWeight: linha.forte ? 700 : 500, padding:'7px 10px',
                          borderRight:'1px solid #eef0f3', borderTop: separador ? '2px solid var(--line)' : 'none',
                          width:LABEL_COL_W, minWidth:LABEL_COL_W,
                        }}>{linha.label}</td>
                        {linhas.map((r, i) => {
                          const ehHoje = i === idxHoje;
                          const valor = linha.especial === 'aderencia'
                            ? (() => { const a = aderenciaSemanal(r); return a != null ? `${a.toFixed(2)}%` : '—'; })()
                            : pct(r[linha.campo]);
                          const cor = linha.especial === 'aderencia' ? corAderencia(aderenciaSemanal(r)) : linha.cor(r[linha.campo]);
                          return (
                            <td key={r.semana} style={{
                              fontSize:13, textAlign:'center',
                              padding:'7px 9px', color:cor,
                              fontWeight: linha.forte || linha.especial === 'aderencia' ? 700 : 500,
                              background: ehHoje ? 'rgba(37,99,235,0.05)' : 'transparent',
                              borderTop: separador ? '2px solid var(--line)' : 'none',
                              borderBottom:'1px solid #f4f5f7',
                            }}>{valor}</td>
                          );
                        })}
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      )}

      {diarioCorte && (() => {
        const ehNN = NN_IDS_PORTAL.has(Number(obraId));
        const ordemDias = ehNN ? ORDEM_DIAS_NN : ORDEM_DIAS_PADRAO;
        // Janela sempre derivada da data do PRÓPRIO corte clicado (ver
        // useEffect acima) — não de "new Date()" — pro rótulo exibido bater
        // sempre com o período de fato buscado no Supabase, seja essa
        // semana a em-andamento ou uma já fechada.
        const janelaFim = parseDataCorte(diarioCorte.data);
        const janelaInicio = addDias(janelaFim, -6);
        const ehSemanaEmAndamento = info.proxCorte && diarioCorte.semana === info.proxCorte.semana;
        const meta = calcularMetaSemana(linhas, janelaInicio);
        const diasValores = ordemDias.map(([campo, label]) => ({ label, valor: diarioLinha ? parseValNum(diarioLinha[campo]) : null }));
        const comDado = diasValores.filter(d => d.valor != null);
        const avancoSemana = comDado.length ? comDado.reduce((s, d) => s + d.valor, 0) : null;
        return (
          <div onClick={() => setDiarioCorte(null)} className="modal-overlay-in" style={{ position:'fixed', inset:0, zIndex:10000, background:'rgba(16,24,40,0.45)', backdropFilter:'blur(3px)', display:'flex', alignItems:'center', justifyContent:'center', padding:24 }}>
            <div onClick={e => e.stopPropagation()} className="modal-card-in" style={{ background:'#fff', border:'1px solid #e4e7ec', borderRadius:14, width:'100%', maxWidth:720, maxHeight:'68vh', display:'flex', flexDirection:'column', overflow:'hidden', boxShadow:'0 24px 60px -12px rgba(16,24,40,0.25)' }}>
              <div style={{ padding:'16px 22px', borderBottom:'1px solid #eef0f3', display:'flex', alignItems:'center', gap:10, flexShrink:0 }}>
                <div style={{ flex:1, minWidth:0 }}>
                  <div className="mono" style={{ fontSize:10.5, letterSpacing:'0.14em', color:'#aab2bf', textTransform:'uppercase', fontWeight:600, marginBottom:3 }}>Produtividade Diária{ehSemanaEmAndamento ? ' · Parcial' : ''}</div>
                  <div style={{ fontSize:18, fontWeight:700, color:'#192231' }}>Semana de {fmtDataCurta(janelaInicio)} a {fmtDataCurta(janelaFim)}</div>
                  <div style={{ fontSize:13, color:'#7c8aa5', marginTop:2 }}>{obraNome || ''}</div>
                </div>
                <button onClick={() => setDiarioCorte(null)} style={{ background:'#eef0f3', border:'none', color:'#98a1b0', borderRadius:9, padding:'7px 12px', cursor:'pointer', fontSize:15, lineHeight:1, flexShrink:0 }}>✕</button>
              </div>
              <div style={{ overflow:'auto', flex:1, minHeight:0, padding:'8px 22px 20px' }}>
                {diarioCarregando && <div style={{ padding:'24px 0', textAlign:'center', fontSize:13, color:'#98a1b0' }}>Carregando…</div>}
                {!diarioCarregando && diarioErro && <div style={{ padding:'24px 0', textAlign:'center', fontSize:13, color:T.red }}>Erro ao carregar relatorio_produtividade_semanal</div>}
                {!diarioCarregando && !diarioErro && !diarioLinha && (
                  <div style={{ padding:'24px 0', textAlign:'center', fontSize:13, color:'#98a1b0' }}>Nenhum apontamento de produtividade lançado{ehSemanaEmAndamento ? ' ainda' : ''} nesta semana</div>
                )}
                {!diarioCarregando && !diarioErro && diarioLinha && (
                  <>
                    <div style={{ overflowX:'auto' }}>
                      <table style={{ width:'100%', borderCollapse:'collapse', marginTop:10, whiteSpace:'nowrap' }}>
                        <thead>
                          <tr>
                            {diasValores.map((d, i) => (
                              <th key={i} title={DIA_LABEL_LONGO[d.label] || d.label} style={{
                                fontSize:12, letterSpacing:'0.04em', textTransform:'uppercase', color:'#98a1b0',
                                fontWeight:700, padding:'6px 10px', textAlign:'center', borderBottom:'1px solid #eef0f3',
                              }}>{d.label}</th>
                            ))}
                            <th style={{ fontSize:12, letterSpacing:'0.04em', textTransform:'uppercase', color:'#4d5868', fontWeight:700, padding:'6px 10px', textAlign:'center', borderBottom:'1px solid #eef0f3', borderLeft:'1px solid #eef0f3' }}>Acumulado</th>
                          </tr>
                        </thead>
                        <tbody>
                          <tr>
                            {diasValores.map((d, i) => {
                              const abaixo = d.valor != null && meta.metaDiaria != null && d.valor < meta.metaDiaria;
                              const cor = d.valor == null ? '#98a1b0' : meta.metaDiaria == null ? T.body : (abaixo ? T.red : T.green);
                              return (
                                <td key={i} className="mono" style={{ fontSize:17, fontWeight:700, textAlign:'center', padding:'12px 10px', color:cor }}>
                                  {d.valor != null ? `${d.valor.toFixed(2)}%` : '—'}
                                </td>
                              );
                            })}
                            <td className="mono" style={{ fontSize:17, fontWeight:700, textAlign:'center', padding:'12px 10px', color:T.blue, borderLeft:'1px solid #eef0f3' }}>
                              {avancoSemana != null ? `${avancoSemana.toFixed(2)}%` : '—'}
                            </td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                    <div style={{ marginTop:14, fontSize:12.5, color:'#98a1b0', display:'flex', flexWrap:'wrap', gap:12 }}>
                      {meta.metaSemanal != null && <span>Meta semanal: <b className="mono" style={{ color:'#4d5868' }}>{meta.metaSemanal.toFixed(2)}%</b></span>}
                      {meta.metaDiaria != null && <span>Meta diária: <b className="mono" style={{ color:'#4d5868' }}>{meta.metaDiaria.toFixed(2)}%</b></span>}
                    </div>
                  </>
                )}
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

// ── Setor 2 — módulo de Encarregados, portado de LoopEncSection do dashboard
//    atual ("Performance de Encarregados", 2026-08-05, pedido explícito:
//    "Encarregados (Importar do ranking do dash antigo)"). Autossuficiente
//    (busca por obraId, mesmo padrão do ModuloEfetivo) — 4 fontes reais do
//    Supabase, sem nenhum dado inventado:
//      • vw_dados_tv         → aderência linear diária por encarregado
//      • cards_ativos        → elegibilidade (quem tem card ativo nesta obra)
//      • Apontamentos / v_indices_financeiros_diario / apontamento_efetivo
//                            → Qualidade / Produtividade / Colaboradores
//      • pts_emitidas        → horário de liberação de PT (só NN-AP/NN-UB)
//      • efetivo_diario_raw  → selo "Ausente" (projeto Efetivo)
//    Exportar PNG e clique no nome (cards do encarregado) foram portados
//    depois (2026-08-06/2026-08-11); toggle de Assiduidade portado em
//    2026-08-14 (métrica só informativa, não entra no score — mesma nota
//    da seção original).
function BadgeQualidade({ nome, qualidadeEnc, dim }){
  const q = qualidadeEnc[(nome || '').trim().toUpperCase()];
  if (!q) return <span style={{ fontSize:12, color:T.mut }}>—</span>;
  const n = q.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const pend = n.startsWith('pendente');
  const cor = pend ? T.mut : n === 'bom' ? T.green : n === 'satisfatorio' ? T.amber : T.red;
  const bg  = pend ? '#eef0f3' : n === 'bom' ? 'rgba(31,157,87,0.13)' : n === 'satisfatorio' ? 'rgba(217,145,26,0.13)' : 'rgba(210,59,59,0.13)';
  return <span style={{ display:'inline-block', padding:'3px 10px', borderRadius:8, fontSize:11.5, fontWeight:700, letterSpacing:'0.04em', textTransform:'uppercase', background:bg, color:cor, opacity: dim ? 0.45 : 1 }}>{q}</span>;
}
function BadgeProdutividade({ nome, produtividadeEnc, dim }){
  const v = produtividadeEnc[(nome || '').trim().toUpperCase()];
  if (v == null) return <span style={{ fontSize:12, color:T.mut }}>—</span>;
  const cor = v >= 1 ? T.green : T.red;
  const bg  = v >= 1 ? 'rgba(31,157,87,0.13)' : 'rgba(210,59,59,0.13)';
  return <span className="mono" style={{ display:'inline-block', padding:'3px 10px', borderRadius:8, fontSize:12, fontWeight:700, background:bg, color:cor, opacity: dim ? 0.45 : 1 }}>{v.toFixed(2)}</span>;
}
function BadgePT({ hhmm, dim }){
  if (!hhmm) return <span style={{ fontSize:12, color:T.mut }}>—</span>;
  const cor = hhmm <= '07:00' ? T.green : hhmm <= '07:15' ? T.amber : T.red;
  const bg  = hhmm <= '07:00' ? 'rgba(31,157,87,0.13)' : hhmm <= '07:15' ? 'rgba(217,145,26,0.13)' : 'rgba(210,59,59,0.13)';
  return <span className="mono" style={{ display:'inline-block', padding:'3px 10px', borderRadius:8, fontSize:12, fontWeight:700, background:bg, color:cor, opacity: dim ? 0.45 : 1 }}>{hhmm}</span>;
}
function LinhaEncarregado({ row, idx, temPT, showAssiduidade, qualidadeEnc, produtividadeEnc, colaboradoresEnc, horarioPT, onClickNome }){
  const dim = row.semApontamentos;
  const destaque = idx === 0 && !row.ausente && !row.semApontamentos;
  // Ausente: os indicadores do dia (qualidade/produtividade/colaboradores/PT)
  // não fazem sentido pra quem não trabalhou — mesma regra do dashboard
  // atual, ficam em branco em vez de mostrar um valor de outro dia.
  const pt = row.ausente ? null : horarioPT(row.nome, row.diaAderencia);
  const colab = row.ausente ? null : colaboradoresEnc[row.nome.trim().toUpperCase()];
  const scoreCor = row.score >= 100 ? T.green : row.score >= 80 ? T.blue : T.red;
  const scoreBg  = row.score >= 100 ? 'rgba(31,157,87,0.13)' : row.score >= 80 ? 'rgba(37,99,235,0.13)' : 'rgba(210,59,59,0.13)';
  return (
    <tr style={{
      borderTop: destaque ? '1px solid rgba(217,145,26,0.2)' : '1px solid #eef0f3',
      background: destaque ? 'linear-gradient(90deg, rgba(217,145,26,0.12) 0%, rgba(217,145,26,0.03) 100%)' : 'transparent',
    }}>
      <td style={{ padding:'10px 14px', opacity: dim ? 0.45 : 1 }}>
        {destaque
          ? <span className="mono" style={{ fontSize:16, fontWeight:700, color:T.amber }}>#1</span>
          : <span className="mono" style={{ fontSize:14, fontWeight:700, color:T.mut2 }}>{dim ? '—' : `#${idx + 1}`}</span>}
      </td>
      <td style={{ padding:'10px 14px', opacity: dim ? 0.45 : 1 }}>
        <div onClick={() => onClickNome(row.nome)} title="Ver cards ativos deste encarregado"
          style={{ fontSize: destaque ? 15 : 13.5, fontWeight:700, color: destaque ? T.amber : T.ink, cursor:'pointer',
            textDecoration:'underline', textDecorationColor: destaque ? 'rgba(217,145,26,0.4)' : T.mut2, textUnderlineOffset:3 }}>
          {row.nome.toUpperCase()}
        </div>
        {dim && !row.ausente && <div className="mono" style={{ fontSize:9, letterSpacing:'0.06em', color:T.mut2, textTransform:'uppercase', marginTop:2 }}>Sem apontamento no dia de referência</div>}
      </td>
      <td style={{ padding:'10px 14px', textAlign:'right' }}>{row.ausente ? <span style={{ fontSize:12, color:T.mut2 }}>—</span> : <BadgeQualidade nome={row.nome} qualidadeEnc={qualidadeEnc} dim={dim} />}</td>
      {showAssiduidade && (
        <td className="mono" style={{ padding:'10px 14px', textAlign:'right', fontSize:13, fontWeight:600, color:T.ink, opacity: dim ? 0.45 : 1 }}>
          {row.ausente || dim ? <span style={{ fontSize:12, color:T.mut2 }}>—</span> : `${row.assiduidade.toFixed(1)}%`}
        </td>
      )}
      <td style={{ padding:'10px 14px', textAlign:'right', fontSize:13, fontWeight:600, color:T.ink, opacity: dim ? 0.45 : 1 }}>{colab ?? '—'}</td>
      <td style={{ padding:'10px 14px', textAlign:'right' }}>{row.ausente ? <span style={{ fontSize:12, color:T.mut2 }}>—</span> : <BadgeProdutividade nome={row.nome} produtividadeEnc={produtividadeEnc} dim={dim} />}</td>
      <td style={{ padding:'10px 14px', textAlign:'right' }}>
        {row.ausente
          ? <span style={{ display:'inline-block', padding:'3px 10px', borderRadius:8, fontSize:11.5, fontWeight:800, letterSpacing:'0.05em', textTransform:'uppercase', background:T.red, color:'#fff' }}>Ausente</span>
          : row.aderenciaLin != null
            ? <span className="mono" style={{ display:'inline-block', padding:'3px 10px', borderRadius:8, fontSize:13, fontWeight:700, background: destaque ? 'rgba(217,145,26,0.18)' : scoreBg, color: destaque ? T.amber : scoreCor }}>{row.aderenciaLin.toFixed(1)}%</span>
            : <span style={{ display:'inline-block', padding:'3px 10px', borderRadius:8, fontSize:11.5, fontWeight:700, letterSpacing:'0.05em', textTransform:'uppercase', background:'#eef0f3', color:T.mut2, opacity:0.6 }}>Alocado</span>}
      </td>
      {temPT && <td style={{ padding:'10px 14px', textAlign:'right' }}>{row.ausente ? <span style={{ fontSize:12, color:T.mut2 }}>—</span> : <BadgePT hhmm={pt} dim={dim} />}</td>}
    </tr>
  );
}

// ── Popup "Cards Ativos" do encarregado — porta CardsModal do dashboard
// atual (2026-08-06, pedido explícito: "preciso do sistema de pop-ups que
// existiam no relatório antigo... exibe os cards ativos, com informações de
// efetivo alocado. Igual ao dash antigo"). Abre ao clicar no nome, na
// tabela de `ModuloEncarregados`. Autossuficiente — busca os próprios
// cards por nome (ilike, mesmo padrão do original) e filtra pela obra
// usando `origemTV` (mesma convenção confirmada no 25º passo, em vez do
// `MAPA_OBRAS_SUPABASE` do dashboard antigo).
function CardMetric({ label, value, cor, style, info, infoAlign }){
  const [showInfo, setShowInfo] = useState(false);
  return (
    <div style={{ minWidth:90, flexShrink:0, ...style }}>
      <div style={{ display:'flex', alignItems:'center', gap:4, marginBottom:3 }}>
        <div className="mono" style={{ fontSize:9, letterSpacing:'0.11em', color:T.mut2, textTransform:'uppercase', fontWeight:600, whiteSpace:'nowrap' }}>{label}</div>
        {info && (
          <div style={{ position:'relative', display:'flex' }} onMouseEnter={() => setShowInfo(true)} onMouseLeave={() => setShowInfo(false)}>
